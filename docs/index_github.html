<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>FF14 Market Analytics - Japan Datacenters & World Tracker</title>
  <!-- Google Fonts & Icons & Chart.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #7928ca;
      --accent-gold: #ffb703;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.25rem 1rem;
    }

    .container {
      max-width: 1850px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.2);
      color: var(--accent-blue);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-blue);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-blue);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* DC Top Navigation Tabs */
    .dc-tabs-container {
      display: flex;
      gap: 0.6rem;
      background: rgba(15, 23, 42, 0.7);
      padding: 0.45rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 1.2rem;
      overflow-x: auto;
    }

    .dc-tab-btn {
      flex: 1;
      min-width: 140px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .dc-tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .dc-tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.25), rgba(121, 40, 202, 0.3));
      border-color: rgba(0, 210, 255, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
    }

    /* Single-Row Unified Controls Bar: World Nav Tabs + Search Box + Sort Controls */
    .controls-bar {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 0.45rem 0.8rem;
      border-radius: 14px;
      min-height: 46px;
      box-sizing: border-box;
    }

    .world-nav-wrapper {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex: 1 1 auto;
      min-width: 320px;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .world-nav-bar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      padding: 0;
      margin: 0;
      flex: 1;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .world-nav-bar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .world-nav-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      box-sizing: border-box;
      flex-shrink: 0;
      margin: 0;
    }

    .world-nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .world-nav-btn.active {
      background: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }

    .search-box {
      position: relative;
      flex: 0 0 200px;
      max-width: 220px;
      display: flex;
      align-items: center;
      margin: 0;
    }

    .search-box i {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.38rem 0.8rem 0.38rem 2.4rem;
      color: var(--text-main);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
      margin: 0;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    /* Sort Toggle Group */
    .sort-control-container {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: transparent;
      padding: 0;
      border: none;
      flex-shrink: 0;
      margin: 0;
    }

    .sort-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .sort-toggle-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 2px;
      box-sizing: border-box;
      margin: 0;
    }

    .sort-toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0 0.7rem;
      height: 26px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sort-toggle-btn:hover {
      color: #ffffff;
    }

    .sort-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.25);
    }

    .filter-toggle-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .filter-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .filter-toggle-btn.active {
      background: linear-gradient(135deg, rgba(121, 40, 202, 0.3), rgba(0, 210, 255, 0.25));
      border-color: rgba(0, 210, 255, 0.5);
      color: #00d2ff;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.2);
    }

    /* World Grid (4 Columns Visible, Lightweight Carousel) */
    .grid-scroll-wrapper {
      position: relative;
      width: 100%;
    }

    .grid-slide-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      z-index: 90;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(0, 210, 255, 0.4);
      color: var(--accent-blue);
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .grid-slide-btn:hover {
      background: var(--accent-blue);
      color: #000000;
      border-color: var(--accent-blue);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
      transform: translateY(-50%) scale(1.12);
    }

    .grid-slide-left {
      left: -18px;
    }

    .grid-slide-right {
      right: -18px;
    }

    .world-grid {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      min-height: 650px;
      -ms-overflow-style: none;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .world-grid::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .world-column {
      flex: 0 0 calc((100% - 3rem) / 4);
      min-width: calc((100% - 3rem) / 4);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 250px);
      min-height: 620px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .world-column {
        flex: 0 0 100%;
        min-width: 100%;
      }
    }

    .world-column-header {
      padding: 0.85rem 1.1rem;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .world-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .world-count-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-blue);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
    }

    .world-item-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .world-item-list::-webkit-scrollbar {
      width: 5px;
    }

    .world-item-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* Enhanced Original Item Card Style */
    .item-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.9rem;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 210, 255, 0.35);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .item-card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
    }

    .item-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .item-header-text {
      flex: 1;
      min-width: 0;
    }

    .rank-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .item-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .lodestone-link-icon {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: color 0.2s ease;
    }

    .lodestone-link-icon:hover {
      color: var(--accent-blue);
    }

    .rank-tag {
      color: var(--accent-gold);
      font-weight: 700;
      margin-right: 0.35rem;
    }

    .item-stats-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    .item-section-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .latest-box {
      border-left: 3px solid var(--accent-green);
    }

    .history-box {
      border-left: 3px solid var(--accent-blue);
    }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      letter-spacing: 0.3px;
    }

    .sub-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.25rem 0.5rem;
      font-size: 0.74rem;
    }

    .stat-cell {
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
    }

    .stat-cell .lbl {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .stat-cell strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .chart-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(121, 40, 202, 0.2);
      border: 1px solid rgba(121, 40, 202, 0.4);
      color: #c084fc;
      padding: 0.38rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      justify-content: center;
      margin-top: 0.2rem;
    }

    .chart-btn:hover {
      background: rgba(121, 40, 202, 0.45);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(121, 40, 202, 0.4);
    }

    /* Grid Slide Container & Navigation Buttons */
    .grid-scroll-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .grid-slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      width: 38px;
      height: 64px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--accent-blue);
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .grid-slide-btn:hover {
      background: rgba(0, 210, 255, 0.25);
      color: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.4);
    }

    .grid-slide-left {
      left: -12px;
    }

    .grid-slide-right {
      right: -12px;
    }



    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-card {
      background: rgba(22, 30, 49, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      width: 92%;
      max-width: 850px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .modal-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 380px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-chart-simple"></i></div>
        <div>
          <h1>FF14 Market Tracker</h1>
          <div style="font-size:0.75rem; color:var(--text-muted);">Japan Datacenters & All 32 Worlds Comparison</div>
        </div>
      </div>
      <div class="header-badges">
        <div class="status-badge" id="lastUpdatedBadge">
          <span class="status-dot"></span> 最終更新: 読み込み中...
        </div>
      </div>
    </header>

    <!-- DC Selection Tabs -->
    <div class="dc-tabs-container">
      <button class="dc-tab-btn active" data-dc="Mana" onclick="switchDc('Mana')">
        <i class="fa-solid fa-server" style="color: #60a5fa;"></i> Mana (8 Worlds)
      </button>
      <button class="dc-tab-btn" data-dc="Elemental" onclick="switchDc('Elemental')">
        <i class="fa-solid fa-server" style="color: #a855f7;"></i> Elemental (8 Worlds)
      </button>
      <button class="dc-tab-btn" data-dc="Gaia" onclick="switchDc('Gaia')">
        <i class="fa-solid fa-server" style="color: #ec4899;"></i> Gaia (8 Worlds)
      </button>
      <button class="dc-tab-btn" data-dc="Meteor" onclick="switchDc('Meteor')">
        <i class="fa-solid fa-server" style="color: var(--accent-gold);"></i> Meteor (8 Worlds)
      </button>
    </div>

    <!-- Unified Single-Row Controls Bar: World Nav Tabs -> Sort Controls -> Search Box -->
    <div class="controls-bar">
      <!-- 1. World Nav Tabs -->
      <div class="world-nav-wrapper">
        <div class="world-nav-bar" id="worldNavBar">
          <!-- JavaScript Populated -->
        </div>
      </div>

      <!-- 2. Sort Control (売買数 / 流通ギル / 平均単価) -->
      <div class="sort-control-container">
        <span class="sort-label"><i class="fa-solid fa-arrow-down-wide-short"></i> 並び替え:</span>
        <div class="sort-toggle-group">
          <button class="sort-toggle-btn active" data-sort="velocity" onclick="setGlobalSort('velocity')">売買数</button>
          <button class="sort-toggle-btn" data-sort="revenue" onclick="setGlobalSort('revenue')">流通ギル</button>
          <button class="sort-toggle-btn" data-sort="avg_price" onclick="setGlobalSort('avg_price')">平均単価</button>
          <button class="sort-toggle-btn" data-sort="max_price" onclick="setGlobalSort('max_price')">💎 高額取引</button>
        </div>
      </div>

      <!-- 3. Crystal Exclusion Toggle Filter -->
      <button class="filter-toggle-btn active" id="crystalFilterBtn" onclick="toggleCrystalFilter()" title="シャード・クリスタル・クラスター類の表示/除外を切り替え">
        <i class="fa-solid fa-gem"></i> クリスタル除外: ON
      </button>

      <!-- 4. Search Box (Compact Width) -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="検索 (名前/ID)...">
      </div>
    </div>

    <!-- World 8 Columns Grid Container with Arrow Buttons -->
    <div class="grid-scroll-wrapper">
      <button class="grid-slide-btn grid-slide-left" onclick="slideWorldGrid(-1)" title="左へ移動">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="world-grid" id="worldGrid">
        <div style="text-align:center; padding:3rem; width:100%; color:var(--text-muted);">
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>マーケットデータを読み込み中...
        </div>
      </div>
      <button class="grid-slide-btn grid-slide-right" onclick="slideWorldGrid(1)" title="右へ移動">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <script>
    let allData = {};
    let activeDc = "Mana";
    let activeSortMode = "velocity";
    let excludeCrystals = true; // デフォルトでクリスタル類を除外
    let dcWorldsMap = {
      "Elemental": ["Carbuncle", "Gungnir", "Kujata", "Typhon", "Atomos", "Tonberry", "Aegis", "Garuda"],
      "Gaia": ["Alexander", "Bahamut", "Durandal", "Fenrir", "Ifrit", "Ridill", "Tiamat", "Ultima"],
      "Mana": ["Anima", "Asura", "Chocobo", "Hades", "Ixion", "Masamune", "Pandaemonium", "Titan"],
      "Meteor": ["Belias", "Mandragora", "Ramuh", "Shinryu", "Unicorn", "Valefor", "Yojimbo", "Zeromus"]
    };
    let allItemSearchDict = {};

    // クリスタル・シャード・クラスター・触媒の判定関数 (ID: 2~19 判定含む)
    function isCrystalItem(item) {
      if (!item) return false;
      const id = Number(item.item_id || 0);
      // FF14公式データ: シャード(2~7), クリスタル(8~13), クラスター(14~19)
      if (id >= 2 && id <= 19) return true;
      
      const cat = (item.meta && item.meta.category) ? item.meta.category : '';
      if (cat === "クリスタル" || cat === "触媒") return true;
      
      const name = item.item_name || '';
      if (name.includes("シャード") || name.includes("クリスタル") || name.includes("クラスター")) return true;
      
      return false;
    }

    function toggleCrystalFilter() {
      excludeCrystals = !excludeCrystals;
      const btn = document.getElementById('crystalFilterBtn');
      if (btn) {
        btn.classList.toggle('active', excludeCrystals);
        btn.innerHTML = `<i class="fa-solid fa-gem"></i> クリスタル除外: ${excludeCrystals ? 'ON' : 'OFF'}`;
      }
      renderWorldGrid();
    }

    function switchDc(dcName) {
      activeDc = dcName;
      document.querySelectorAll('.dc-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.dc === dcName);
      });
      requestAnimationFrame(() => {
        renderWorldGrid(true);
        const grid = document.getElementById('worldGrid');
        if (grid) grid.scrollTo({ left: 0, behavior: 'auto' });
      });
    }

    function setGlobalSort(mode) {
      activeSortMode = mode;
      document.querySelectorAll('.sort-toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sort === mode);
      });
      renderWorldGrid();
    }

    // 超軽量: 1列分（1ワールド分）ずつ滑らかに横スライド移動
    function slideWorldGrid(direction) {
      const grid = document.getElementById('worldGrid');
      if (!grid) return;

      const firstCol = grid.querySelector('.world-column');
      if (!firstCol) return;

      const stepWidth = firstCol.offsetWidth + 16;
      grid.scrollBy({ left: stepWidth * direction, behavior: 'smooth' });
    }

    function scrollToWorld(worldName) {
      const col = document.getElementById(`world-col-${worldName}`);
      if (col) {
        document.querySelectorAll('.world-nav-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.world === worldName);
        });
        col.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
      }
    }

    function formatTimeJST(rawTimeStr) {
      if (!rawTimeStr) return '-';
      let str = String(rawTimeStr).trim();
      if (!str.endsWith('Z') && !str.includes('+')) {
        str = str.replace(' ', 'T') + 'Z';
      }
      const d = new Date(str);
      if (isNaN(d.getTime())) return rawTimeStr;
      
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function formatChartLabelJST(rawTimeStr) {
      if (!rawTimeStr) return '';
      let str = String(rawTimeStr).trim();
      if (!str.endsWith('Z') && !str.includes('+')) {
        str = str.replace(' ', 'T') + 'Z';
      }
      const d = new Date(str);
      if (isNaN(d.getTime())) return rawTimeStr.replace(/^\d{4}-/, '');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${month}-${day} ${hours}:${minutes}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    let lastLoadedTime = null;

    async function loadData() {
      try {
        const cacheBuster = `t=${Date.now()}_${Math.random()}`;
        const res = await fetch(`data.json?${cacheBuster}`, { cache: "no-store" });
        if (!res.ok) throw new Error('Data fetch failed');
        const data = await res.json();

        const lastUpdatedEl = document.getElementById('lastUpdatedBadge');
        if (lastUpdatedEl) {
          const formattedLastUpdated = formatTimeJST(data.last_updated);
          lastUpdatedEl.innerHTML = `<span class="status-dot"></span> 最終更新: ${formattedLastUpdated}`;
        }

        // データに更新がない場合は再描画を行わない（チカチカ防止）
        if (lastLoadedTime && lastLoadedTime === data.last_updated) {
          return;
        }
        lastLoadedTime = data.last_updated;

        allData = data.data || {};
        if (data.dc_worlds) {
          dcWorldsMap = data.dc_worlds;
        }

        renderWorldGrid();

      } catch (err) {
        console.error("loadData error:", err);
        document.getElementById('worldGrid').innerHTML = `
          <div style="text-align:center; padding:3rem; width:100%; color:#ef4444;">
            <i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>データ取得エラー
          </div>
        `;
      }
    }

    function renderWorldGrid(forceFull = false) {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      const worlds = dcWorldsMap[activeDc] || [];
      const dcItems = allData[activeDc] || [];

      // Render World Quick Nav Bar
      const navBar = document.getElementById('worldNavBar');
      navBar.innerHTML = worlds.map((w, idx) => `
        <button class="world-nav-btn ${idx === 0 ? 'active' : ''}" data-world="${w}" onclick="scrollToWorld('${w}')">
          <i class="fa-solid fa-globe"></i> ${w}
        </button>
      `).join('');

      // Filter items by crystal exclusion toggle & search term
      let filteredItems = dcItems;

      if (excludeCrystals) {
        filteredItems = filteredItems.filter(item => !isCrystalItem(item));
      }

      if (searchTerm) {
        filteredItems = filteredItems.filter(item => 
          (item.item_name && item.item_name.toLowerCase().includes(searchTerm)) ||
          item.item_id.toString().includes(searchTerm)
        );
      }

      // Build World Grid Columns (8 Worlds, Top 30 Items Each)
      const grid = document.getElementById('worldGrid');
      
      grid.innerHTML = worlds.map(worldName => {
        // Prepare items for this world with world-specific metrics (日当たり売買数 50以上限定)
        const worldItems = (allData[worldName] || []).filter(item => {
          if (excludeCrystals && isCrystalItem(item)) return false;
          if (searchTerm && !item.item_name.toLowerCase().includes(searchTerm) && !String(item.item_id).includes(searchTerm)) return false;
          return true;
        });

        // Sort worldItems by activeSortMode with appropriate noise reduction filters
        if (activeSortMode === 'revenue') {
          // 流通ギルモード: 1日1個以上売れている実績ある品目(フォーチュンカロット等)に絞り込んでソート
          let validItems = worldItems.filter(item => (item.sale_velocity || 0) >= 1.0 || isCrystalItem(item));
          validItems.sort((a, b) => ((b.avg_price || 0) * (b.sale_velocity || 0)) - ((a.avg_price || 0) * (a.sale_velocity || 0)));
          worldItems.length = 0;
          worldItems.push(...validItems);
        } else if (activeSortMode === 'avg_price') {
          // 平均単価モード: 1日1個以上売れている品目に限定してソート
          let validItems = worldItems.filter(item => (item.sale_velocity || 0) >= 1.0);
          validItems.sort((a, b) => (b.avg_price || 0) - (a.avg_price || 0));
          worldItems.length = 0;
          worldItems.push(...validItems);
        } else if (activeSortMode === 'max_price') {
          // 高額取引モード: 平均価格が最高値の35%以上ある本物の高額品のみに厳選ソート (資金移動・異常値を100%遮断)
          let cleanItems = worldItems.filter(item => (item.max_price || 0) > 0 && (((item.avg_price || 0) / item.max_price) >= 0.35));
          cleanItems.sort((a, b) => (b.max_price || 0) - (a.max_price || 0));
          worldItems.length = 0;
          worldItems.push(...cleanItems);
        } else if (activeSortMode === 'min_price') {
          worldItems.sort((a, b) => (b.min_price || 0) - (a.min_price || 0));
        } else {
          // Default: velocity (sale_velocity)
          worldItems.sort((a, b) => (b.sale_velocity || 0) - (a.sale_velocity || 0));
        }

        // 上位30件に絞って超高速表示！
        const displayItems = worldItems.slice(0, 30);

        const cardListHtml = displayItems.length === 0 ? `
          <div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.82rem;">
            プールデータ未登録（データ収集待ち）
          </div>
        ` : displayItems.map((item, idx) => {
          let displayTitle = item.item_name || `Item #${item.item_id}`;
          let cleanTitle = escapeHtml(displayTitle).replace(/\s*\[(NQ|HQ)\]\s*$/i, "").trim();

          const cMin = (item.min_price || 0).toLocaleString();
          const cAvg = Math.round(item.avg_price || 0).toLocaleString();
          const cMax = (item.max_price || 0).toLocaleString();
          const cStock = (item.units_for_sale || 0).toLocaleString();
          const cVel = (item.sale_velocity || 0).toLocaleString();

          // 日商（流通ギル = 平均単価 × 日当売買数）
          const dailyRevenue = Math.round((item.avg_price || 0) * (item.sale_velocity || 0)).toLocaleString();

          // 直通100%正解 v2.xivapi URL優先＆安全フォールバック構成
          let primaryIcon = item.icon_url || 'https://v2.xivapi.com/api/asset?path=ui/icon/020000/021001_hr1.tex&format=png';
          const safeFallback = 'https://v2.xivapi.com/api/asset?path=ui/icon/020000/021001_hr1.tex&format=png';

          const iconImg = `<img class="item-icon" src="${primaryIcon}" alt="" onerror="this.onerror=null; this.src='${safeFallback}';">`;

          const lodestoneUrl = `https://jp.finalfantasyxiv.com/lodestone/playguide/db/item/?patch=&db_search_category=item&category2=&q=${encodeURIComponent(displayTitle)}`;

          return `
            <div class="item-card" data-velocity="${item.sale_velocity || 0}" data-avg_price="${item.avg_price || 0}" data-min_price="${item.min_price || 0}">
              <div class="item-card-header">
                ${iconImg}
                <div class="item-header-text">
                  <span class="item-card-title">
                    <span class="rank-tag">#${idx + 1}</span>${cleanTitle}
                    <a href="${lodestoneUrl}" target="_blank" rel="noopener" class="lodestone-link-icon" title="Lodestoneで検索">
                      <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                  </span>
                </div>
              </div>

              <!-- 市場ステータス -->
              <div class="item-section-box latest-box">
                <!-- 上段: 売買数 & 流通ギル (日商) -->
                <div class="sub-grid-2" style="display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid rgba(255,255,255,0.08);">
                  <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><span class="lbl" style="font-size:0.7rem;"><i class="fa-solid fa-bolt" style="color:var(--accent-blue);"></i> 売買数:</span> <strong style="color:var(--accent-blue); font-size:0.8rem;">${cVel}個/日</strong></div>
                  <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><span class="lbl" style="font-size:0.7rem;"><i class="fa-solid fa-coins" style="color:#ffb703;"></i> 流通ギル:</span> <strong style="color:#ffb703; font-size:0.8rem;">${dailyRevenue}G/日</strong></div>
                </div>

                <!-- 下段: 4カラム テーブル形式 (ラベル横並び・数値直下) -->
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; gap: 4px 2px; background: rgba(0, 0, 0, 0.25); border-radius: 6px; padding: 6px 2px; border: 1px solid rgba(255, 255, 255, 0.05);">
                  <!-- ラベルヘッダー行 -->
                  <div style="font-size: 0.68rem; color: #94a3b8;"><i class="fa-solid fa-tag" style="color:#38bdf8;"></i> 最安値</div>
                  <div style="font-size: 0.68rem; color: #94a3b8;"><i class="fa-solid fa-scale-balanced" style="color:#c084fc;"></i> 平均値</div>
                  <div style="font-size: 0.68rem; color: #94a3b8;"><i class="fa-solid fa-arrow-trend-up" style="color:#f472b6;"></i> 最高値</div>
                  <div style="font-size: 0.68rem; color: #94a3b8;"><i class="fa-solid fa-boxes-stacked" style="color:#4ade80;"></i> 在庫数</div>
                  
                  <!-- 数値データ行 (真下) -->
                  <div style="font-weight: 700; font-size: 0.78rem; color: #38bdf8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${cMin}G</div>
                  <div style="font-weight: 700; font-size: 0.78rem; color: #c084fc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${cAvg}G</div>
                  <div style="font-weight: 700; font-size: 0.78rem; color: #f472b6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${cMax}G</div>
                  <div style="font-weight: 700; font-size: 0.78rem; color: #4ade80; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${cStock}個</div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="world-column" id="world-col-${worldName}">
            <div class="world-column-header">
              <div class="world-name"><i class="fa-solid fa-globe" style="color: var(--accent-blue);"></i> ${worldName}</div>
              <span class="world-count-badge">${displayItems.length}件</span>
            </div>
            <div class="world-item-list">
              ${cardListHtml}
            </div>
          </div>
        `;
      }).join('');

      // 遅延画像読み込み: 画面内に入ったアイコンだけ読み込む
      requestAnimationFrame(() => {
        const lazyImages = grid.querySelectorAll('img[data-src]');
        if ('IntersectionObserver' in window) {
          const imgObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                delete img.dataset.src;
                imgObserver.unobserve(img);
              }
            });
          }, { root: grid, rootMargin: '200px' });
          lazyImages.forEach(img => imgObserver.observe(img));
        } else {
          lazyImages.forEach(img => { img.src = img.dataset.src; });
        }
      });
    }

    let searchDebounceTimer = null;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        renderWorldGrid();
      }, 250);
    });

    setInterval(loadData, 60000);
    loadData();

    async function loadItemSearchDict() {
      try {
        const res = await fetch('items_search.json');
        if (res.ok) {
          allItemSearchDict = await res.json();
        }
      } catch (e) {
        console.warn("Could not load items_search.json:", e);
      }
    }
    loadItemSearchDict();
  </script>
</body>
</html>
