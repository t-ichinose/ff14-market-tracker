<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>FF14 Market Tracker Mobile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #7928ca;
      --accent-gold: #ffb703;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
    }

    .history-table-container {
      max-height: 320px;
      overflow-y: auto;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    @media (min-width: 769px) {
      #itemDetailModal {
        display: none !important;
      }
      .pc-dashboard-container {
        display: flex !important;
        gap: 1.25rem !important;
        align-items: start !important;
        margin-top: 0.35rem;
        width: 100%;
      }
      .left-card-scroll-pane {
        width: 440px !important;
        flex: 0 0 440px !important;
        position: sticky !important;
        top: 75px !important;
        height: calc(100vh - 90px) !important;
        max-height: calc(100vh - 90px) !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 0.85rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }
      .pc-dashboard-container.view-analytics #arbitrageGridWrapper,
      .pc-dashboard-container.view-analytics #arbitrageMonitorWrapper {
        display: none !important;
      }
      .pc-dashboard-container.view-analytics #analyticsMonitorWrapper {
        display: flex !important;
      }
      .pc-dashboard-container.view-arbitrage #analyticsGridWrapper,
      .pc-dashboard-container.view-arbitrage #analyticsMonitorWrapper {
        display: none !important;
      }
      .pc-dashboard-container.view-arbitrage #arbitrageMonitorWrapper {
        display: flex !important;
      }
      .left-card-scroll-pane .grid-scroll-wrapper,
      .left-card-scroll-pane .world-grid-scroll-container,
      .left-card-scroll-pane .world-column {
        flex: 1 !important;
        height: 100% !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        width: 100% !important;
      }
      .left-pane-header {
        flex-shrink: 0 !important;
        background: rgba(15, 23, 42, 0.95) !important;
        border: 1px solid var(--card-border) !important;
        border-radius: 12px !important;
        padding: 0.6rem 0.75rem !important;
        margin-bottom: 0.65rem !important;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35) !important;
      }
      .world-item-list {
        flex: 1 !important;
        height: 100% !important;
        min-height: 0 !important;
        overflow-y: auto !important;
        padding-right: 4px;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .world-item-list::-webkit-scrollbar {
        width: 6px;
      }
      .world-item-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      .pc-right-pane {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
        min-width: 0 !important;
        position: sticky !important;
        top: 75px !important;
        height: calc(100vh - 90px) !important;
        max-height: calc(100vh - 90px) !important;
        overflow: hidden !important;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 1.1rem 1.25rem 1.1rem 1.25rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }
      .pc-right-pane .history-table-container {
        max-height: none !important;
        flex: 1 !important;
        height: 100% !important;
      }
      .pc-right-pane::-webkit-scrollbar {
        width: 6px;
      }
      .pc-right-pane::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      .slider-nav-btn, .grid-slide-btn {
        display: none !important;
      }
      .pc-world-select {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--accent-blue);
        border-radius: 8px;
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 3px 6px;
        outline: none;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        transition: all 0.2s ease;
      }
      .pc-world-select:hover {
        border-color: #38bdf8;
        box-shadow: 0 0 14px rgba(0, 210, 255, 0.4);
      }
      .pc-world-select optgroup {
        background: #0f172a;
        color: var(--accent-gold);
        font-weight: 700;
      }
      .pc-world-select option {
        background: #0f172a;
        color: #ffffff;
        font-weight: 600;
      }
      .dc-summary-card.clickable-card {
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .dc-summary-card.clickable-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 210, 255, 0.25);
        border-color: var(--accent-blue) !important;
      }
      .item-card.active-card {
        border-color: var(--accent-blue) !important;
        background: linear-gradient(135deg, rgba(0, 210, 255, 0.12) 0%, rgba(15, 23, 42, 0.95) 100%) !important;
        box-shadow: 0 0 16px rgba(0, 210, 255, 0.45) !important;
      }
    }

    .container {
      max-width: 1850px;
      margin: 0 auto;
      height: 100vh;
      padding: 0.5rem 0.8rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 0.8rem;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* View Mode Switcher Buttons */
    .view-mode-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .view-mode-tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .view-mode-tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(255, 183, 3, 0.2));
      border-color: rgba(255, 183, 3, 0.4);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.2);
    }

    /* Arbitrage Grid & Card Styles */
    .arbitrage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .arbitrage-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .arbitrage-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 183, 3, 0.5);
      box-shadow: 0 8px 24px rgba(255, 183, 3, 0.15);
    }

    .arbitrage-card-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }



    .arb-route-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
    }

    .arb-route-box {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      flex: 1;
      overflow: hidden;
    }

    .arb-route-box.buy-box {
      border-left: 3px solid var(--accent-green);
      padding-left: 0.5rem;
    }

    .arb-route-box.sell-box {
      border-left: 3px solid var(--accent-blue);
      padding-left: 0.5rem;
    }

    .arb-box-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .arb-box-world {
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arb-box-price {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
    }

    .arb-route-arrow {
      color: var(--accent-gold);
      font-size: 1.1rem;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .arb-profit-summary {
      display: grid;
      grid-template-columns: 1fr 0.9fr 1.25fr;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 183, 3, 0.06);
      border: 1px solid rgba(255, 183, 3, 0.2);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font-size: 0.72rem;
    }

    .arb-stat-item {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      overflow: hidden;
    }

    .arb-stat-item.gold-highlight {
      background: rgba(255, 183, 3, 0.12);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 183, 3, 0.3);
    }




    /* Single-Row Unified Controls Bar: World Nav Tabs + Search Box + Sort Controls */






    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.38rem 0.8rem 0.38rem 2.4rem;
      color: var(--text-main);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
      margin: 0;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }



    .sort-toggle-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 2px;
      box-sizing: border-box;
      margin: 0;
    }

    .sort-toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0 0.7rem;
      height: 26px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sort-toggle-btn:hover {
      color: #ffffff;
    }

    .sort-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.25);
    }

    /* View Toggle Group (Arbitrage Monitor Sub-tabs) */
    .view-toggle-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2px;
      box-sizing: border-box;
    }

    .view-toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .view-toggle-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .view-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.25);
    }

    .filter-toggle-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .filter-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .filter-toggle-btn.active {
      background: linear-gradient(135deg, rgba(121, 40, 202, 0.3), rgba(0, 210, 255, 0.25));
      border-color: rgba(0, 210, 255, 0.5);
      color: #00d2ff;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.2);
    }

    /* World Grid (4 Columns Visible, Lightweight Carousel) */
    .world-grid {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      height: 100%;
      min-height: 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
      scroll-behavior: smooth;
      align-items: stretch;
    }

    .world-grid::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .world-column {
      flex: 0 0 calc((100% - 3rem) / 4);
      min-width: calc((100% - 3rem) / 4);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
    }



    /* Grid Slide Container & Navigation Buttons */
    .grid-scroll-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }





    .world-item-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0.75rem 0.75rem 1.2rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .world-item-list::-webkit-scrollbar {
      width: 5px;
    }

    .world-item-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* Enhanced Original Item Card Style */
    .item-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.7rem 0.75rem;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      cursor: pointer;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 210, 255, 0.35);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .item-card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
    }

    .item-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .item-header-text {
      flex: 1;
      min-width: 0;
    }

    .item-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .lodestone-link-icon {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: color 0.2s ease;
    }

    .lodestone-link-icon:hover {
      color: var(--accent-blue);
    }

    .rank-tag {
      color: var(--accent-gold);
      font-weight: 700;
      margin-right: 0.35rem;
    }



    /* DC内ハイライト比較カード (4カラム: 最安値・最安平均・最高平均・最高値) */
    .dc-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }



    .dc-summary-card {
      background: rgba(11, 17, 30, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dc-summary-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      filter: brightness(1.15);
    }

    .modal-card.arb-modal-wide {
      max-width: 1320px;
    }

    .arb-modal-dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }



    .arb-world-column-card {
      background: rgba(11, 17, 30, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .arb-world-column-card.buy-side {
      border-top: 4px solid var(--accent-green);
    }

    .arb-world-column-card.sell-side {
      border-top: 4px solid var(--accent-blue);
    }

    .copy-icon-btn {
      background: rgba(255, 183, 3, 0.12);
      border: 1px solid rgba(255, 183, 3, 0.35);
      color: #ffb703;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .copy-icon-btn:hover {
      background: #ffb703;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
      transform: scale(1.05);
    }

    .copy-icon-btn.copied {
      background: rgba(74, 222, 128, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .dc-summary-card.min-card {
      border-left: 4px solid var(--accent-green);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.min-avg-card {
      border-left: 4px solid #c084fc;
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.max-avg-card {
      border-left: 4px solid #f472b6;
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.max-card {
      border-left: 4px solid #ef4444;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .dc-summary-world {
      font-weight: 700;
      font-size: 0.92rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dc-summary-price {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      white-space: nowrap;
    }

    .min-card .dc-summary-price { color: var(--accent-green); }
    .min-avg-card .dc-summary-price { color: #c084fc; }
    .max-avg-card .dc-summary-price { color: #f472b6; }
    .max-card .dc-summary-price { color: #ef4444; }



    /* History Table */
    .history-table-container {
      background: rgba(11, 17, 30, 0.7);

  <script>
// ==========================================
    // FF14 Market Tracker - Mobile Core Engine
    // Production Grade Refactored & Optimized
    // ==========================================

    // Application State Variables
    let allData = {};
    let activeSortMode = 'velocity'; // 'velocity' | 'revenue' | 'min_price'
    let excludeCrystals = true;
    let currentMobileSubtab = 0; // 0: Item List, 1: History/Trend, 2: Listings
    let selectedMonitorItemId = null;
    let selectedMonitorItemName = null;
    let selectedMonitorIconUrl = null;

    let mobExcludeNqFilter = false;
    let mobListingsScope = 'world'; // 'world' | 'dc' | 'all'
    let mobListingsExcludeNq = false;
    
    // Efficient Caches
    window.mobileListingsCache = window.mobileListingsCache || {};
    const sparklineCache = new Map();
    const lowestPriceCache = new Map();
    let currentListingsFetchController = null;

    // Datacenter World Mapping Constants
    const dcWorldsMap = {
      'Elemental': ['Carbuncle', 'Kujata', 'Typhon', 'Garuda', 'Atomos', 'Tonberry', 'Aegis', 'Gungnir'],
      'Gaia': ['Alexander', 'Fenrir', 'Ifrit', 'Bahamut', 'Durandal', 'Tiamat', 'Ultima', 'Yojimbo'],
      'Mana': ['Chocobo', 'Hide', 'Anima', 'Asura', 'Titan', 'Pandaemonium', 'Hades', 'Masamune'],
      'Meteor': ['Belias', 'Mandragora', 'Ramuh', 'Shinryu', 'Unicorn', 'Valefor', 'Zeromus', 'Ixion']
    };

    function findDcForWorld(worldName) {
      if (!worldName) return 'Mana';
      for (const [dc, worlds] of Object.entries(dcWorldsMap)) {
        if (worlds.includes(worldName)) return dc;
      }
      return 'Mana';
    }

    // Helper: Safe HTML Escaping
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Helper: Compute Exact XIVAPI Icon URL
    function getComputedIconUrl(itemId) {
      const id = Number(itemId) || 0;
      const folder = Math.floor(id / 1000) * 1000;
      const folderStr = String(folder).padStart(6, '0');
      const iconStr = String(id).padStart(6, '0');
      return `https://v2.xivapi.com/api/asset?path=ui/icon/${folderStr}/${iconStr}_hr1.tex&format=png`;
    }

    // Helper: Crystal & Catalyst Filter Check
    function isCrystalItem(item) {
      if (!item) return false;
      const id = typeof item === 'number' ? item : Number(item.item_id || 0);
      if (id >= 2 && id <= 19) return true;
      
      if (typeof item === 'object') {
        const cat = (item.meta && item.meta.category) ? item.meta.category : '';
        if (cat === "クリスタル" || cat === "触媒") return true;
        const name = item.item_name || item.name || '';
        if (name.includes("シャード") || name.includes("クリスタル") || name.includes("クラスター")) return true;
      }
      return false;
    }

    function toggleCrystalFilter() {
      excludeCrystals = !excludeCrystals;
      const btns = document.querySelectorAll('#crystalFilterBtn, #pcCrystalFilterBtn, .crystal-filter-btn');
      btns.forEach(btn => {
        btn.classList.toggle('active', excludeCrystals);
        btn.innerHTML = `<i class="fa-solid fa-gem"></i> ${excludeCrystals ? 'ON' : 'OFF'}`;
      });
      renderMobileItemList();
    }

    function setGlobalSort(mode) {
      activeSortMode = mode;
      const btnVel = document.getElementById('mobSortVelocity');
      const btnRev = document.getElementById('mobSortRevenue');
      const btnMin = document.getElementById('mobSortMinPrice');
      if (btnVel) btnVel.classList.toggle('active', mode === 'velocity');
      if (btnRev) btnRev.classList.toggle('active', mode === 'revenue');
      if (btnMin) btnMin.classList.toggle('active', mode === 'min_price');

      if (typeof switchMobileSubtab === 'function') {
        switchMobileSubtab(0);
      }

      const viewport = document.getElementById('mobileViewport');
      if (viewport) {
        viewport.scrollTop = 0;
      }

      renderMobileItemList();
    }

    // Helper: Format Time Strings
    function formatTimeLocal(rawTimeStr) {
      if (!rawTimeStr) return '-';
      try {
        let str = String(rawTimeStr).trim();
        if (!str.endsWith('Z') && !str.includes('+')) {
          str = str.replace(' ', 'T') + 'Z';
        }
        const d = new Date(str);
        if (isNaN(d.getTime())) return String(rawTimeStr);

        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${m}/${day} ${h}:${min}`;
      } catch (e) {
        return String(rawTimeStr);
      }
    }

    function formatHistoryTime(rawTime) {
      if (!rawTime && rawTime !== 0) return '-';
      try {
        let d;
        if (typeof rawTime === 'number') {
          d = new Date(rawTime < 1e11 ? rawTime * 1000 : rawTime);
        } else {
          let str = String(rawTime).trim();
          if (!str.endsWith('Z') && !str.includes('+')) {
            str = str.replace(' ', 'T') + 'Z';
          }
          d = new Date(str);
        }
        if (isNaN(d.getTime())) return String(rawTime);

        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${m}/${day} ${h}:${min}`;
      } catch (e) {
        return String(rawTime);
      }
    }

    function getAggregationPeriodStr(lastUpdatedIso) {
      if (!lastUpdatedIso) return '7日間集計';
      try {
        let str = String(lastUpdatedIso).trim();
        if (!str.endsWith('Z') && !str.includes('+')) {
          str = str.replace(' ', 'T') + 'Z';
        }
        const endD = new Date(str);
        if (isNaN(endD.getTime())) return '7日間集計';

        const startD = new Date(endD.getTime() - 6 * 24 * 60 * 60 * 1000);
        const sm = String(startD.getMonth() + 1).padStart(2, '0');
        const sd = String(startD.getDate()).padStart(2, '0');
        const em = String(endD.getMonth() + 1).padStart(2, '0');
        const ed = String(endD.getDate()).padStart(2, '0');
        return `${sm}/${sd}〜${em}/${ed} (7日間集計)`;
      } catch (e) {
        return '7日間集計';
      }
    }

    // Helper: Compute Daily Trend & Trend Pct Safely
    function getOrComputeDailyTrend(item) {
      if (!item) return { trendPct: 0, trend: [] };
      if (typeof item.trend_pct === 'number' && Array.isArray(item.daily_trend) && item.daily_trend.length > 0) {
        return { trendPct: item.trend_pct, trend: item.daily_trend };
      }

      const history = item.history || item.daily_trend || [];
      if (!Array.isArray(history) || history.length === 0) {
        return { trendPct: 0, trend: [] };
      }

      // If item.history contains raw sale transactions, group by date
      if (history[0] && (history[0].ts || history[0].timestamp || history[0].price)) {
        const dailyMap = {};
        history.forEach(h => {
          const rawTime = (typeof h.ts !== 'undefined') ? h.ts : (h.timestamp || h.time);
          if (!rawTime) return;
          const d = new Date(typeof rawTime === 'number' ? (rawTime < 1e11 ? rawTime * 1000 : rawTime) : rawTime);
          if (isNaN(d.getTime())) return;
          const dateStr = `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
          
          if (!dailyMap[dateStr]) {
            dailyMap[dateStr] = { totalPrice: 0, totalQty: 0 };
          }
          const price = h.price || h.price_per_unit || 0;
          const qty = h.qty || h.quantity || 1;
          dailyMap[dateStr].totalPrice += price * qty;
          dailyMap[dateStr].totalQty += qty;
        });

        const trendArray = Object.keys(dailyMap).sort().map(dateKey => ({
          date: dateKey,
          weighted_avg: Math.round(dailyMap[dateKey].totalPrice / (dailyMap[dateKey].totalQty || 1)),
          volume: dailyMap[dateKey].totalQty
        }));

        if (trendArray.length < 2) return { trendPct: 0, trend: trendArray };

        const firstPrice = trendArray[0].weighted_avg;
        const lastPrice = trendArray[trendArray.length - 1].weighted_avg;
        const pct = firstPrice > 0 ? ((lastPrice - firstPrice) / firstPrice) * 100 : 0;
        return { trendPct: pct, trend: trendArray };
      }

      return { trendPct: item.trend_pct || 0, trend: history };
    }

    // Helper: Sparkline SVG Generator with Memoization Cache
    function generateSparklineSvg(item, width = 56, height = 16) {
      if (!item) return `<svg width="${width}" height="${height}"></svg>`;
      const cacheKey = `${item.item_id}_${width}_${height}`;
      if (sparklineCache.has(cacheKey)) {
        return sparklineCache.get(cacheKey);
      }

      const trendRes = getOrComputeDailyTrend(item);
      const points = trendRes.trend || [];
      if (!Array.isArray(points) || points.length < 2) {
        const emptySvg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><line x1="0" y1="${height/2}" x2="${width}" y2="${height/2}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2"/></svg>`;
        sparklineCache.set(cacheKey, emptySvg);
        return emptySvg;
      }

      const values = points.map(p => (typeof p.weighted_avg === 'number' ? p.weighted_avg : (p.price || 0)));
      const min = Math.min(...values);
      const max = Math.max(...values);
      const range = max - min || 1;

      const pct = trendRes.trendPct || 0;
      const strokeColor = pct > 0 ? '#4ade80' : (pct < 0 ? '#f87171' : '#94a3b8');

      const pathCoords = values.map((val, idx) => {
        const x = (idx / (values.length - 1)) * width;
        const y = height - ((val - min) / range) * (height - 4) - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' L ');

      const svgStr = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="overflow:visible;"><path d="M ${pathCoords}" fill="none" stroke="${strokeColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      sparklineCache.set(cacheKey, svgStr);
      return svgStr;
    }

    // Helper: Fetch with Timeout (Default 15s)
    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 15000 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(id);
        return response;
      } catch (error) {
        clearTimeout(id);
        throw error;
      }
    }

    // Helper: Selected World Selector
    function getMobileSelectedWorld() {
      const select = document.getElementById('mobileWorldSelect');
      return (select && select.value) ? select.value : 'Carbuncle';
    }

    function populateMobileWorldSelect() {
      const select = document.getElementById('mobileWorldSelect');
      if (!select) return;

      const worlds = Object.keys(allData || {}).sort();
      if (worlds.length === 0) return;

      const currentVal = select.value;
      select.innerHTML = worlds.map(w => `<option value="${escapeHtml(w)}"${w === currentVal ? ' selected' : ''}>🌐 ${escapeHtml(w)} ワールド</option>`).join('');
      if (!select.value && worlds.length > 0) {
        select.value = worlds.includes('Carbuncle') ? 'Carbuncle' : worlds[0];
      }
    }

    function handleMobileWorldChange() {
      renderMobileItemList();
      if (currentMobileSubtab === 1) renderMobileTrendPanel();
      if (currentMobileSubtab === 2) renderMobileListingsPanel();
    }

    // Subtab Switcher
    function switchMobileSubtab(index) {

    // Fetch Realtime Listings with Race Condition Controller (AbortController)
    async function fetchMobileListingsData(worldName, itemId, forceRefresh = false) {
      const container = document.getElementById('mobileListingsContainer');
      const countSpan = document.getElementById('mobileListingsCountSpan');

      const dcName = findDcForWorld(worldName) || 'Mana';
      let apiTarget = worldName;
      let scopeLabel = worldName;
      if (mobListingsScope === 'dc') {
        apiTarget = dcName;
        scopeLabel = `${dcName} DC`;
      } else if (mobListingsScope === 'all') {
        apiTarget = 'Japan';
        scopeLabel = '全日本DC';
      }

      const cacheKey = `${apiTarget}_${itemId}`;

      if (!forceRefresh && window.mobileListingsCache[cacheKey]) {
        renderMobileListingsCards(window.mobileListingsCache[cacheKey], container, countSpan, worldName);
        return;
      }

      // Abort previous pending fetch request if user toggles scope rapidly
      if (currentListingsFetchController) {
        currentListingsFetchController.abort();
      }
      currentListingsFetchController = new AbortController();

      if (container) {
        container.style.opacity = '0.5';
      }
      if (countSpan) countSpan.textContent = '取得中...';

      try {
        const url = `https://universalis.app/api/v2/${encodeURIComponent(apiTarget)}/${itemId}?listings=100`;
        const res = await fetch(url, { signal: currentListingsFetchController.signal });
        if (!res.ok) throw new Error('Universalis API HTTP Error');
        const data = await res.json();
        
        const listings = data.listings || [];
        window.mobileListingsCache[cacheKey] = listings;

        if (container) container.style.opacity = '1';
        renderMobileListingsCards(listings, container, countSpan, worldName);

      } catch (err) {
        if (err.name === 'AbortError') return; // Silently ignore aborted requests
        console.warn("fetchMobileListingsData error:", err);
        if (container) {
          container.style.opacity = '1';
          container.innerHTML = '<div style="text-align:center; padding:1.5rem; color:var(--text-muted); font-size:0.8rem;">出品データの取得に失敗しました</div>';
        }
        if (countSpan) countSpan.textContent = '取得失敗';
      }
    }

    // Render Listings Cards Array
    function renderMobileListingsCards(listings, container, countSpan, targetWorld) {
      if (!container) return;

      const rawListings = Array.isArray(listings) ? listings : [];
      const filteredListings = mobListingsExcludeNq 
        ? rawListings.filter(l => Boolean(l.hq))
        : rawListings;

      const dcName = findDcForWorld(targetWorld) || 'Mana';
      let scopeTitle = targetWorld;
      if (mobListingsScope === 'dc') scopeTitle = `${dcName} DC`;
      if (mobListingsScope === 'all') scopeTitle = '全日本DC';

      const titleSpan = document.getElementById('mobileListingsTitleSpan');
      if (titleSpan) {
        titleSpan.innerHTML = `<i class="fa-solid fa-tags" style="color:var(--accent-blue);"></i> 出品状況一覧 (${scopeTitle})`;
      }

      if (countSpan) {
        countSpan.textContent = `全${filteredListings.length}件の出品`;
      }

      if (!filteredListings || filteredListings.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:1.5rem; color:var(--text-muted); font-size:0.8rem;">' + (mobListingsExcludeNq ? 'HQの出品データがありません' : '現在、出品データがありません') + '</div>';
        return;
      }

      let cardsHtml = '';
      filteredListings.forEach((lst, idx) => {
        const isHq = Boolean(lst.hq);
        const hqBadge = isHq ? '<span style="background:rgba(255,183,3,0.25); color:#ffb703; font-weight:800; font-size:0.65rem; padding:1px 5px; border-radius:4px; border:1px solid rgba(255,183,3,0.4); margin-left:4px;">✨ HQ</span>' : '<span style="background:rgba(255,255,255,0.06); color:#94a3b8; font-size:0.65rem; padding:1px 5px; border-radius:4px; margin-left:4px;">NQ</span>';
        
        const unitPrice = Math.round(lst.pricePerUnit || lst.price || 0);
        const qty = lst.quantity || lst.qty || 1;
        const totalPrice = (lst.total || (unitPrice * qty));
        
        const unitPriceStr = unitPrice.toLocaleString('ja-JP') + 'G';
        const qtyStr = qty.toLocaleString('ja-JP') + '個';
        const totalPriceStr = totalPrice.toLocaleString('ja-JP') + 'G';
        
        const retainer = lst.retainerName ? escapeHtml(lst.retainerName) : `リテーナー #${idx + 1}`;
        const itemWorld = lst.worldName || lst.world || targetWorld;

        cardsHtml += `
          <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(0,210,255,0.15); border-radius:9px; padding:0.5rem 0.65rem; display:flex; flex-direction:column; gap:0.35rem; font-size:0.75rem;">
            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; border-bottom:1px dashed rgba(255,255,255,0.08); padding-bottom:0.3rem;">
              <div style="display:flex; align-items:center; gap:0.25rem;">
                <span style="color:#ffb703; font-weight:800; font-size:0.72rem;" class="font-mono">#${idx + 1}</span>
                ${hqBadge}
                <span style="color:#94a3b8; font-size:0.68rem; margin-left:4px;"><i class="fa-solid fa-globe" style="color:var(--accent-blue);"></i> ${escapeHtml(itemWorld)}</span>
              </div>
              <div style="display:flex; align-items:center; gap:0.2rem; min-width:0; max-width:145px;">
                <span style="color:#94a3b8; font-size:0.7rem; white-space:nowrap;"><i class="fa-solid fa-store" style="color:#60a5fa; font-size:0.68rem;"></i> リテーナー:</span>
                <span style="color:#60a5fa; font-weight:700; font-size:0.72rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${retainer}">${retainer}</span>
              </div>
            </div>

            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; padding-top:0.15rem;">
              <div style="display:flex; align-items:center; gap:0.45rem;">
                <span style="color:#94a3b8; font-size:0.7rem;"><i class="fa-solid fa-tag" style="color:#4ade80;"></i> 単価: <strong style="color:#4ade80; font-weight:700;" class="font-mono">${unitPriceStr}</strong></span>
                <span style="color:#94a3b8; font-size:0.7rem;"><i class="fa-solid fa-boxes-stacked" style="color:#c084fc;"></i> 出品数: <strong style="color:#ffffff;" class="font-mono">${qtyStr}</strong></span>
              </div>

              <div style="display:flex; align-items:center; gap:0.2rem;">
                <span style="color:#94a3b8; font-size:0.7rem;"><i class="fa-solid fa-coins" style="color:#ffb703;"></i> 合計:</span>
                <span style="color:#ffb703; font-weight:800; font-size:0.82rem;" class="font-mono">${totalPriceStr}</span>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = cardsHtml;
    }

    // Main Data Loader for Mobile
    async function loadData() {
      console.time('[MobileFastLoad] Total Load Time');
      const lastUpdatedEl = document.getElementById('lastUpdatedBadge');
      if (lastUpdatedEl) {
        lastUpdatedEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...`;
      }

      try {
        let data = null;

        // 1. Relative same-origin data.json.gz (Fastest)
        try {
          console.time('[MobileFastLoad] Fetch data.json.gz');
          const res = await fetchWithTimeout('data.json.gz', { timeout: 15000 });
          console.timeEnd('[MobileFastLoad] Fetch data.json.gz');

          if (res && res.ok) {
            console.time('[MobileFastLoad] ArrayBuffer Read');
            const arrayBuffer = await res.arrayBuffer();
            console.timeEnd('[MobileFastLoad] ArrayBuffer Read');

            if (window.pako) {
              console.time('[MobileFastLoad] Pako Ungzip');
              const decompressedStr = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
              console.timeEnd('[MobileFastLoad] Pako Ungzip');

              console.time('[MobileFastLoad] JSON Parse');
              data = JSON.parse(decompressedStr);
              console.timeEnd('[MobileFastLoad] JSON Parse');
            } else if (window.DecompressionStream) {
              const ds = new DecompressionStream('gzip');
              const blob = new Blob([arrayBuffer]);
              const text = await new Response(blob.stream().pipeThrough(ds)).text();
              data = JSON.parse(text);
            }
          }
        } catch (gzErr) {
          console.warn("[MobileFastLoad] data.json.gz fetch error:", gzErr);
        }

        // 2. Fallback uncompressed data.json
        if (!data) {
          try {
            console.time('[MobileFastLoad] Fetch data.json (Uncompressed Fallback)');
            const res = await fetchWithTimeout('data.json', { timeout: 15000 });
            console.timeEnd('[MobileFastLoad] Fetch data.json (Uncompressed Fallback)');
            if (res && res.ok) data = await res.json();
          } catch (e) {}
        }

        // 3. Fallback production live URL
        if (!data) {
          try {
            console.time('[MobileFastLoad] Fetch Production Live URL Fallback');
            const prodUrl = 'https://t-ichinose.github.io/ff14-market-tracker/data.json.gz';
            const res = await fetchWithTimeout(prodUrl, { timeout: 20000 });
            if (res && res.ok) {
              const arrayBuffer = await res.arrayBuffer();
              if (window.pako) {
                const decompressedStr = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
                data = JSON.parse(decompressedStr);
              }
            }
            console.timeEnd('[MobileFastLoad] Fetch Production Live URL Fallback');
          } catch (prodErr) {
            console.error("[MobileFastLoad] Live production fallback failed:", prodErr);
          }
        }

        if (!data) {
          throw new Error('データファイルのロード・解凍に失敗しました');
        }

        if (data && data.last_updated) {
          const currentPeriodText = getAggregationPeriodStr(data.last_updated);
          if (lastUpdatedEl) {
            const formattedLastUpdated = formatTimeLocal(data.last_updated);
            lastUpdatedEl.innerHTML = `<i class="fa-regular fa-clock"></i> 最終更新: ${formattedLastUpdated} (${currentPeriodText})`;
          }
        }

        allData = (data && (data.worlds || data.data)) ? (data.worlds || data.data) : {};
        populateMobileWorldSelect();
        renderMobileItemList();

        console.timeEnd('[MobileFastLoad] Total Load Time');

      } catch (err) {
        console.error('Mobile loadData error:', err);
        if (lastUpdatedEl) {
          lastUpdatedEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:var(--accent-red);"></i> データ読み込み失敗 (${err.message})`;
        }
      }
    }
    }

    // Document Ready Initialization
    document.addEventListener('DOMContentLoaded', () => {
      loadData();
    });
  </script>
