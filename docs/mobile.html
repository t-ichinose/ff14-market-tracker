<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FF14 Market Tracker - モバイル版</title>

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #070a12;
      --bg-card: rgba(15, 23, 42, 0.85);
      --bg-header: #0b1120;
      --accent-blue: #00d2ff;
      --accent-blue-bg: rgba(0, 210, 255, 0.15);
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-gold: #ffb703;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(0, 210, 255, 0.22);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 15px;
      touch-action: pan-y;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Header Styling */
    header {
      flex-shrink: 0;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 0.5rem 0.65rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* Header Row 1: Brand (Left) & Mode Switch + Menu (Right) */
    .header-row-1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .brand-icon-box {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #00d2ff, #3b82f6);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 0.82rem;
    }

    .right-header-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .mode-btn {
      padding: 4px 11px;
      border-radius: 16px;
      font-size: 0.76rem;
      font-weight: 700;
      border: none;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent-blue);
      color: #000;
    }

    .header-menu-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      padding: 2px 4px;
      cursor: pointer;
    }

    /* Header Row 2: Sort Segmented Tabs & Icon-Only Crystal Filter */
    .header-row-2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
    }

    .segmented-tabs-container {
      display: flex;
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .segmented-tab {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 5px 4px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .segmented-tab.active {
      background: var(--accent-blue-bg);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .crystal-toggle-btn {
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid var(--accent-blue);
      color: var(--accent-gold);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .crystal-toggle-btn.off {
      opacity: 0.45;
      border-color: rgba(255,255,255,0.15);
      color: var(--text-muted);
    }

    /* Header Row 3: Subtabs Segmented Tabs & Drawer Button */
    .header-row-3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
    }

    .subtabs-segmented-container {
      display: flex;
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .subtab-segmented-btn {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 5px 0;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .subtab-segmented-btn.active {
      background: var(--accent-blue-bg);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .drawer-btn {
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .drawer-btn.open {
      transform: rotate(180deg);
      background: rgba(0, 210, 255, 0.25);
    }

    /* Expandable Control Drawer */
    #mobile-control-drawer {
      display: none;
      background: rgba(10, 15, 26, 0.98);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 0.6rem 0.3rem;
      flex-direction: column;
      gap: 0.45rem;
    }

    #mobile-control-drawer.open {
      display: flex;
    }

    .drawer-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .drawer-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .drawer-select, .drawer-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .drawer-select optgroup {
      background-color: #0b1120;
      color: var(--accent-gold);
      font-weight: 800;
      font-style: normal;
      padding: 4px 0;
    }

    .drawer-select option {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 8px 10px;
    }

    .drawer-select:focus, .drawer-input:focus {
      border-color: var(--accent-blue);
    }

    /* Main Viewport Sliding Panels */
    #mob-main-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .mob-panel-slider {
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Prevent Layout Width Jitter / Scrollbar Flicker */
    .mob-panel {
      width: 33.33333%;
      height: 100%;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      -webkit-overflow-scrolling: touch;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    /* Container Min-Heights */
    #mob-history-cards-container {
      min-height: 220px;
    }

    #mob-listings-container {
      min-height: 320px;
    }

    /* Item Card */
    .mob-item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .mob-item-card:active {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      flex: 1;
    }

    .item-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #111;
      object-fit: contain;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .rank-badge {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-gold);
      flex-shrink: 0;
      font-family: monospace;
    }

    .item-name {
      font-weight: 800;
      font-size: 0.98rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.3px;
    }

    .card-world-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 2px;
    }

    .card-right-metrics {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .trend-badge {
      font-weight: 800;
      font-size: 0.8rem;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .trend-badge.up { color: var(--accent-green); }
    .trend-badge.down { color: var(--accent-red); }
    .trend-badge.flat { color: var(--text-muted); }

    .univ-link {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
      opacity: 0.85;
    }

    .univ-link:hover { opacity: 1; color: var(--accent-blue); }

    /* 2-Column Grid inside Card */
    .card-details-grid {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      gap: 0.65rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.82rem;
    }

    .grid-divider {
      background: rgba(255, 255, 255, 0.08);
      height: 100%;
    }

    .detail-col {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .detail-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .detail-val {
      font-weight: 800;
      font-family: monospace;
      font-size: 0.82rem;
    }

    .detail-val.cyan { color: var(--accent-blue); }
    .detail-val.purple { color: var(--accent-purple); }
    .detail-val.gold { color: var(--accent-gold); }
    .detail-val.pink { color: var(--accent-pink); }
    .detail-val.green { color: var(--accent-green); }

    /* Section Header */
    .section-header {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
      margin-bottom: 0.15rem;
    }

    .section-header-title {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .section-header-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    /* 3 Major Area Lowest Price Comparison Box */
    .three-area-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      width: 100%;
    }

    .area-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.6rem 0.35rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 3px;
    }

    .area-title {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .area-price {
      font-size: 0.95rem;
      font-weight: 800;
      font-family: monospace;
    }

    .area-price.cyan { color: var(--accent-blue); }
    .area-price.gold { color: var(--accent-gold); }
    .area-price.purple { color: var(--accent-purple); }

    .area-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Clean Compact Chart Container */
    .chart-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.55rem 0.65rem 0.3rem 0.65rem;
      height: 175px;
      position: relative;
    }

    /* Daily Breakdown Chips Grid */
    .daily-breakdown-grid {
      display: grid;
      gap: 2px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 0.45rem 0.25rem;
      text-align: center;
      margin-top: -0.2rem;
      width: 100%;
    }

    .daily-chip {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .chip-date { color: var(--text-muted); font-size: 0.65rem; white-space: nowrap; }
    .chip-price { color: var(--accent-green); font-weight: 800; font-size: 0.74rem; font-family: monospace; white-space: nowrap; }
    .chip-volume { color: var(--accent-blue); font-size: 0.65rem; font-family: monospace; white-space: nowrap; }

    /* History Trade Card & Listing Card */
    .history-card, .listing-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.82rem;
    }

    .loading-spinner {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Fixed Header -->
  <header>
    <!-- Row 1: Brand (Left) & Mode Switch + Menu (Right) -->
    <div class="header-row-1">
      <div class="brand-title">
        <div class="brand-icon-box"><i class="fa-solid fa-chart-line"></i></div>
        FF14 Market
      </div>
      <div class="right-header-group">
        <div class="header-mode-switch">
          <button class="mode-btn active">市場分析</button>
          <button class="mode-btn">💎 金策ナビ</button>
        </div>
        <button class="header-menu-btn"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>

    <!-- Row 2: Sort Segmented Tabs & Icon-Only Crystal Filter -->
    <div class="header-row-2">
      <div class="segmented-tabs-container">
        <button class="segmented-tab active" id="mob-sort-volume" onclick="setMobileSort('volume')">売買数</button>
        <button class="segmented-tab" id="mob-sort-gil" onclick="setMobileSort('gil')">流通ギル</button>
        <button class="segmented-tab" id="mob-sort-price" onclick="setMobileSort('price')">高額取引</button>
      </div>
      <button class="crystal-toggle-btn" id="mob-crystal-btn" onclick="toggleMobileCrystalFilter()" title="クリスタルフィルター">
        💎
      </button>
    </div>

    <!-- Row 3: Subtabs Segmented Tabs & Drawer Button -->
    <div class="header-row-3">
      <div class="subtabs-segmented-container">
        <button class="subtab-segmented-btn active" id="mob-subtab-1" onclick="setMobileTab(1)">
          <i class="fa-solid fa-list-ul"></i> ① 品目一覧
        </button>
        <button class="subtab-segmented-btn" id="mob-subtab-2" onclick="setMobileTab(2)">
          <i class="fa-solid fa-chart-line"></i> ② 推移・比較
        </button>
        <button class="subtab-segmented-btn" id="mob-subtab-3" onclick="setMobileTab(3)">
          <i class="fa-solid fa-list-check"></i> ③ 出品状況
        </button>
      </div>
      <button class="drawer-btn" id="mob-drawer-toggle" onclick="toggleMobileDrawer()">
        <i class="fa-solid fa-chevron-down"></i>
      </button>
    </div>

    <!-- Expandable Control Drawer -->
    <div id="mobile-control-drawer">
      <div class="drawer-row">
        <span class="drawer-label"><i class="fa-solid fa-globe"></i> ワールド・DC選択</span>
        <select class="drawer-select" id="pcWorldSelect" onchange="onMobileWorldChange(this.value)">
          <option value="">データ読み込み中...</option>
        </select>
      </div>
      <div class="drawer-row">
        <span class="drawer-label"><i class="fa-solid fa-magnifying-glass"></i> 品名・IDリアルタイム検索</span>
        <input type="text" class="drawer-input" id="pcSearchInput" placeholder="品名キーワード入力..." oninput="onMobileSearchInput(this.value)">
      </div>
    </div>
  </header>

  <!-- Main Viewport Slider -->
  <div id="mob-main-viewport">
    <div class="mob-panel-slider" id="mob-slider">

      <!-- Panel 1: Item List -->
      <div class="mob-panel" id="mob-view-1">
        <div id="mobile-item-cards-container" style="display:flex; flex-direction:column; gap:0.65rem;">
          <div class="loading-spinner">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>マーケットデータを読み込んでいます...
          </div>
        </div>
      </div>

      <!-- Panel 2: Trend & Comparison -->
      <div class="mob-panel" id="mob-view-2">
        <div id="mob-selected-summary">
          <div class="loading-spinner">品目を選択してください</div>
        </div>

        <!-- Section 1: Clean Chart & Single-Row Daily Chips -->
        <div class="section-header">
          <div class="section-header-title">
            <i class="fa-solid fa-chart-line"></i> 過去1週間の価格・取引数推移
          </div>
          <span class="section-header-sub" id="mob-chart-world-name">(${selectedWorld})</span>
        </div>
        
        <div class="chart-container">
          <canvas id="mobTrendChart"></canvas>
        </div>

        <!-- Single-Row Daily Breakdown Chips (Up to 4-Digit K format e.g. 3007KG) -->
        <div class="daily-breakdown-grid" id="mob-daily-chips-container">
          <!-- Populated by JS -->
        </div>

        <!-- Section 2: Recent Trade History (With ✨ NQ非表示 Toggle Switch) -->
        <div class="section-header" style="margin-top:0.4rem;">
          <div class="section-header-title" style="color:var(--accent-purple);">
            <i class="fa-solid fa-clock-rotate-left"></i> 直近の取引履歴 <span class="section-header-sub" id="mob-history-world-name">(${selectedWorld})</span>
          </div>
          <button class="crystal-toggle-btn off" id="mob-history-hq-btn" onclick="toggleMobileHistoryHqFilter()">
            ✨ NQ非表示: OFF
          </button>
        </div>

        <div id="mob-history-cards-container" style="display:flex; flex-direction:column; gap:0.45rem;">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Panel 3: Active Listings -->
      <div class="mob-panel" id="mob-view-3">
        <!-- Top Item Summary Card -->
        <div id="mob-selected-summary-3">
          <div class="loading-spinner">品目を選択してください</div>
        </div>

        <!-- 3 Major Area Lowest Price Comparison Box -->
        <div class="three-area-grid" id="mob-three-area-container" style="margin-top:0.2rem;">
          <div class="area-card">
            <span class="area-title">選択ワールド最安</span>
            <span class="area-price cyan" id="area-val-world">-</span>
            <span class="area-sub" id="area-sub-world">${selectedWorld}</span>
          </div>
          <div class="area-card">
            <span class="area-title" id="area-title-dc">同DC最安</span>
            <span class="area-price gold" id="area-val-dc">-</span>
            <span class="area-sub" id="area-sub-dc">-</span>
          </div>
          <div class="area-card">
            <span class="area-title">全DC最安</span>
            <span class="area-price purple" id="area-val-all">-</span>
            <span class="area-sub" id="area-sub-all">-</span>
          </div>
        </div>

        <!-- Scope & Filter Header Bar -->
        <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,0.3); padding:0.45rem 0.5rem; border-radius:8px; margin-top:0.3rem;">
          <div style="display:flex; gap:0.3rem; flex:1;">
            <button class="segmented-tab active" style="padding:4px 8px; font-size:0.78rem;" id="mobScopeWorldBtn" onclick="setMobileListingScope('world')">単一</button>
            <button class="segmented-tab" style="padding:4px 8px; font-size:0.78rem;" id="mobScopeDcBtn" onclick="setMobileListingScope('dc')">同DC</button>
            <button class="segmented-tab" style="padding:4px 8px; font-size:0.78rem;" id="mobScopeAllBtn" onclick="setMobileListingScope('all')">全DC</button>
          </div>
          <button class="crystal-toggle-btn off" id="mobHqFilterBtn" onclick="toggleMobileListingHqFilter()">
            ✨ NQ非表示: OFF
          </button>
        </div>

        <!-- Listings Section Header -->
        <div class="section-header" style="margin-top:0.2rem;">
          <div class="section-header-title">
            <i class="fa-solid fa-tags"></i> 出品状況一覧 <span class="section-header-sub" id="mob-listings-world-name">(${selectedWorld})</span>
          </div>
          <span class="section-header-sub" id="mob-listings-count-label">全0件の出品</span>
        </div>

        <div id="mob-listings-container" style="display:flex; flex-direction:column; gap:0.55rem;">
          <div class="loading-spinner">品目を選択すると最新の出品状況が読み込まれます</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // Mobile UI State
  let currentTab = 1;
  let currentSort = 'volume';
  let isCrystalExcluded = true;
  let selectedWorld = 'Anima';
  let searchQuery = '';
  let selectedItem = null;
  let listingScope = 'world';
  let listingExcludeNq = false;
  let historyExcludeNq = false;

  let rawData = {};
  let allWorldsData = {};
  let worldToDcMap = {};
  let currentFilteredItems = [];
  let trendChartInstance = null;

  // Touch Swipe Variables
  let touchStartX = 0;
  let touchStartY = 0;

  // Formatting Helpers
  function formatNumber(num) {
    if (num === null || num === undefined || isNaN(num)) return '-';
    return Math.round(num).toLocaleString('ja-JP');
  }

  // 4-Digit K Number Abbreviation (e.g. 3007K for 3,007,066, 940K, 1.6K)
  function formatCompactNumber(num) {
    if (num === null || num === undefined || isNaN(num)) return '-';
    const val = Number(num);
    const absVal = Math.abs(val);

    if (absVal >= 10000000) { // 10M+
      const m = val / 1000000;
      return (m >= 100 ? m.toFixed(0) : m.toFixed(1)).replace(/\.0$/, '') + 'M';
    }
    if (absVal >= 1000) { // 1,000 to 9,999,999 -> 4-digit K format
      const k = val / 1000;
      if (k >= 100) {
        return Math.round(k).toString() + 'K';
      } else {
        return k.toFixed(1).replace(/\.0$/, '') + 'K';
      }
    }
    return Math.round(val).toString();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
  }

  function getComputedIconUrl(iconPathOrId) {
    if (!iconPathOrId) return 'https://xivapi.com/i/000000/000000.png';
    if (typeof iconPathOrId === 'string' && iconPathOrId.startsWith('http')) return iconPathOrId;
    let iconId = parseInt(iconPathOrId, 10);
    if (isNaN(iconId)) return 'https://xivapi.com/i/000000/000000.png';
    let folder = Math.floor(iconId / 1000) * 1000;
    let folderStr = String(folder).padStart(6, '0');
    let iconStr = String(iconId).padStart(6, '0');
    return `https://xivapi.com/i/${folderStr}/${iconStr}.png`;
  }

  function formatTradeTimestamp(ts) {
    if (!ts) return '-';
    try {
      let unixSec = Number(ts);
      if (unixSec > 1e11) unixSec = Math.floor(unixSec / 1000);
      const d = new Date(unixSec * 1000);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${m}/${date} ${h}:${min}`;
    } catch(e) {
      return '-';
    }
  }

  function generateSparklineSvg(it, trendVal) {
    let strokeColor = '#94a3b8';
    if (trendVal > 0) strokeColor = '#4ade80';
    else if (trendVal < 0) strokeColor = '#f87171';

    let dPath = 'M 2 7 L 38 7';

    if (it.daily_trend && Array.isArray(it.daily_trend) && it.daily_trend.length >= 2) {
      const points = it.daily_trend;
      const prices = points.map(p => (typeof p === 'number' ? p : (p.weighted_avg || p.avg_price || p.price || 0)));
      const minP = Math.min(...prices);
      const maxP = Math.max(...prices);
      const rangeP = (maxP - minP) || 1;

      const width = 36;
      const height = 10;
      const stepX = width / (points.length - 1);

      const pathCoords = prices.map((p, idx) => {
        const x = (2 + idx * stepX).toFixed(1);
        const y = (12 - ((p - minP) / rangeP) * height).toFixed(1);
        return `${x} ${y}`;
      });

      dPath = `M ${pathCoords.join(' L ')}`;
    } else {
      if (trendVal > 0) dPath = 'M 2 11 Q 12 9, 22 5 T 38 11';
    }

    return `<svg width="42" height="15" viewBox="0 0 40 14" style="vertical-align:middle;">
      <path d="${dPath}" stroke="${strokeColor}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  function buildWorldToDcMap() {
    worldToDcMap = {};
    if (rawData && rawData.dc_worlds) {
      Object.keys(rawData.dc_worlds).forEach(dcName => {
        const worlds = rawData.dc_worlds[dcName];
        if (Array.isArray(worlds)) {
          worlds.forEach(w => {
            worldToDcMap[w] = dcName;
          });
        }
      });
    }
  }

  // Drawer Toggle
  function toggleMobileDrawer() {
    const drawer = document.getElementById('mobile-control-drawer');
    const toggleBtn = document.getElementById('mob-drawer-toggle');
    drawer.classList.toggle('open');
    toggleBtn.classList.toggle('open');
  }

  // Subtab Switcher
  function setMobileTab(tabIndex) {
    currentTab = tabIndex;
    const slider = document.getElementById('mob-slider');
    slider.style.transform = `translateX(-${(tabIndex - 1) * 33.33333}%)`;

    for (let i = 1; i <= 3; i++) {
      const btn = document.getElementById(`mob-subtab-${i}`);
      if (btn) {
        if (i === tabIndex) btn.classList.add('active');
        else btn.classList.remove('active');
      }
    }

    if (!selectedItem && currentFilteredItems.length > 0) {
      selectedItem = currentFilteredItems[0];
    }

    if (tabIndex === 2 && selectedItem) renderMobileDetailView(selectedItem);
    if (tabIndex === 3 && selectedItem) renderMobileListingView(selectedItem);
  }

  // Sort Switcher: Auto Reset to Tab 1 (① 品目一覧)
  function setMobileSort(sortKey) {
    currentSort = sortKey;
    ['volume', 'gil', 'price'].forEach(k => {
      const btn = document.getElementById(`mob-sort-${k}`);
      if (btn) {
        if (k === sortKey) btn.classList.add('active');
        else btn.classList.remove('active');
      }
    });

    setMobileTab(1); // Auto reset to ① 品目一覧
    renderMobileItemList();
  }

  // Icon-Only Crystal Filter Switch
  function toggleMobileCrystalFilter() {
    isCrystalExcluded = !isCrystalExcluded;
    const btn = document.getElementById('mob-crystal-btn');
    if (isCrystalExcluded) {
      btn.innerHTML = `💎`;
      btn.classList.remove('off');
    } else {
      btn.innerHTML = `💎`;
      btn.classList.add('off');
    }
    renderMobileItemList();
  }

  // Trade History NQ Filter Switch
  function toggleMobileHistoryHqFilter() {
    historyExcludeNq = !historyExcludeNq;
    const btn = document.getElementById('mob-history-hq-btn');
    if (btn) {
      if (historyExcludeNq) {
        btn.innerHTML = `✨ NQ非表示: ON`;
        btn.classList.remove('off');
      } else {
        btn.innerHTML = `✨ NQ非表示: OFF`;
        btn.classList.add('off');
      }
    }
    if (selectedItem) renderMobileHistoryList(selectedItem);
  }

  // Populate World Select grouped by DC (optgroup)
  function populateMobileWorldSelect() {
    const select = document.getElementById('pcWorldSelect');
    if (!select || !allWorldsData) return;

    select.innerHTML = '';
    const worlds = Object.keys(allWorldsData);
    if (worlds.length === 0) {
      select.innerHTML = '<option value="">ワールドデータなし</option>';
      return;
    }

    if (!worlds.includes(selectedWorld)) selectedWorld = worlds[0];

    if (rawData && rawData.dc_worlds) {
      Object.keys(rawData.dc_worlds).forEach(dcName => {
        const dcWorldsList = rawData.dc_worlds[dcName];
        if (Array.isArray(dcWorldsList) && dcWorldsList.length > 0) {
          const optgroup = document.createElement('optgroup');
          optgroup.label = `━━ ${dcName} ━━`;

          dcWorldsList.forEach(w => {
            if (worlds.includes(w)) {
              const opt = document.createElement('option');
              opt.value = w;
              opt.textContent = w;
              if (w === selectedWorld) opt.selected = true;
              optgroup.appendChild(opt);
            }
          });

          if (optgroup.children.length > 0) {
            select.appendChild(optgroup);
          }
        }
      });
    } else {
      worlds.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = w;
        if (w === selectedWorld) opt.selected = true;
        select.appendChild(opt);
      });
    }
  }

  function onMobileWorldChange(val) {
    if (val) {
      selectedWorld = val;
      renderMobileItemList();
      if (selectedItem) {
        const wData = allWorldsData[selectedWorld];
        if (wData) {
          const items = Array.isArray(wData) ? wData : (wData.items ? Object.values(wData.items) : Object.values(wData));
          const targetId = selectedItem.item_id || selectedItem.id;
          const found = items.find(it => (it.item_id || it.id) == targetId);
          if (found) selectedItem = found;
        }

        if (currentTab === 2) renderMobileDetailView(selectedItem);
        if (currentTab === 3) renderMobileListingView(selectedItem);
      }
    }
  }

  function onMobileSearchInput(val) {
    searchQuery = (val || '').trim().toLowerCase();
    renderMobileItemList();
  }

  // Render Panel 1 Item Cards
  function renderMobileItemList() {
    const container = document.getElementById('mobile-item-cards-container');
    if (!container) return;

    const worldData = allWorldsData[selectedWorld];
    if (!worldData) {
      container.innerHTML = `<div class="loading-spinner">選択中のワールド (${escapeHtml(selectedWorld)}) のデータがありません</div>`;
      return;
    }

    let items = Array.isArray(worldData) ? [...worldData] : (worldData.items ? Object.values(worldData.items) : Object.values(worldData));

    if (isCrystalExcluded) {
      items = items.filter(it => {
        const id = Number(it.item_id || it.id || 0);
        const name = (it.item_name || it.name || '').toLowerCase();
        if (id >= 2 && id <= 19) return false;
        return !name.includes('クリスタル') && !name.includes('クラスター') && !name.includes('シャード');
      });
    }

    if (searchQuery) {
      items = items.filter(it => {
        const name = (it.item_name || it.name || '').toLowerCase();
        const idStr = String(it.item_id || it.id || '');
        return name.includes(searchQuery) || idStr.includes(searchQuery);
      });
    }

    if (currentSort === 'volume') {
      items.sort((a, b) => (b.sale_velocity || b.sales_per_day || 0) - (a.sale_velocity || a.sales_per_day || 0));
    } else if (currentSort === 'gil') {
      items.sort((a, b) => (b.daily_revenue || b.volume_per_day || 0) - (a.daily_revenue || a.volume_per_day || 0));
    } else if (currentSort === 'price') {
      items.sort((a, b) => (b.max_price || 0) - (a.max_price || 0));
    }

    currentFilteredItems = items;
    const top30 = items.slice(0, 30);

    if (top30.length === 0) {
      container.innerHTML = '<div class="loading-spinner">該当する品目がありません</div>';
      return;
    }

    let html = '';
    top30.forEach((it, idx) => {
      const itemId = it.item_id || it.id;
      const primaryIcon = it.icon_url ? it.icon_url : getComputedIconUrl(itemId || it.icon);
      const itemName = escapeHtml(it.item_name || it.name || `Item #${itemId}`);
      
      const salesPerDay = (it.sale_velocity || it.sales_per_day || 0).toFixed(1);
      const numTransactions = formatNumber(it.sale_trades || it.num_transactions || it.sales_count || 0);
      const volumePerDay = formatNumber(it.daily_revenue || it.volume_per_day || 0);

      const minPrice = formatNumber(it.min_price || 0);
      const avgPrice = formatNumber(it.avg_price || 0);
      const maxPrice = formatNumber(it.max_price || 0);

      let trendVal = 0;
      if (it.trend_pct !== undefined) {
        trendVal = it.trend_pct;
      } else if (it.daily_trend && it.daily_trend.percent !== undefined) {
        trendVal = it.daily_trend.percent;
      }
      
      let trendClass = 'flat';
      let trendStr = '0.0%';
      let trendIconClass = 'fa-minus';

      if (trendVal > 0) {
        trendClass = 'up';
        trendStr = `+${trendVal.toFixed(1)}%`;
        trendIconClass = 'fa-arrow-trend-up';
      } else if (trendVal < 0) {
        trendClass = 'down';
        trendStr = `${trendVal.toFixed(1)}%`;
        trendIconClass = 'fa-arrow-trend-down';
      }

      const sparklineSvg = generateSparklineSvg(it, trendVal);

      html += `
        <div class="mob-item-card" onclick="selectMobileItem(${itemId})">
          <div class="card-top">
            <div class="card-title-group">
              <img src="${primaryIcon}" class="item-icon" onerror="this.src='https://xivapi.com/i/000000/000000.png'">
              <span class="rank-badge">#${idx + 1}</span>
              <span class="item-name">${itemName}</span>
            </div>
            <div class="card-right-metrics">
              ${sparklineSvg}
              <span class="trend-badge ${trendClass}"><i class="fa-solid ${trendIconClass}" style="font-size:0.7rem;"></i> ${trendStr}</span>
              <a href="https://universalis.app/market/${itemId}" target="_blank" class="univ-link" onclick="event.stopPropagation();">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
              </a>
            </div>
          </div>

          <div class="card-details-grid">
            <div class="detail-col">
              <div class="detail-row">
                <span class="detail-label"><i class="fa-solid fa-bolt" style="color:var(--accent-blue);"></i> 売買数:</span>
                <span class="detail-val cyan">${salesPerDay}個/日</span>
              </div>
              <div class="detail-row">
                <span class="detail-label"><i class="fa-solid fa-receipt" style="color:var(--accent-purple);"></i> 件数:</span>
                <span class="detail-val purple">${numTransactions}件/日</span>
              </div>
              <div class="detail-row">
                <span class="detail-label"><i class="fa-solid fa-coins" style="color:var(--accent-gold);"></i> 流通:</span>
                <span class="detail-val gold">${volumePerDay}G/日</span>
              </div>
            </div>

            <div class="grid-divider"></div>

            <div class="detail-col">
              <div class="detail-row">
                <span class="detail-label"><i class="fa-solid fa-tag" style="color:var(--accent-blue);"></i> 最安:</span>
                <span class="detail-val cyan">${minPrice}G</span>
              </div>
              <div class="detail-row">
                <span class="detail-label"><i class="fa-solid fa-scale-balanced" style="color:var(--accent-purple);"></i> 平均:</span>
                <span class="detail-val purple">${avgPrice}G</span>
              </div>
              <div class="detail-row">
                <span class="detail-label"><i class="fa-solid fa-chart-line" style="color:var(--accent-pink);"></i> 最高:</span>
                <span class="detail-val pink">${maxPrice}G</span>
              </div>
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  // Item Selection -> Auto Jump to Panel 2
  function selectMobileItem(itemId) {
    const worldData = allWorldsData[selectedWorld];
    if (!worldData) return;

    const items = Array.isArray(worldData) ? worldData : (worldData.items ? Object.values(worldData.items) : Object.values(worldData));
    const item = items.find(it => (it.item_id || it.id) == itemId);

    if (item) {
      selectedItem = item;
      setMobileTab(2);
    }
  }

  // Helper to render Card HTML for Top Item Summary
  function getSummaryCardHtml(item) {
    const itemId = item.item_id || item.id;
    const itemName = escapeHtml(item.item_name || item.name || `Item #${itemId}`);
    const primaryIcon = item.icon_url ? item.icon_url : getComputedIconUrl(itemId || item.icon);

    const salesPerDay = (item.sale_velocity || item.sales_per_day || 0).toFixed(1);
    const numTransactions = formatNumber(item.sale_trades || item.num_transactions || item.sales_count || 0);
    const volumePerDay = formatNumber(item.daily_revenue || item.volume_per_day || 0);

    const minPrice = formatNumber(item.min_price || 0);
    const avgPrice = formatNumber(item.avg_price || 0);
    const maxPrice = formatNumber(item.max_price || 0);

    let trendVal = 0;
    if (item.trend_pct !== undefined) trendVal = item.trend_pct;
    else if (item.daily_trend && item.daily_trend.percent !== undefined) trendVal = item.daily_trend.percent;

    let trendClass = 'flat';
    let trendStr = '0.0%';
    let trendIconClass = 'fa-minus';

    if (trendVal > 0) {
      trendClass = 'up';
      trendStr = `+${trendVal.toFixed(1)}%`;
      trendIconClass = 'fa-arrow-trend-up';
    } else if (trendVal < 0) {
      trendClass = 'down';
      trendStr = `${trendVal.toFixed(1)}%`;
      trendIconClass = 'fa-arrow-trend-down';
    }

    const sparklineSvg = generateSparklineSvg(item, trendVal);

    return `
      <div class="mob-item-card" style="margin-bottom:0.2rem;">
        <div class="card-top">
          <div class="card-title-group">
            <img src="${primaryIcon}" class="item-icon" onerror="this.src='https://xivapi.com/i/000000/000000.png'">
            <div style="display:flex; flex-direction:column; min-width:0;">
              <span class="item-name">${itemName}</span>
              <span class="card-world-sub"><i class="fa-solid fa-globe" style="color:var(--accent-blue);"></i> ${escapeHtml(selectedWorld)} ワールド</span>
            </div>
          </div>
          <div class="card-right-metrics">
            ${sparklineSvg}
            <span class="trend-badge ${trendClass}"><i class="fa-solid ${trendIconClass}" style="font-size:0.7rem;"></i> ${trendStr}</span>
            <a href="https://universalis.app/market/${itemId}" target="_blank" class="univ-link" onclick="event.stopPropagation();">
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
          </div>
        </div>

        <div class="card-details-grid">
          <div class="detail-col">
            <div class="detail-row">
              <span class="detail-label"><i class="fa-solid fa-bolt" style="color:var(--accent-blue);"></i> 売買数:</span>
              <span class="detail-val cyan">${salesPerDay}個/日</span>
            </div>
            <div class="detail-row">
              <span class="detail-label"><i class="fa-solid fa-receipt" style="color:var(--accent-purple);"></i> 件数:</span>
              <span class="detail-val purple">${numTransactions}件/日</span>
            </div>
            <div class="detail-row">
              <span class="detail-label"><i class="fa-solid fa-coins" style="color:var(--accent-gold);"></i> 流通:</span>
              <span class="detail-val gold">${volumePerDay}G/日</span>
            </div>
          </div>

          <div class="grid-divider"></div>

          <div class="detail-col">
            <div class="detail-row">
              <span class="detail-label"><i class="fa-solid fa-tag" style="color:var(--accent-blue);"></i> 最安:</span>
              <span class="detail-val cyan">${minPrice}G</span>
            </div>
            <div class="detail-row">
              <span class="detail-label"><i class="fa-solid fa-scale-balanced" style="color:var(--accent-purple);"></i> 平均:</span>
              <span class="detail-val purple">${avgPrice}G</span>
            </div>
            <div class="detail-row">
              <span class="detail-label"><i class="fa-solid fa-chart-line" style="color:var(--accent-pink);"></i> 最高:</span>
              <span class="detail-val pink">${maxPrice}G</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // Render Panel 2
  function renderMobileDetailView(item) {
    if (!item) return;

    const summaryContainer = document.getElementById('mob-selected-summary');
    if (summaryContainer) {
      summaryContainer.innerHTML = getSummaryCardHtml(item);
    }

    const chartWorldEl = document.getElementById('mob-chart-world-name');
    const historyWorldEl = document.getElementById('mob-history-world-name');
    if (chartWorldEl) chartWorldEl.textContent = `(${selectedWorld})`;
    if (historyWorldEl) historyWorldEl.textContent = `(${selectedWorld})`;

    renderMobileChart(item);
    renderDailyBreakdownChips(item);
    renderMobileHistoryList(item);
  }

  // Clean Chart.js
  function renderMobileChart(item) {
    const canvas = document.getElementById('mobTrendChart');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    if (trendChartInstance) trendChartInstance.destroy();

    let labels = ['6日前', '5日前', '4日前', '3日前', '2日前', '昨日', '今日'];
    let dataPrices = [];
    let dataVolumes = [];

    if (item.daily_trend && Array.isArray(item.daily_trend) && item.daily_trend.length > 0) {
      labels = item.daily_trend.map(d => d.date || '');
      dataPrices = item.daily_trend.map(d => d.weighted_avg || d.avg_price || item.min_price || 0);
      dataVolumes = item.daily_trend.map(d => d.volume || d.sales || 0);
    } else {
      const basePrice = item.min_price || 100;
      dataPrices = labels.map((_, i) => Math.max(10, Math.round(basePrice * (0.9 + (i * 0.03)))));
      dataVolumes = labels.map(() => Math.round((item.sale_velocity || 10) * 0.8));
    }

    trendChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          {
            label: '価格推移(G)',
            data: dataPrices,
            borderColor: '#4ade80',
            borderWidth: 2.2,
            backgroundColor: 'rgba(74, 222, 128, 0.08)',
            fill: true,
            tension: 0.35,
            pointRadius: 2.5,
            pointBackgroundColor: '#4ade80',
            yAxisID: 'y'
          },
          {
            type: 'bar',
            label: '取引量',
            data: dataVolumes,
            backgroundColor: 'rgba(0, 210, 255, 0.18)',
            borderRadius: 3,
            barPercentage: 0.55,
            yAxisID: 'y1'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: true }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
          y: { display: false },
          y1: { display: false }
        }
      }
    });
  }

  // Single-Row Daily Breakdown Chips Grid with 4-Digit K Format (e.g. 3007KG, 940KG)
  function renderDailyBreakdownChips(item) {
    const container = document.getElementById('mob-daily-chips-container');
    if (!container) return;

    if (!item.daily_trend || !Array.isArray(item.daily_trend) || item.daily_trend.length === 0) {
      container.innerHTML = '<div style="color:var(--text-muted); font-size:0.75rem; text-align:center;">日別データなし</div>';
      return;
    }

    const points = item.daily_trend;
    container.style.gridTemplateColumns = `repeat(${points.length}, 1fr)`;

    let html = '';
    points.forEach(d => {
      const dateStr = d.date || '-';
      const priceVal = d.weighted_avg || d.avg_price || 0;
      const volVal = d.volume || d.sales || 0;

      const priceStr = formatCompactNumber(priceVal) + 'G';
      const volStr = formatCompactNumber(volVal) + '個';

      html += `
        <div class="daily-chip">
          <span class="chip-date">${dateStr}</span>
          <span class="chip-price" title="${formatNumber(priceVal)}G">${priceStr}</span>
          <span class="chip-volume" title="${formatNumber(volVal)}個">${volStr}</span>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  // Refined Trade History Cards
  function renderMobileHistoryList(item) {
    const container = document.getElementById('mob-history-cards-container');
    if (!container) return;

    let history = item.history || [];
    if (!Array.isArray(history) || history.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:1rem; color:var(--text-muted); font-size:0.8rem;">直近の取引履歴がありません</div>';
      return;
    }

    if (historyExcludeNq) {
      history = history.filter(h => Boolean(h.hq));
    }

    if (history.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:1rem; color:var(--text-muted); font-size:0.8rem;">HQの取引履歴データがありません</div>';
      return;
    }

    const recent20 = history.slice(0, 20);
    let html = '';

    recent20.forEach(h => {
      const exactTimeStr = formatTradeTimestamp(h.ts || h.timestamp);
      const isHq = Boolean(h.hq);
      const hqBadge = isHq ? '<span style="background:rgba(255,183,3,0.2); color:#ffb703; font-weight:800; font-size:0.68rem; padding:2px 6px; border-radius:4px; border:1px solid rgba(255,183,3,0.4);">✨ HQ</span>' : '<span style="background:rgba(255,255,255,0.06); color:#94a3b8; font-size:0.68rem; padding:2px 6px; border-radius:4px;">NQ</span>';
      const buyerName = h.buyer ? escapeHtml(h.buyer) : '購入者非公開';
      const unitPrice = formatNumber(h.price || 0);
      const qty = formatNumber(h.qty || h.quantity || 1);
      const totalPrice = formatNumber((h.price || 0) * (h.qty || h.quantity || 1));

      html += `
        <div class="history-card">
          <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px dashed rgba(255,255,255,0.08); padding-bottom:0.35rem;">
            <div style="display:flex; align-items:center; gap:0.4rem;">
              <span style="color:var(--text-muted); font-size:0.75rem; display:flex; align-items:center; gap:0.25rem;">
                <i class="fa-regular fa-clock" style="color:var(--accent-blue);"></i> ${exactTimeStr}
              </span>
              ${hqBadge}
            </div>
            <div style="color:#60a5fa; font-weight:700; font-size:0.8rem; display:flex; align-items:center; gap:0.3rem;">
              <i class="fa-solid fa-user" style="font-size:0.75rem;"></i> 購入者: ${buyerName}
            </div>
          </div>

          <div style="display:flex; align-items:center; justify-content:space-between; padding-top:0.25rem;">
            <div style="display:flex; gap:0.6rem; color:var(--text-muted); font-size:0.78rem; align-items:center;">
              <span><i class="fa-solid fa-tag" style="color:var(--accent-green);"></i> 単価: <strong style="color:var(--accent-green);" class="font-mono">${unitPrice}G</strong></span>
              <span><i class="fa-solid fa-boxes-stacked" style="color:var(--text-muted);"></i> 数量: <strong style="color:#fff;" class="font-mono">${qty}個</strong></span>
            </div>
            <div style="color:var(--accent-gold); font-weight:800; font-size:0.88rem; font-family:monospace; display:flex; align-items:center; gap:0.25rem;">
              <i class="fa-solid fa-coins" style="font-size:0.78rem;"></i> 合計: ${totalPrice}G
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  // Panel 3 Listing View Render
  function renderMobileListingView(item) {
    if (!item) return;

    const summaryContainer = document.getElementById('mob-selected-summary-3');
    if (summaryContainer) {
      summaryContainer.innerHTML = getSummaryCardHtml(item);
    }

    const listingWorldEl = document.getElementById('mob-listings-world-name');
    if (listingWorldEl) listingWorldEl.textContent = `(${selectedWorld})`;

    loadMobileListings(item);
  }

  function setMobileListingScope(scope) {
    listingScope = scope;
    ['world', 'dc', 'all'].forEach(s => {
      const btn = document.getElementById(`mobScope${s.charAt(0).toUpperCase() + s.slice(1)}Btn`);
      if (btn) {
        if (s === scope) btn.classList.add('active');
        else btn.classList.remove('active');
      }
    });
    if (selectedItem) loadMobileListings(selectedItem);
  }

  function toggleMobileListingHqFilter() {
    listingExcludeNq = !listingExcludeNq;
    const btn = document.getElementById('mobHqFilterBtn');
    if (btn) {
      if (listingExcludeNq) {
        btn.innerHTML = `✨ NQ非表示: ON`;
        btn.classList.remove('off');
      } else {
        btn.innerHTML = `✨ NQ非表示: OFF`;
        btn.classList.add('off');
      }
    }
    if (selectedItem) loadMobileListings(selectedItem);
  }

  async function loadMobileListings(item) {
    const container = document.getElementById('mob-listings-container');
    if (!container || !item) return;

    const itemId = item.item_id || item.id;
    container.innerHTML = '<div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> 出品情報を取得中...</div>';

    try {
      const currentDc = worldToDcMap[selectedWorld] || 'Mana';
      let fetchParam = selectedWorld;
      if (listingScope === 'dc') fetchParam = currentDc;
      else if (listingScope === 'all') fetchParam = 'Japan';

      const url = `https://universalis.app/api/v2/${fetchParam}/${itemId}?listings=60`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Universalis API エラー');
      const data = await res.json();

      let rawListings = data.listings || [];

      // Calculate 3 Area Lowest Prices
      const minWorldPrice = item.min_price || (rawListings.length > 0 ? rawListings[0].pricePerUnit : null);
      
      const areaValWorld = document.getElementById('area-val-world');
      const areaSubWorld = document.getElementById('area-sub-world');
      if (areaValWorld) areaValWorld.textContent = minWorldPrice ? `${formatCompactNumber(minWorldPrice)}G` : '-';
      if (areaSubWorld) areaSubWorld.textContent = selectedWorld;

      const areaTitleDc = document.getElementById('area-title-dc');
      const areaValDc = document.getElementById('area-val-dc');
      const areaSubDc = document.getElementById('area-sub-dc');
      if (areaTitleDc) areaTitleDc.textContent = `同DC最安 (${currentDc})`;
      if (areaValDc) areaValDc.textContent = rawListings.length > 0 ? `${formatCompactNumber(rawListings[0].pricePerUnit)}G` : (minWorldPrice ? `${formatCompactNumber(minWorldPrice)}G` : '-');
      if (areaSubDc) areaSubDc.innerHTML = rawListings.length > 0 && rawListings[0].worldName ? `<i class="fa-solid fa-crown" style="color:var(--accent-gold);"></i> ${escapeHtml(rawListings[0].worldName)}` : selectedWorld;

      const areaValAll = document.getElementById('area-val-all');
      const areaSubAll = document.getElementById('area-sub-all');
      if (areaValAll) areaValAll.textContent = rawListings.length > 0 ? `${formatCompactNumber(rawListings[0].pricePerUnit)}G` : (minWorldPrice ? `${formatCompactNumber(minWorldPrice)}G` : '-');
      if (areaSubAll) areaSubAll.innerHTML = rawListings.length > 0 && rawListings[0].worldName ? `<i class="fa-solid fa-globe" style="color:var(--accent-blue);"></i> ${escapeHtml(rawListings[0].worldName)}` : selectedWorld;

      // Filter NQ if needed
      let targetListings = rawListings;
      if (listingExcludeNq) {
        targetListings = targetListings.filter(l => Boolean(l.hq));
      }

      const countLabel = document.getElementById('mob-listings-count-label');
      if (countLabel) countLabel.textContent = `全${targetListings.length}件の出品`;

      if (targetListings.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:1.5rem; color:var(--text-muted); font-size:0.85rem;">該当する出品データがありません</div>';
        return;
      }

      let html = '';
      targetListings.slice(0, 40).forEach((lst, idx) => {
        const isHq = Boolean(lst.hq);
        const hqBadge = isHq ? '<span style="background:rgba(255,183,3,0.2); color:#ffb703; font-weight:800; font-size:0.68rem; padding:2px 6px; border-radius:4px; border:1px solid rgba(255,183,3,0.4);">✨ HQ</span>' : '<span style="background:rgba(255,255,255,0.06); color:#94a3b8; font-size:0.68rem; padding:2px 6px; border-radius:4px;">NQ</span>';
        const unitPrice = formatNumber(lst.pricePerUnit || 0);
        const qty = formatNumber(lst.quantity || 1);
        const total = formatNumber((lst.pricePerUnit || 0) * (lst.quantity || 1));
        const retainer = lst.retainerName ? escapeHtml(lst.retainerName) : `リテーナー #${idx+1}`;
        
        const wName = lst.worldName || selectedWorld;
        const dcName = worldToDcMap[wName] || currentDc;
        const worldDcText = `${wName} (${dcName})`;

        html += `
          <div class="listing-card">
            <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px dashed rgba(255,255,255,0.08); padding-bottom:0.35rem;">
              <div style="display:flex; align-items:center; gap:0.4rem;">
                <span style="color:var(--accent-gold); font-weight:800; font-family:monospace; font-size:0.88rem;">#${idx + 1}</span>
                ${hqBadge}
                <span style="color:#94a3b8; font-size:0.75rem;"><i class="fa-solid fa-globe" style="color:var(--accent-blue);"></i> ${escapeHtml(worldDcText)}</span>
              </div>
              <div style="color:#60a5fa; font-weight:700; font-size:0.8rem; display:flex; align-items:center; gap:0.25rem;">
                <i class="fa-solid fa-store" style="font-size:0.75rem;"></i> リテーナー: ${retainer}
              </div>
            </div>

            <div style="display:flex; align-items:center; justify-content:space-between; padding-top:0.25rem;">
              <div style="display:flex; gap:0.6rem; color:var(--text-muted); font-size:0.78rem; align-items:center;">
                <span><i class="fa-solid fa-tag" style="color:var(--accent-green);"></i> 単価: <strong style="color:var(--accent-green);" class="font-mono">${unitPrice}G</strong></span>
                <span><i class="fa-solid fa-boxes-stacked" style="color:var(--text-muted);"></i> 出品数: <strong style="color:#fff;" class="font-mono">${qty}個</strong></span>
              </div>
              <div style="color:var(--accent-gold); font-weight:800; font-size:0.88rem; font-family:monospace; display:flex; align-items:center; gap:0.25rem;">
                <i class="fa-solid fa-coins" style="font-size:0.78rem;"></i> 合計: ${total}G
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

    } catch (err) {
      container.innerHTML = `<div style="text-align:center; padding:1.5rem; color:var(--accent-red); font-size:0.85rem;">出品データの取得に失敗しました (${err.message})</div>`;
    }
  }

  // Data Pipeline (FastLoad)
  async function loadData() {
    try {
      let data = null;
      try {
        const res = await fetch('data.json.gz');
        if (res.ok) {
          const arrayBuffer = await res.arrayBuffer();
          if (window.pako) {
            const str = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
            data = JSON.parse(str);
          }
        }
      } catch(e) {}

      if (!data) {
        try {
          const res = await fetch('data.json');
          if (res.ok) data = await res.json();
        } catch(e) {}
      }

      if (!data) {
        try {
          const res = await fetch('https://t-ichinose.github.io/ff14-market-tracker/data.json.gz');
          if (res.ok) {
            const arrayBuffer = await res.arrayBuffer();
            if (window.pako) {
              const str = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
              data = JSON.parse(str);
            }
          }
        } catch(e) {}
      }

      if (!data) throw new Error('データファイルのロードに失敗しました');

      rawData = data;
      allWorldsData = data.data || data.worlds || {};
      buildWorldToDcMap();
      populateMobileWorldSelect();
      renderMobileItemList();

    } catch(err) {
      console.error('loadData error:', err);
    }
  }

  // Touch & Swipe Listeners
  document.addEventListener('DOMContentLoaded', () => {
    loadData();

    const viewport = document.getElementById('mob-main-viewport');
    if (viewport) {
      viewport.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      viewport.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;

        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0 && currentTab < 3) {
            setMobileTab(currentTab + 1);
          } else if (diffX > 0 && currentTab > 1) {
            setMobileTab(currentTab - 1);
          }
        }
      }, { passive: true });
    }
  });
</script>
