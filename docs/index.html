<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>FF14 Market Analytics - Enriched Pro Dashboard</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #7928ca;
      --accent-gold: #ffb703;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --badge-hq-bg: rgba(239, 68, 68, 0.15);
      --badge-hq-border: rgba(239, 68, 68, 0.4);
      --badge-hq-text: #f87171;
      --badge-nq-bg: rgba(59, 130, 246, 0.15);
      --badge-nq-border: rgba(59, 130, 246, 0.4);
      --badge-nq-text: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.2);
      color: var(--accent-blue);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .search-modal-btn {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(121, 40, 202, 0.25));
      border: 1px solid var(--accent-blue);
      color: #ffffff;
      padding: 0.4rem 0.95rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.2s ease;
    }

    .search-modal-btn:hover {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
      transform: translateY(-1px);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-blue);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-blue);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .search-box {
      position: relative;
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    .dc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .dc-column {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 180px);
      min-height: 600px;
    }

    .dc-column-header {
      padding: 0.75rem 1.25rem;
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .dc-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dc-count-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-blue);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
    }

    .sort-toggle-group {
      display: flex;
      gap: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .sort-toggle-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: none;
      padding: 0.2rem 0.55rem;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .sort-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .sort-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
    }

    .dc-item-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .dc-item-list::-webkit-scrollbar {
      width: 6px;
    }

    .dc-item-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }

    .dc-item-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .dc-item-list::-webkit-scrollbar-thumb:hover {
      background: var(--accent-blue);
    }

    /* Enhanced Item Card */
    .item-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 210, 255, 0.3);
      background: rgba(15, 23, 42, 0.85);
    }

    .item-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      image-rendering: pixelated;
    }

    .lodestone-link-icon {
      color: var(--text-muted);
      font-size: 0.7rem;
      margin-left: 0.35rem;
      transition: color 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .lodestone-link-icon:hover {
      color: var(--accent-blue);
    }

    .item-card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .item-header-text {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
    }

    .rank-tag {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--accent-gold);
    }

    .item-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      line-height: 1.3;
      flex: 1;
    }

    .quality-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }

    .quality-hq {
      background: var(--badge-hq-bg);
      border: 1px solid var(--badge-hq-border);
      color: var(--badge-hq-text);
    }

    .quality-nq {
      background: var(--badge-nq-bg);
      border: 1px solid var(--badge-nq-border);
      color: var(--badge-nq-text);
    }

    .item-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .velocity-badge {
      color: var(--accent-green);
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.85rem;
    }

    .price-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-right: 0.2rem;
    }

    .price-main {
      font-weight: 700;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
    }

    .item-sub-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.4rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.06);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .history-range-row {
      font-size: 0.73rem;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 0.3rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .history-range-row i {
      color: var(--accent-blue);
      font-size: 0.7rem;
    }

    /* Fixed Cross DC Profit Box */
    .cross-profit-box {
      background: linear-gradient(135deg, rgba(121, 40, 202, 0.25), rgba(0, 210, 255, 0.25));
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 8px;
      padding: 0.45rem 0.65rem;
      font-size: 0.72rem;
      margin-top: 0.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .cross-profit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .profit-route {
      color: #f1f5f9;
      font-weight: 600;
      word-break: break-all;
    }

    .profit-rate {
      color: var(--accent-gold);
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      white-space: nowrap;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 15, 30, 0.8);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 92%;
      max-width: 950px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .modal-header {
      padding: 1.1rem 1.5rem;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      transition: color 0.15s;
    }

    .modal-close-btn:hover {
      color: #ffffff;
    }

    .modal-body {
      padding: 1.3rem 1.5rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-search-box {
      position: relative;
      display: flex;
      gap: 0.6rem;
    }

    .modal-search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .modal-search-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem 0.75rem 2.8rem;
      color: #ffffff;
      font-size: 0.95rem;
    }

    .modal-search-input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
    }

    .modal-search-btn {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border: none;
      color: #ffffff;
      font-weight: 700;
      padding: 0 1.3rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: opacity 0.2s;
    }

    .modal-search-btn:hover {
      opacity: 0.9;
    }

    .search-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 110px;
      overflow-y: auto;
    }

    .suggestion-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .suggestion-chip:hover {
      background: rgba(0, 210, 255, 0.2);
      border-color: var(--accent-blue);
      color: #ffffff;
    }

    .modal-item-summary {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .modal-item-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .modal-item-icon {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
    }

    .modal-item-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
    }

    .modal-item-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .modal-result-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
    }

    .modal-dc-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .modal-dc-name {
      font-weight: 800;
      font-size: 1.05rem;
      color: #ffffff;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* 2-Step Candidate List Styling */
    .candidate-list-header {
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.65rem;
    }

    .candidate-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .candidate-card:hover {
      background: rgba(0, 210, 255, 0.12);
      border-color: var(--accent-blue);
      transform: translateY(-1px);
    }

    .candidate-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
    }

    .candidate-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    .candidate-select-btn {
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.65rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
      pointer-events: none;
    }

    .modal-back-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 0.3rem 0.75rem;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .modal-back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .modal-empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 1400px) {
      .dc-grid { grid-template-columns: repeat(2, 1fr); }
      .dc-column { height: 550px; }
    }

    @media (max-width: 900px) {
      .modal-result-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .dc-grid { grid-template-columns: 1fr; }
      .dc-column { height: 500px; }
      h1 { font-size: 1.3rem; }
    }

    @media (max-width: 550px) {
      .modal-result-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-bolt-lightning"></i></div>
        <div>
          <h1>FF14 Market Board Analytics</h1>
        </div>
      </div>

      <div class="header-badges">
        <button class="search-modal-btn" onclick="openSearchModal()">
          <i class="fa-solid fa-magnifying-glass-chart"></i> 取引データ検索
        </button>
        <div class="status-badge" id="lastUpdatedBadge">
          <span class="status-dot"></span> 読み込み中...
        </div>
      </div>
    </header>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="全DC横断アイテム検索 (名前またはID)...">
    </div>

    <div class="dc-grid">

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: var(--accent-blue);"></i> Mana</div>
          <div style="display:flex;align-items:center;gap:0.4rem;">
            <div class="sort-toggle-group">
              <button class="sort-toggle-btn active" data-dc="Mana" data-sort="velocity" onclick="setSort('Mana','velocity')">売買数</button>
              <button class="sort-toggle-btn" data-dc="Mana" data-sort="revenue" onclick="setSort('Mana','revenue')">日商</button>
            </div>
            <span class="dc-count-badge" id="count-Mana">0件</span>
          </div>
        </div>
        <div class="dc-item-list" id="list-Mana">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: #a855f7;"></i> Elemental</div>
          <div style="display:flex;align-items:center;gap:0.4rem;">
            <div class="sort-toggle-group">
              <button class="sort-toggle-btn active" data-dc="Elemental" data-sort="velocity" onclick="setSort('Elemental','velocity')">売買数</button>
              <button class="sort-toggle-btn" data-dc="Elemental" data-sort="revenue" onclick="setSort('Elemental','revenue')">日商</button>
            </div>
            <span class="dc-count-badge" id="count-Elemental">0件</span>
          </div>
        </div>
        <div class="dc-item-list" id="list-Elemental">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: #ec4899;"></i> Gaia</div>
          <div style="display:flex;align-items:center;gap:0.4rem;">
            <div class="sort-toggle-group">
              <button class="sort-toggle-btn active" data-dc="Gaia" data-sort="velocity" onclick="setSort('Gaia','velocity')">売買数</button>
              <button class="sort-toggle-btn" data-dc="Gaia" data-sort="revenue" onclick="setSort('Gaia','revenue')">日商</button>
            </div>
            <span class="dc-count-badge" id="count-Gaia">0件</span>
          </div>
        </div>
        <div class="dc-item-list" id="list-Gaia">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: var(--accent-gold);"></i> Meteor</div>
          <div style="display:flex;align-items:center;gap:0.4rem;">
            <div class="sort-toggle-group">
              <button class="sort-toggle-btn active" data-dc="Meteor" data-sort="velocity" onclick="setSort('Meteor','velocity')">売買数</button>
              <button class="sort-toggle-btn" data-dc="Meteor" data-sort="revenue" onclick="setSort('Meteor','revenue')">日商</button>
            </div>
            <span class="dc-count-badge" id="count-Meteor">0件</span>
          </div>
        </div>
        <div class="dc-item-list" id="list-Meteor">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const DATACENTERS = ["Mana", "Elemental", "Gaia", "Meteor"];
    let allDcData = {};
    const sortMode = { Mana: 'velocity', Elemental: 'velocity', Gaia: 'velocity', Meteor: 'velocity' };

    function setSort(dc, mode) {
      sortMode[dc] = mode;
      // Update toggle button styles
      document.querySelectorAll(`.sort-toggle-btn[data-dc="${dc}"]`).forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sort === mode);
      });
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      renderAllColumns(searchTerm);
    }

    const FRONTEND_NAME_MAP = {
      49234: "剛力の心酔薬G4",
      49235: "活力の心酔薬G4",
      49236: "器用の心酔薬G4",
      49237: "敏捷の心酔薬G4",
      49238: "知力の心酔薬G4",
      49239: "精神の心酔薬G4",
      49240: "心力の心酔薬G4",
      49229: "フトコーラ",
      49209: "セドライト",
      47701: "トラルコーン",
      47740: "コザマル・カモミール",
      49230: "キャロットラペ",
      49225: "ローストチキン",
      49226: "メスカル",
      49227: "ベラフディアン・ペペロンチーノ",
      49228: "コンチャ",
      45972: "オルコクロマイト",
      45984: "クラロウォルナット原木",
      46188: "シデリティス茶葉",
      50414: "アイギス・エネルギーパック",
      52254: "カード:ノーマカー"
    };

    async function loadData() {
      try {
        const cacheBuster = `t=${Date.now()}_${Math.random()}`;
        const res = await fetch(`data.json?${cacheBuster}`, { 
          cache: "no-store"
        });
        if (!res.ok) throw new Error('Data fetch failed');
        const data = await res.json();

        document.getElementById('lastUpdatedBadge').innerHTML = `
          <span class="status-dot"></span> 最終更新: ${data.last_updated} (UTC)
        `;

        allDcData = data.data || {};
        renderAllColumns();

      } catch (err) {
        console.error("loadData error:", err);
        DATACENTERS.forEach(dc => {
          document.getElementById(`list-${dc}`).innerHTML = `
            <div style="text-align:center; padding:2rem; color:#ef4444;">
              <i class="fa-solid fa-triangle-exclamation"></i> データ取得エラー
            </div>
          `;
        });
      }
    }

    function renderAllColumns(searchTerm = "") {
      DATACENTERS.forEach(dc => {
        try {
          const rawItems = allDcData[dc] || [];
          
          let items = rawItems;
          if (searchTerm) {
            items = rawItems.filter(item => 
              item.item_name.toLowerCase().includes(searchTerm) ||
              item.item_id.toString().includes(searchTerm)
            );
          }

          // 重複除外
          const seenKeys = new Set();
          const uniqueItems = [];
          
          for (const item of items) {
            const q = item.quality || "NONE";
            const dupKey = `${item.item_id}_${q}`;
            
            if (q === "NONE" && seenKeys.has(`${item.item_id}_NQ`)) continue;
            if (q === "NQ" && seenKeys.has(`${item.item_id}_NONE`)) continue;

            if (!seenKeys.has(dupKey)) {
              seenKeys.add(dupKey);
              uniqueItems.push(item);
            }
          }

          document.getElementById(`count-${dc}`).innerText = `${uniqueItems.length}件`;
          const listEl = document.getElementById(`list-${dc}`);

          if (uniqueItems.length === 0) {
            listEl.innerHTML = `
              <div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.85rem;">
                高回転アイテム未検知
              </div>
            `;
            return;
          }

          // Sort by current mode
          const mode = sortMode[dc] || 'velocity';
          if (mode === 'revenue') {
            uniqueItems.sort((a, b) => {
              const revA = (Number(a.avg_price) || 0) * (Number(a.velocity) || 0);
              const revB = (Number(b.avg_price) || 0) * (Number(b.velocity) || 0);
              return revB - revA;
            });
          } else {
            uniqueItems.sort((a, b) => (Number(b.velocity) || 0) - (Number(a.velocity) || 0));
          }

          listEl.innerHTML = uniqueItems.map((item, idx) => {
            const q = item.quality || "NONE";
            let qualityBadge = "";
            
            if (q === "HQ" || (item.item_name && item.item_name.includes("[HQ]"))) {
              qualityBadge = `<span class="quality-badge quality-hq"><i class="fa-solid fa-crown"></i> HQ</span>`;
            } else if (q === "NQ" || (item.item_name && item.item_name.includes("[NQ]"))) {
              qualityBadge = `<span class="quality-badge quality-nq"><i class="fa-solid fa-box"></i> NQ</span>`;
            }

            let displayTitle = item.item_name || `Item ${item.item_id}`;
            if ((displayTitle.includes("Unknown") || displayTitle.startsWith("Item ")) && allItemSearchDict[item.item_id]) {
              displayTitle = allItemSearchDict[item.item_id];
            } else if (displayTitle.includes("Unknown") && FRONTEND_NAME_MAP[item.item_id]) {
              displayTitle = FRONTEND_NAME_MAP[item.item_id];
            }

            let cleanTitle = escapeHtml(displayTitle).replace(/\s*\[(NQ|HQ)\]\s*$/i, "").trim();

            // 完全修正したクロスDC転売利益バナー (買 ➔ 売 の両方を確実に美しく表示)
            let crossProfitBox = "";
            if (item.cross_info && item.cross_info.profit_rate >= 5.0) {
              const ci = item.cross_info;
              crossProfitBox = `
                <div class="cross-profit-box">
                  <div class="cross-profit-top">
                    <span class="profit-route"><i class="fa-solid fa-arrow-right-arrow-left"></i> 買: ${ci.cheap_scope} (${Number(ci.cheap_price).toLocaleString()}G) ➔ 売: ${ci.high_scope} (${Number(ci.high_price).toLocaleString()}G)</span>
                  </div>
                  <div style="text-align: right;">
                    <span class="profit-rate">+${Number(ci.profit_gil).toLocaleString()}G (${ci.profit_rate}%)</span>
                  </div>
                </div>
              `;
            }

            const minPriceStr = (item.min_price !== undefined && item.min_price !== null) 
              ? `${Number(item.min_price).toLocaleString()}G` 
              : '-';

            const avgPriceStr = (item.avg_price !== undefined && item.avg_price !== null) 
              ? `${Number(item.avg_price).toLocaleString()}G` 
              : '-';

            const hMin = (item.hist_min !== undefined && item.hist_min !== null) ? Number(item.hist_min) : Number(item.min_price || 0);
            const hMax = (item.hist_max !== undefined && item.hist_max !== null) ? Number(item.hist_max) : Number(item.max_price || hMin);

            let historyText = "";
            if (hMin === hMax) {
              historyText = `過去取引: ${hMin.toLocaleString()}G (固定価格帯)`;
            } else {
              historyText = `過去取引: 最安 ${hMin.toLocaleString()}G 〜 最高 ${hMax.toLocaleString()}G`;
            }

            const vel = (item.velocity !== undefined && item.velocity !== null) ? Number(item.velocity) : 0;
            const velStr = vel.toFixed(1);
            const avgPrice = (item.avg_price !== undefined && item.avg_price !== null) ? Number(item.avg_price) : 0;
            const dailyRevenue = Math.round(avgPrice * vel);
            const dailyRevenueStr = dailyRevenue.toLocaleString() + 'G';

            // Item icon
            const meta = item.meta || {};
            const iconUrl = meta.icon_url || '';
            const iconImg = iconUrl ? `<img class="item-icon" src="${iconUrl}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';

            const lodestoneUrl = `https://jp.finalfantasyxiv.com/lodestone/playguide/db/item/?patch=&db_search_category=item&category2=&q=${encodeURIComponent(displayTitle)}`;

            return `
              <div class="item-card">
                <div class="item-card-header">
                  ${iconImg}
                  <div class="item-header-text">
                    <span class="rank-tag">#${idx + 1}</span>
                    <span class="item-card-title">
                      ${cleanTitle}
                      <a href="${lodestoneUrl}" target="_blank" rel="noopener" class="lodestone-link-icon" title="Lodestoneで検索">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                      </a>
                    </span>
                    ${qualityBadge}
                  </div>
                </div>
                
                <div class="item-stats-row">
                  <span class="velocity-badge"><i class="fa-solid fa-bolt"></i> ${velStr} 個/日</span>
                  <span class="price-main"><span class="price-label">推定日商:</span>${dailyRevenueStr}</span>
                </div>

                <div class="item-sub-grid">
                  <div><span style="color:var(--text-muted);">出品最安:</span> <strong style="color:#ffffff;">${minPriceStr}</strong></div>
                  <div style="text-align:right;"><span style="color:var(--text-muted);">平均:</span> <strong style="color:#ffffff;">${avgPriceStr}</strong></div>
                </div>

                <div class="history-range-row">
                  <i class="fa-solid fa-clock-rotate-left"></i> ${historyText}
                </div>

                ${crossProfitBox}
              </div>
            `;
          }).join('');
        } catch (colErr) {
          console.error(`Error rendering column ${dc}:`, colErr);
        }
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      renderAllColumns(term);
    });

    setInterval(loadData, 60000);
    loadData();

    // Load full 16,843 marketable items index for instant Japanese search
    let allItemSearchDict = {};
    async function loadItemSearchDict() {
      try {
        const res = await fetch('items_search.json');
        if (res.ok) {
          allItemSearchDict = await res.json();
        }
      } catch (e) {
        console.warn("Could not load items_search.json:", e);
      }
    }
    loadItemSearchDict();

    // Modal Search System
    function openSearchModal() {
      document.getElementById('searchModal').classList.add('active');
      document.getElementById('modalItemSearchInput').focus();
    }

    function closeSearchModal() {
      document.getElementById('searchModal').classList.remove('active');
    }

    function closeSearchModalOnOverlay(e) {
      if (e.target.id === 'searchModal') {
        closeSearchModal();
      }
    }

    let searchDebounce = null;
    document.getElementById('modalItemSearchInput').addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      const query = e.target.value.trim();
      if (!query) {
        document.getElementById('modalSearchSuggestions').innerHTML = '';
        return;
      }
      searchDebounce = setTimeout(() => {
        showModalSuggestions(query);
      }, 150);
    });

    document.getElementById('modalItemSearchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        executeModalSearch();
      }
    });

    function showModalSuggestions(query) {
      const q = query.toLowerCase();
      const suggestionsEl = document.getElementById('modalSearchSuggestions');
      const matchedMap = new Map();

      // 1. Search in full 16,843 items_search.json index
      for (const [idStr, name] of Object.entries(allItemSearchDict)) {
        if (name.toLowerCase().includes(q) || idStr.includes(q)) {
          matchedMap.set(Number(idStr), name);
          if (matchedMap.size >= 20) break;
        }
      }

      // 2. Search in active dashboard cards
      DATACENTERS.forEach(dc => {
        (allDcData[dc] || []).forEach(item => {
          const name = item.item_name || '';
          const clean = name.replace(/\s*\[(NQ|HQ)\]\s*$/, '').trim();
          if (clean.toLowerCase().includes(q) || String(item.item_id).includes(q)) {
            if (!matchedMap.has(item.item_id)) {
              matchedMap.set(item.item_id, clean);
            }
          }
        });
      });

      let chips = [];
      matchedMap.forEach((name, id) => {
        chips.push(`<div class="suggestion-chip" onclick="selectModalItem(${id})"><i class="fa-solid fa-box"></i> ${escapeHtml(name)} (${id})</div>`);
      });

      if (/^\d+$/.test(query) && !matchedMap.has(Number(query))) {
        chips.unshift(`<div class="suggestion-chip" onclick="selectModalItem(${query})"><i class="fa-solid fa-hashtag"></i> アイテム ID:${query} を即時検索</div>`);
      }

      if (chips.length > 0) {
        suggestionsEl.innerHTML = chips.slice(0, 15).join('');
      } else {
        suggestionsEl.innerHTML = `<div class="suggestion-chip" onclick="executeModalSearch()"><i class="fa-solid fa-magnifying-glass"></i> "${escapeHtml(query)}" を検索...</div>`;
      }
    }

    let lastSearchKeyword = '';
    let lastSearchResults = [];

    async function executeModalSearch() {
      const input = document.getElementById('modalItemSearchInput').value.trim();
      if (!input) return;

      if (/^\d+$/.test(input)) {
        selectModalItem(Number(input), `アイテム ID:${input}`);
        return;
      }

      const q = input.toLowerCase();
      const matched = [];

      // Step 1: Collect all partial matches from 16,843 item index
      for (const [idStr, name] of Object.entries(allItemSearchDict)) {
        if (name.toLowerCase().includes(q) || idStr.includes(q)) {
          matched.push({ id: Number(idStr), name: name });
        }
      }

      lastSearchKeyword = input;
      lastSearchResults = matched;

      if (matched.length === 0) {
        // Fallback: try XIVAPI search if local index missed
        const resultArea = document.getElementById('modalResultArea');
        resultArea.innerHTML = `<div class="modal-empty-state"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--accent-blue);"></i><p style="margin-top:0.8rem;">検索中...</p></div>`;

        try {
          const url = `https://xivapi.com/search?string=${encodeURIComponent(input)}&indexes=item&language=ja`;
          const res = await fetch(url);
          const data = await res.json();

          if (data.Results && data.Results.length > 0) {
            data.Results.forEach(r => matched.push({ id: r.ID, name: r.Name }));
            lastSearchResults = matched;
            renderCandidateList(input, matched);
          } else {
            resultArea.innerHTML = `<div class="modal-empty-state"><i class="fa-solid fa-circle-exclamation" style="font-size:2rem;color:var(--accent-gold);"></i><p style="margin-top:0.8rem;">"${escapeHtml(input)}" に該当するアイテムが見つかりませんでした。</p></div>`;
          }
        } catch (err) {
          resultArea.innerHTML = `<div class="modal-empty-state"><i class="fa-solid fa-circle-exclamation" style="font-size:2rem;color:var(--accent-gold);"></i><p style="margin-top:0.8rem;">"${escapeHtml(input)}" に該当するアイテムが見つかりませんでした。</p></div>`;
        }
      } else if (matched.length === 1) {
        // Single exact match -> directly show details
        selectModalItem(matched[0].id, matched[0].name);
      } else {
        // Step 1: Render candidate list
        renderCandidateList(input, matched);
      }
    }

    function renderCandidateList(keyword, candidates) {
      const resultArea = document.getElementById('modalResultArea');
      let cardsHtml = candidates.map(c => `
        <div class="candidate-card" onclick="selectModalItem(${c.id})">
          <div>
            <div class="candidate-name">${escapeHtml(c.name)}</div>
            <div class="candidate-meta">アイテム ID: ${c.id}</div>
          </div>
          <div class="candidate-select-btn">取引データを表示 <i class="fa-solid fa-chevron-right"></i></div>
        </div>
      `).join('');

      resultArea.innerHTML = `
        <div class="candidate-list-header">
          <span><i class="fa-solid fa-list-check" style="color:var(--accent-blue);"></i> "${escapeHtml(keyword)}" の該当アイテム (${candidates.length}件) - 確定するアイテムを選択してください</span>
        </div>
        <div class="candidate-grid">
          ${cardsHtml}
        </div>
      `;
    }

    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 6000 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(id);
        return response;
      } catch (error) {
        clearTimeout(id);
        return null;
      }
    }

    async function selectModalItem(itemId, itemName) {
      document.getElementById('modalSearchSuggestions').innerHTML = '';
      const resultArea = document.getElementById('modalResultArea');
      resultArea.innerHTML = `
        <div class="modal-empty-state">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:2.5rem;color:var(--accent-blue);"></i>
          <p style="margin-top:0.8rem;">全4DCのリアルタイム取引データを取得中...</p>
        </div>
      `;

      const displayName = allItemSearchDict[itemId] || itemName || `アイテム ID: ${itemId}`;
      const lodestoneUrl = `https://jp.finalfantasyxiv.com/lodestone/playguide/db/item/?patch=&db_search_category=item&category2=&q=${encodeURIComponent(displayName)}`;

      try {
        const dcs = ["Mana", "Elemental", "Gaia", "Meteor"];
        const uniPromises = dcs.map(dc => 
          fetchWithTimeout(`https://universalis.app/api/v2/${dc}/${itemId}?entriesToReturn=100`, { timeout: 6000 })
            .then(r => (r && r.ok) ? r.json() : null)
            .catch(() => null)
        );

        const uniResults = await Promise.all(uniPromises);

        const backBtnHtml = (lastSearchResults && lastSearchResults.length > 1) 
          ? `<button class="modal-back-btn" onclick="renderCandidateList('${escapeHtml(lastSearchKeyword)}', lastSearchResults)"><i class="fa-solid fa-arrow-left"></i> 候補一覧に戻る</button>`
          : '';

        let headerHtml = `
          <div class="modal-item-summary">
            <div class="modal-item-info">
              <div>
                <div class="modal-item-name">${escapeHtml(displayName)}</div>
                <div class="modal-item-meta">アイテム ID: ${itemId}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:0.6rem;">
              ${backBtnHtml}
              <a href="${lodestoneUrl}" target="_blank" rel="noopener" class="lodestone-link-icon" style="font-size:0.85rem;" title="Lodestoneで確認">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Lodestone
              </a>
            </div>
          </div>
        `;

        let dcCardsHtml = '';
        let validDcPrices = [];

        dcs.forEach((dc, idx) => {
          const data = uniResults[idx];
          if (!data) {
            dcCardsHtml += `
              <div class="modal-dc-card">
                <div class="modal-dc-name"><i class="fa-solid fa-server" style="font-size:0.85rem;color:var(--text-muted);"></i> ${dc}</div>
                <div style="color:var(--text-muted);font-size:0.8rem;padding:1rem 0;text-align:center;">データなし</div>
              </div>
            `;
            return;
          }

          const minPrice = data.minPrice || 0;
          const minPriceStr = minPrice ? minPrice.toLocaleString() + 'G' : '-';
          
          if (minPrice > 0) {
            validDcPrices.push({ dc, price: minPrice });
          }

          const history = data.recentHistory || [];
          const prices = history.map(h => h.pricePerUnit).filter(p => p > 0);
          
          let hMin = prices.length ? Math.min(...prices) : (data.minPrice || 0);
          let hMax = prices.length ? Math.max(...prices) : (data.maxPrice || hMin);
          let hAvg = prices.length ? Math.round(prices.reduce((a,b)=>a+b, 0) / prices.length * 10) / 10 : Math.round(data.averagePrice || hMin);

          if (hAvg < hMin) hAvg = hMin;
          if (hAvg > hMax) hAvg = hMax;

          const vel = Number(data.dailySaleVelocity || data.regularSaleVelocity || 0);
          const velStr = vel.toFixed(1);
          const dailyRevenue = Math.round(hAvg * vel);

          let historyText = "";
          if (hMin === hMax) {
            historyText = `過去取引: ${hMin.toLocaleString()}G (固定価格帯)`;
          } else {
            historyText = `過去取引: 最安 ${hMin.toLocaleString()}G 〜 最高 ${hMax.toLocaleString()}G`;
          }

          dcCardsHtml += `
            <div class="modal-dc-card">
              <div class="modal-dc-name">
                <i class="fa-solid fa-server" style="font-size:0.85rem;color:var(--accent-blue);"></i> ${dc}
              </div>
              <div class="item-stats-row" style="margin-top:0.2rem;">
                <span class="velocity-badge"><i class="fa-solid fa-bolt"></i> ${velStr} 個/日</span>
                <span class="price-main"><span class="price-label">推定日商:</span>${dailyRevenue.toLocaleString()}G</span>
              </div>
              <div class="item-sub-grid">
                <div><span style="color:var(--text-muted);">出品最安:</span> <strong style="color:#ffffff;">${minPriceStr}</strong></div>
                <div style="text-align:right;"><span style="color:var(--text-muted);">平均:</span> <strong style="color:#ffffff;">${hAvg.toLocaleString()}G</strong></div>
              </div>
              <div class="history-range-row">
                <i class="fa-solid fa-clock-rotate-left"></i> ${historyText}
              </div>
            </div>
          `;
        });

        let crossProfitHtml = '';
        if (validDcPrices.length >= 2) {
          validDcPrices.sort((a, b) => a.price - b.price);
          const cheap = validDcPrices[0];
          const high = validDcPrices[validDcPrices.length - 1];
          const profitGil = Math.floor(high.price * 0.95 - cheap.price);
          const profitRate = cheap.price > 0 ? (profitGil / cheap.price * 100).toFixed(1) : 0;

          if (profitGil > 0 && profitRate >= 5.0) {
            crossProfitHtml = `
              <div class="cross-profit-box" style="margin-top:0.5rem;">
                <div class="cross-profit-top">
                  <span class="profit-route"><i class="fa-solid fa-arrow-right-arrow-left"></i> 全DC比較 | 買: ${cheap.dc} (${cheap.price.toLocaleString()}G) ➔ 売: ${high.dc} (${high.price.toLocaleString()}G)</span>
                </div>
                <div style="text-align: right;">
                  <span class="profit-rate">+${profitGil.toLocaleString()}G (${profitRate}%)</span>
                </div>
              </div>
            `;
          }
        }

        resultArea.innerHTML = `
          ${headerHtml}
          ${crossProfitHtml}
          <div class="modal-result-grid" style="margin-top:0.8rem;">
            ${dcCardsHtml}
          </div>
        `;
      } catch (err) {
        resultArea.innerHTML = `<div class="modal-empty-state"><i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;color:#ef4444;"></i><p style="margin-top:0.8rem;">データ取得中にエラーが発生しました: ${escapeHtml(err.message)}</p></div>`;
      }
    }
  </script>

  <!-- Modal Structure -->
  <div class="modal-overlay" id="searchModal" onclick="closeSearchModalOnOverlay(event)">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fa-solid fa-magnifying-glass-chart" style="color:var(--accent-blue);"></i> 単体アイテム取引データ検索</h2>
        <button class="modal-close-btn" onclick="closeSearchModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body">
        <div class="modal-search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="modal-search-input" id="modalItemSearchInput" placeholder="アイテム名（日本語）または ID を入力（例: 剛力の心酔薬G4, 49234）..." autocomplete="off">
          <button class="modal-search-btn" id="modalSearchExecuteBtn" onclick="executeModalSearch()"><i class="fa-solid fa-search"></i> 検索</button>
        </div>

        <div id="modalSearchSuggestions" class="search-suggestions"></div>

        <div id="modalResultArea" class="modal-result-area">
          <div class="modal-empty-state">
            <i class="fa-solid fa-box-open" style="font-size:2.5rem;color:var(--text-muted);margin-bottom:0.8rem;"></i>
            <p>アイテム名を入力または候補を選択して、全4DCのリアルタイム取引データを検索・比較します。</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
