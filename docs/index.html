<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF14 Market Analytics - NQ/HQ Separated View</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #7928ca;
      --accent-gold: #ffb703;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --badge-hq-bg: rgba(239, 68, 68, 0.15);
      --badge-hq-border: rgba(239, 68, 68, 0.4);
      --badge-hq-text: #f87171;
      --badge-nq-bg: rgba(59, 130, 246, 0.15);
      --badge-nq-border: rgba(59, 130, 246, 0.4);
      --badge-nq-text: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.2);
      color: var(--accent-blue);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .filter-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid rgba(255, 183, 3, 0.3);
      color: var(--accent-gold);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-blue);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-blue);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .search-box {
      position: relative;
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    .dc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .dc-column {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 180px);
      min-height: 600px;
    }

    .dc-column-header {
      padding: 1rem 1.25rem;
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .dc-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dc-count-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-blue);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
    }

    .dc-item-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .dc-item-list::-webkit-scrollbar {
      width: 6px;
    }

    .dc-item-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }

    .dc-item-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .dc-item-list::-webkit-scrollbar-thumb:hover {
      background: var(--accent-blue);
    }

    .item-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 210, 255, 0.3);
      background: rgba(15, 23, 42, 0.85);
    }

    .item-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }

    .rank-tag {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--accent-gold);
    }

    .item-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      line-height: 1.3;
      flex: 1;
    }

    .quality-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;

    }

    .quality-hq {
      background: var(--badge-hq-bg);
      border: 1px solid var(--badge-hq-border);
      color: var(--badge-hq-text);
    }

    .quality-nq {
      background: var(--badge-nq-bg);
      border: 1px solid var(--badge-nq-border);
      color: var(--badge-nq-text);
    }

    .item-card-id {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      white-space: nowrap;
    }

    .item-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }

    .velocity-badge {
      color: #4ade80;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.85rem;
    }

    .price-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-right: 0.2rem;
    }

    .price-main {
      font-weight: 700;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
    }

    .item-sub-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.06);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 1400px) {
      .dc-grid { grid-template-columns: repeat(2, 1fr); }
      .dc-column { height: 550px; }
    }

    @media (max-width: 768px) {
      .dc-grid { grid-template-columns: 1fr; }
      .dc-column { height: 500px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-bolt-lightning"></i></div>
        <div>
          <h1>FF14 Market Board Analytics</h1>
        </div>
      </div>

      <div class="header-badges">
        <div class="filter-badge">
          <i class="fa-solid fa-fire"></i> 1日50個以上売れる超高流動品 (NQ/HQ独立表示)
        </div>
        <div class="status-badge" id="lastUpdatedBadge">
          <span class="status-dot"></span> 読み込み中...
        </div>
      </div>
    </header>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="全DC横断アイテム検索 (名前またはID)...">
    </div>

    <div class="dc-grid">

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: var(--accent-blue);"></i> Mana</div>
          <span class="dc-count-badge" id="count-Mana">0件</span>
        </div>
        <div class="dc-item-list" id="list-Mana">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: #a855f7;"></i> Elemental</div>
          <span class="dc-count-badge" id="count-Elemental">0件</span>
        </div>
        <div class="dc-item-list" id="list-Elemental">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: #ec4899;"></i> Gaia</div>
          <span class="dc-count-badge" id="count-Gaia">0件</span>
        </div>
        <div class="dc-item-list" id="list-Gaia">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: var(--accent-gold);"></i> Meteor</div>
          <span class="dc-count-badge" id="count-Meteor">0件</span>
        </div>
        <div class="dc-item-list" id="list-Meteor">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const DATACENTERS = ["Mana", "Elemental", "Gaia", "Meteor"];
    let allDcData = {};

    async function loadData() {
      try {
        const res = await fetch('data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error('Data fetch failed');
        const data = await res.json();

        document.getElementById('lastUpdatedBadge').innerHTML = `
          <span class="status-dot"></span> 最終更新: ${data.last_updated} (UTC)
        `;

        allDcData = data.data || {};
        renderAllColumns();

      } catch (err) {
        console.error(err);
        DATACENTERS.forEach(dc => {
          document.getElementById(`list-${dc}`).innerHTML = `
            <div style="text-align:center; padding:2rem; color:#ef4444;">
              <i class="fa-solid fa-triangle-exclamation"></i> データ取得エラー
            </div>
          `;
        });
      }
    }

    function renderAllColumns(searchTerm = "") {
      DATACENTERS.forEach(dc => {
        const rawItems = allDcData[dc] || [];
        
        let items = rawItems;
        if (searchTerm) {
          items = rawItems.filter(item => 
            item.item_name.toLowerCase().includes(searchTerm) ||
            item.item_id.toString().includes(searchTerm)
          );
        }

        document.getElementById(`count-${dc}`).innerText = `${items.length}件`;
        const listEl = document.getElementById(`list-${dc}`);

        if (items.length === 0) {
          listEl.innerHTML = `
            <div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.85rem;">
              高回転アイテム未検知
            </div>
          `;
          return;
        }

        listEl.innerHTML = items.map((item, idx) => {
          const isHQ = item.quality === "HQ" || item.item_name.includes("[HQ]");
          const qualityBadge = isHQ 
            ? `<span class="quality-badge quality-hq"><i class="fa-solid fa-crown"></i> HQ</span>`
            : `<span class="quality-badge quality-nq"><i class="fa-solid fa-box"></i> NQ</span>`;

          return `
            <div class="item-card">
              <div class="item-card-header">
                <span class="rank-tag">#${idx + 1}</span>
                <span class="item-card-title">${escapeHtml(item.item_name)}</span>
                ${qualityBadge}
              </div>
              
              <div class="item-stats-row">
                <span class="velocity-badge"><i class="fa-solid fa-bolt"></i> ${item.velocity.toFixed(1)} 個/日</span>
                <span class="price-main"><span class="price-label">最安:</span>${item.min_price.toLocaleString()}G</span>
              </div>

              <div class="item-sub-grid">
                <div>平均: ${item.avg_price.toLocaleString()}G</div>
                <div>在庫: ${item.units_for_sale.toLocaleString()}個 (${item.listings_count}出品)</div>
              </div>
            </div>
          `;
        }).join('');
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      renderAllColumns(term);
    });

    loadData();
  </script>
</body>
</html>
