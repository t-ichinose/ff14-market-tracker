            <!-- 販売先 テーブル表示エリア (切替タブ ＋ NQスイッチ) -->
            <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
              <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.4rem; flex-shrink:0;">
                <div class="view-toggle-group">
                  <button class="view-toggle-btn ${pcArbHomeViewMode === 'history' ? 'active' : ''}" onclick="setArbHomeViewMode('history')">
                    <i class="fa-solid fa-clock-rotate-left"></i> 取引履歴
                  </button>
                  <button class="view-toggle-btn ${pcArbHomeViewMode === 'listings' ? 'active' : ''}" onclick="setArbHomeViewMode('listings')">
                    <i class="fa-solid fa-list-ul"></i> 出品一覧
                  </button>
                </div>

                <button class="filter-toggle-btn ${pcArbHomeHqOnly ? 'active' : ''}" onclick="toggleArbHomeHqOnly()" style="padding:2px 8px; font-size:0.72rem; border-radius:6px;">
                  <i class="fa-solid fa-filter"></i> ${pcArbHomeHqOnly ? 'HQのみ' : 'NQ含'}
                </button>
              </div>

              <div class="history-table-container" style="flex:1; min-height:0; max-height:none !important; overflow-y:auto; border-radius:8px;">
                <table class="history-table" style="font-size:0.7rem;">
                  ${pcArbHomeViewMode === 'listings' ? `
                    <thead>
                      <tr>
                        <th>ワールド</th>
                        <th>リテイナー</th>
                        <th>品質</th>
                        <th>単価 (G)</th>
                        <th>数量</th>
                        <th>合計 (G)</th>
                      </tr>
                    </thead>
                    <tbody id="pcArbHomeListingsTbody">
                      <tr><td colspan="6" style="text-align:center; padding:1.5rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 出品データを取得中...</td></tr>
                    </tbody>
                  ` : `
                    <thead>
                      <tr>
                        <th>日時 (JST)</th>
                        <th>購入者</th>
                        <th>HQ</th>
                        <th>単価 (G)</th>
                        <th>数量</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${homeHistories.length > 0 ? homeHistories.slice(0, 50).map(h => {
                        const buyerName = h.buyer ? escapeHtml(h.buyer) : `<span style="color:var(--text-muted); font-size:0.68rem;">-</span>`;
                        return `
                        <tr>
                          <td style="color:var(--text-muted); font-size:0.68rem;">${formatTimeLocal(new Date(h.ts * 1000).toISOString()).slice(5)}</td>
                          <td style="font-size:0.68rem; font-weight:600; color:var(--accent-blue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px;" title="${h.buyer ? escapeHtml(h.buyer) : ''}">${buyerName}</td>
                          <td>${h.hq ? '<span class="hq-badge">HQ</span>' : '<span style="color:var(--text-muted);">NQ</span>'}</td>
                          <td style="font-weight:700;">${(h.price || 0).toLocaleString()}G</td>
                          <td>${(h.qty || 0)}個</td>
                        </tr>
                      `;}).join('') : '<tr><td colspan="5" style="text-align:center; padding:1.5rem; color:var(--text-muted);">履歴なし</td></tr>'}
                    </tbody>
                  `}
                </table>
              </div>
            </div>
          </div>

        </div>
      `;

      wrapper.innerHTML = html;

      // 両窓の7日間相場推移チャートを描画 (自動数学パディングで左右完全垂直同期)
      drawTrendChart('pcArbSourceCanvas', 'pcArbSourceSummary', sourceTrendObj.trend, sourceTrendObj.trendPct, { height: 105, paddingTop: 12, paddingBottom: 16 });
      drawTrendChart('pcArbHomeCanvas', 'pcArbHomeSummary', homeTrendObj.trend, homeTrendObj.trendPct, { height: 105, paddingTop: 12, paddingBottom: 16 });

      // 出品モードがアクティブな場合は Universalis ライブ出品データを取得描画
      if (pcArbSourceViewMode === 'listings') {
        fetchAndRenderArbListings('pcArbSourceListingsTbody', 'Japan', itemId, pcArbSourceHqOnly, true);
      }
      if (pcArbHomeViewMode === 'listings') {
        fetchAndRenderArbListings('pcArbHomeListingsTbody', homeWorld, itemId, pcArbHomeHqOnly, false);
      }
    }

function updateArbitrageFilters() {
      const homeWorldSelect = document.getElementById('arbHomeWorldSelect');
      if (homeWorldSelect && homeWorldSelect.value) {
        saveUserHomeWorld(homeWorldSelect.value);
        currentModalWorld = homeWorldSelect.value;
      }
      renderArbitrageGrid();
    }

    function getRecent3DayAvg(item) {
      if (!item) return 0;
      const { trend } = getOrComputeDailyTrend(item);
      if (trend && trend.length >= 3) {
        const last3 = trend.slice(-3);
        const rQty = last3.reduce((acc, d) => acc + (d.volume || 0), 0);
        const rRev = last3.reduce((acc, d) => acc + ((d.weighted_avg || 0) * (d.volume || 0)), 0);
        if (rQty > 0) return Math.round(rRev / rQty);
      }
      return item.avg_price || 0;
    }

    function renderArbitrageGrid() {
      const container = document.getElementById('arbitrageCardGrid');
      if (!container) return;

      if (Object.keys(allData).length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--text-muted); grid-column:1/-1;">データを読み込み中...</div>`;
        return;
      }

      const homeWorldSelect = document.getElementById('arbHomeWorldSelect');
      const arbHomeWorld = homeWorldSelect ? homeWorldSelect.value : 'Chocobo';

      // PC表示用ヘッダー動的挿入
      const arbCol = document.getElementById('arbitrageWorldColumn');
      if (arbCol) {
        let optGroups = '';
        for (const [dcName, wList] of Object.entries(dcWorldsMap || {})) {
          optGroups += '<optgroup label="' + dcName + ' DC">';
          for (const w of wList) {
            const isSel = (w === arbHomeWorld) ? 'selected' : '';
            optGroups += '<option value="' + w + '" ' + isSel + '>🌐 ' + w + ' (' + dcName + ')</option>';
          }
          optGroups += '</optgroup>';
        }
        const pcHomeSelectHtml = '<select class="pc-world-select" id="arbHomeWorldSelect" style="flex:1; width:100%; font-size:0.88rem; font-weight:600; padding:6px 8px; border-radius:8px;" onchange="updateArbitrageFilters()">' + optGroups + '</select>';

        const pcArbHeaderHtml = `
          <div class="left-pane-header">
            <!-- 1行目: ソート2タブ (利益額/日商額) ＋ 数量フィルタードロップダウン ＋ クリスタルON/OFF -->
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px;">
              <div class="sort-toggle-group" style="display: flex; gap: 3px; background: rgba(0,0,0,0.4); padding: 3px; border-radius: 8px; border: 1px solid var(--card-border);">
                <button class="sort-toggle-btn ${currentArbSortMode === 'unitProfit' ? 'active' : ''}" onclick="setArbSort('unitProfit')" style="padding: 4px 10px; font-size: 0.74rem;">利益額</button>
                <button class="sort-toggle-btn ${currentArbSortMode === 'dailyProfit' ? 'active' : ''}" onclick="setArbSort('dailyProfit')" style="padding: 4px 10px; font-size: 0.74rem;">日商額</button>
              </div>

              <!-- 数量フィルター (日当たり売買数) -->
              <div style="display: flex; align-items: center; gap: 4px; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 8px; border: 1px solid var(--card-border); flex: 1;">
                <i class="fa-solid fa-bolt" style="color: var(--accent-blue); font-size: 0.72rem;"></i>
                <select id="arbMinVelSelect" class="pc-world-select" style="padding: 2px 4px; font-size: 0.74rem; border: none; background: transparent; color: #ffffff; width: 100%; cursor: pointer;" onchange="currentArbMinVel=this.value; updateArbitrageFilters();">
                  <option value="0" ${currentArbMinVel == 0 ? 'selected' : ''}>制限なし</option>
                  <option value="0.1" ${currentArbMinVel == 0.1 ? 'selected' : ''}>0.1個/日以上</option>
                  <option value="1" ${currentArbMinVel == 1 ? 'selected' : ''}>1個/日以上</option>
                  <option value="5" ${currentArbMinVel == 5 ? 'selected' : ''}>5個/日以上</option>
                  <option value="10" ${currentArbMinVel == 10 ? 'selected' : ''}>10個/日以上</option>
                  <option value="20" ${currentArbMinVel == 20 ? 'selected' : ''}>20個/日以上</option>
                  <option value="50" ${currentArbMinVel == 50 ? 'selected' : ''}>50個/日以上</option>
                  <option value="100" ${currentArbMinVel == 100 ? 'selected' : ''}>100個/日以上</option>
                </select>
              </div>

              <button class="filter-toggle-btn crystal-filter-btn ${excludeCrystals ? 'active' : ''}" id="pcCrystalFilterBtn2" onclick="toggleCrystalFilter()" title="クリスタル類の表示/除外" style="padding: 4px 8px; font-size: 0.74rem; border-radius: 8px; white-space: nowrap;">
                <i class="fa-solid fa-gem"></i> ${excludeCrystals ? 'ON' : 'OFF'}
              </button>
            </div>
            <!-- 2行目: ホームワールド選択ラベル ＋ ドロップダウン -->
            <div style="display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 6px;">
              <span style="font-size: 0.88rem; font-weight: 700; color: #94a3b8; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;">
                <i class="fa-solid fa-house-user" style="color: var(--accent-gold);"></i> ホーム:
              </span>
              ${pcHomeSelectHtml}
            </div>
            <!-- 3行目: ホームワールド選択直下の全3200品目検索ボックス -->
            <div style="position: relative; width: 100%;">
              <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.82rem; color: #94a3b8;"></i>
              <input type="text" id="pcArbitrageSearchInput" class="search-input" value="${pcArbitrageSearchTerm}" placeholder="アイテム検索..." style="width: 100%; padding: 6px 28px 6px 30px; font-size: 0.88rem; font-weight: 600; border-radius: 8px;" oninput="onArbSearchInput(this.value)">
              ${pcArbitrageSearchTerm ? `<i class="fa-solid fa-xmark" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 0.88rem; color: #94a3b8; cursor: pointer;" onclick="clearPcArbitrageSearch()"></i>` : ''}
            </div>
          </div>
        `;
        
        const existingHeader = arbCol.querySelector('.left-pane-header');
        if (existingHeader) existingHeader.outerHTML = pcArbHeaderHtml;
        else arbCol.insertAdjacentHTML('afterbegin', pcArbHeaderHtml);
      }
      const arbSort = document.getElementById('arbSortSelect')?.value || 'unitProfit';
      const arbScope = document.getElementById('arbScopeSelect')?.value || 'all';
      const arbMinRoi = parseFloat(document.getElementById('arbMinRoiSelect')?.value || '15');
      const arbMinVel = parseFloat(document.getElementById('arbMinVelSelect')?.value || '0');

      const homeItems = allData[arbHomeWorld] || [];
      const homeDc = findDcForWorld(arbHomeWorld);

      const homeItemMap = new Map();
      for (const item of homeItems) {
        if ((item.sale_velocity || 0) >= arbMinVel && (item.sale_trades || 0) > 0) {
          homeItemMap.set(item.item_id, item);
        }
      }

      let allowedWorlds = [];
      if (arbScope === 'same_dc') {
        allowedWorlds = (dcWorldsMap[homeDc] || []).filter(w => w !== arbHomeWorld);
      } else {
        for (const worlds of Object.values(dcWorldsMap || {})) {
          for (const w of worlds) {
            if (w !== arbHomeWorld) allowedWorlds.push(w);
          }
        }
      }

      const opportunities = [];

      // Pre-build Map index per allowed world for O(1) item lookup (instead of O(K) find per iteration)
      const worldItemMaps = {};
      for (const w of allowedWorlds) {
        const items = allData[w] || [];
        worldItemMaps[w] = new Map(items.map(x => [x.item_id, x]));
      }

      for (const [itemId, homeItem] of homeItemMap.entries()) {
        if (excludeCrystals && isCrystalItem(homeItem)) continue;
        if (pcArbitrageSearchTerm) {
          const title = (homeItem.item_name || '').toLowerCase();
          if (!title.includes(pcArbitrageSearchTerm) && !String(itemId).includes(pcArbitrageSearchTerm)) continue;
        }

        let bestOp = null;
        let maxProfit = -1;

        for (const sourceWorld of allowedWorlds) {
          const sourceItem = worldItemMaps[sourceWorld].get(itemId);
          if (!sourceItem) continue;

          // 直近3日平均相場ベースでリアルタイム比較
          const buyPrice = getRecent3DayAvg(sourceItem) || sourceItem.avg_price || 0;
          const sellPrice = getRecent3DayAvg(homeItem) || homeItem.avg_price || 0;

          if (buyPrice <= 0 || sellPrice <= 0) continue;

          const netCost = buyPrice * 1.05;
          const netReturn = sellPrice * 0.95;
          const unitProfit = Math.round(netReturn - netCost);

          if (unitProfit <= 0) continue;

          const roiPercent = ((unitProfit / netCost) * 100);
          if (roiPercent < arbMinRoi) continue;

          const dailyExpectedProfit = Math.round(unitProfit * (homeItem.sale_velocity || 0));

          // 各商品で最も純利益が大きい仕入れ元ワールドを選定
          if (unitProfit > maxProfit) {
            maxProfit = unitProfit;
            bestOp = {
              itemId,
              homeItem,
              sourceItem,
              sourceWorld,
              sourceDc: findDcForWorld(sourceWorld),
              buyPrice,
              sellPrice,
              netCost,
              netReturn,
              unitProfit,
              roiPercent: Math.round(roiPercent * 10) / 10,
              dailyExpectedProfit
            };
          }
        }

        if (bestOp) {
          opportunities.push(bestOp);
        }
      }

      // ソート順の適用 (利益額 or 日商額)
      const effectiveSort = currentArbSortMode;
      if (effectiveSort === 'dailyProfit') {
        opportunities.sort((a, b) => b.dailyExpectedProfit - a.dailyExpectedProfit);
      } else {
        // unitProfit (利益額)
        opportunities.sort((a, b) => b.unitProfit - a.unitProfit);
      }

      if (opportunities.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:4rem; color:var(--text-muted); grid-column: 1 / -1;">
            <i class="fa-solid fa-filter-circle-xmark fa-3x" style="color:var(--text-muted); margin-bottom:1rem;"></i><br>
            条件に合う金策チャンスが見つかりませんでした。<br>
            <span style="font-size:0.8rem; opacity:0.7;">（最低利益率や売買数、仕入れ範囲の条件を緩めてみてください）</span>
          </div>
        `;
        return;
      }

      container.innerHTML = opportunities.slice(0, 40).map((op, idx) => {
        const item = op.homeItem;
        let displayTitle = item.item_name || `Item #${op.itemId}`;
        let cleanTitle = escapeHtml(displayTitle).replace(/\s*\[(NQ|HQ)\]\s*$/i, "").trim();
        const primaryIcon = (item.icon_url && !item.icon_url.includes("021001_hr1")) ? item.icon_url : getComputedIconUrl(op.itemId);
        const lodestoneUrl = `https://jp.finalfantasyxiv.com/lodestone/playguide/db/item/?patch=&db_search_category=item&category2=&q=${encodeURIComponent(displayTitle)}`;

        const targetBuyGuide = Math.round(op.buyPrice * 1.05).toLocaleString();
        const targetSellGuide = op.sellPrice.toLocaleString();

        const sourceItems = allData[op.sourceWorld] || [];
        const sourceItem = sourceItems.find(x => (x.item_id || x.id) == op.itemId) || item;
        const sourceTrendObj = getOrComputeDailyTrend(sourceItem);
        const sourceTrendPct = sourceTrendObj.trendPct;
        const sourceSparkline = generateSparklineSvg(sourceItem, 44, 12);
        const sourceBadge = buildTrendBadgeHtml(sourceTrendPct, { fontSize: '0.64rem' });

        const homeItems = allData[arbHomeWorld] || [];
        const homeItem = homeItems.find(x => (x.item_id || x.id) == op.itemId) || item;
        const homeTrendObj = getOrComputeDailyTrend(homeItem);
        const homeTrendPct = homeTrendObj.trendPct;
        const homeSparkline = generateSparklineSvg(homeItem, 44, 12);
        const homeBadge = buildTrendBadgeHtml(homeTrendPct, { fontSize: '0.64rem' });

        return `
          <div class="arbitrage-card" data-item_id="${op.itemId}" onclick="handleArbCardClick(${op.itemId}, '${escapeHtml(cleanTitle).replace(/'/g, "\\'")}', '${primaryIcon}', '${op.sourceWorld}', '${arbHomeWorld}', '${escapeHtml(item.category_name || '').replace(/'/g, "\\'")}', ${op.unitProfit}, ${op.roiPercent})" title="クリックで右モニターに2窓比較を表示">
            <div class="arbitrage-card-header">
              <img class="item-icon" src="${primaryIcon}" alt="" onerror="this.src='https://v2.xivapi.com/api/asset?path=ui/icon/020000/021001_hr1.tex&format=png'">
              <div class="item-header-text">
                <div class="item-card-title">
                  <span class="rank-tag" style="color:var(--accent-gold);">#${idx + 1}</span>
                  <span style="font-weight:700;">${cleanTitle}</span>
                  <a href="${lodestoneUrl}" target="_blank" rel="noopener" class="lodestone-link-icon" title="Lodestoneで検索" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                  </a>
                </div>
              </div>
            </div>

            <div class="arb-route-grid">
              <div class="arb-route-box buy-box">
                <div class="arb-box-lbl"><i class="fa-solid fa-cart-shopping" style="color:var(--accent-green);"></i> 仕入れ先 (目標値)</div>
                <div class="arb-box-world">${op.sourceDc} - ${op.sourceWorld}</div>
                <div class="arb-box-price" style="font-size:0.82rem;"><span style="font-size:0.62rem; color:#94a3b8; font-weight:normal;">目標仕入: </span>${op.buyPrice.toLocaleString()} G</div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:4px; padding-top:4px; border-top:1px solid rgba(255,255,255,0.07);">
                  ${sourceSparkline}
                  ${sourceBadge}
                </div>
              </div>
              <div class="arb-route-arrow"><i class="fa-solid fa-arrow-right-long"></i></div>
              <div class="arb-route-box sell-box">
                <div class="arb-box-lbl"><i class="fa-solid fa-house" style="color:var(--accent-blue);"></i> 販売先 (目標値)</div>
                <div class="arb-box-world">${homeDc} - ${arbHomeWorld}</div>
                <div class="arb-box-price" style="font-size:0.82rem;"><span style="font-size:0.62rem; color:#94a3b8; font-weight:normal;">目標販売: </span>${op.sellPrice.toLocaleString()} G</div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:4px; padding-top:4px; border-top:1px solid rgba(255,255,255,0.07);">
                  ${homeSparkline}
                  ${homeBadge}
                </div>
              </div>
            </div>

            <div class="arb-profit-summary">
              <div class="arb-stat-item">
                <span class="lbl" style="color:#94a3b8; font-size:0.65rem;">1個純利益:</span>
                <strong style="color:var(--accent-green); font-size:0.78rem;">+${op.unitProfit.toLocaleString()} G</strong>
                <span style="font-size:0.65rem; color:#4ade80;">(+${op.roiPercent}%)</span>
              </div>
              <div class="arb-stat-item">
                <span class="lbl" style="color:#94a3b8; font-size:0.65rem;">ホーム売買数:</span>
                <strong style="color:var(--accent-blue); font-size:0.78rem;">${(item.sale_velocity || 0)} 個/日</strong>
              </div>
              <div class="arb-stat-item gold-highlight">
                <span class="lbl" style="color:#fef08a; font-size:0.65rem;">💰 推定日商利益:</span>
                <strong style="color:#ffb703; font-size:0.76rem; font-weight:700; white-space:nowrap;">+${op.dailyExpectedProfit.toLocaleString()} G/日</strong>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Polling setInterval removed
  loadData();
</script>
</body>
</html>
