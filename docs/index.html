<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script>
    if (typeof window !== 'undefined' && typeof navigator !== 'undefined' && window.location && typeof window.location.pathname === 'string') {
      if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth > 0 && window.innerWidth <= 768)) {
        if (!window.location.pathname.endsWith('mobile.html')) {
          window.location.replace('mobile.html');
        }
      }
    }
  </script>
  <title>FF14 Market Analytics - Japan Datacenters & World Tracker</title>
  <!-- Google Fonts & Icons & Chart.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #7928ca;
      --accent-gold: #ffb703;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
    }

    .history-table-container {
      max-height: 320px;
      overflow-y: auto;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    @media (min-width: 769px) {
      #itemDetailModal {
        display: none !important;
      }
      .pc-dashboard-container {
        display: flex !important;
        gap: 1.25rem !important;
        align-items: start !important;
        margin-top: 0.35rem;
        width: 100%;
      }
      .left-card-scroll-pane {
        width: 440px !important;
        flex: 0 0 440px !important;
        position: sticky !important;
        top: 75px !important;
        height: calc(100vh - 90px) !important;
        max-height: calc(100vh - 90px) !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 0.85rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }
      .pc-dashboard-container.view-analytics #arbitrageGridWrapper,
      .pc-dashboard-container.view-analytics #arbitrageMonitorWrapper {
        display: none !important;
      }
      .pc-dashboard-container.view-analytics #analyticsMonitorWrapper {
        display: flex !important;
      }
      .pc-dashboard-container.view-arbitrage #analyticsGridWrapper,
      .pc-dashboard-container.view-arbitrage #analyticsMonitorWrapper {
        display: none !important;
      }
      .pc-dashboard-container.view-arbitrage #arbitrageMonitorWrapper {
        display: flex !important;
      }
      .left-card-scroll-pane .grid-scroll-wrapper,
      .left-card-scroll-pane .world-grid-scroll-container,
      .left-card-scroll-pane .world-column {
        flex: 1 !important;
        height: 100% !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        width: 100% !important;
      }
      .left-pane-header {
        flex-shrink: 0 !important;
        background: rgba(15, 23, 42, 0.95) !important;
        border: 1px solid var(--card-border) !important;
        border-radius: 12px !important;
        padding: 0.6rem 0.75rem !important;
        margin-bottom: 0.65rem !important;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35) !important;
      }
      .world-item-list {
        flex: 1 !important;
        height: 100% !important;
        min-height: 0 !important;
        overflow-y: auto !important;
        padding-right: 4px;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .world-item-list::-webkit-scrollbar {
        width: 6px;
      }
      .world-item-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      .pc-right-pane {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
        min-width: 0 !important;
        position: sticky !important;
        top: 75px !important;
        height: calc(100vh - 90px) !important;
        max-height: calc(100vh - 90px) !important;
        overflow: hidden !important;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 1.1rem 1.25rem 1.1rem 1.25rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }
      .pc-right-pane .history-table-container {
        max-height: none !important;
        flex: 1 !important;
        height: 100% !important;
      }
      .pc-right-pane::-webkit-scrollbar {
        width: 6px;
      }
      .pc-right-pane::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      .slider-nav-btn, .grid-slide-btn {
        display: none !important;
      }
      .pc-world-select {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--accent-blue);
        border-radius: 8px;
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 3px 6px;
        outline: none;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        transition: all 0.2s ease;
      }
      .pc-world-select:hover {
        border-color: #38bdf8;
        box-shadow: 0 0 14px rgba(0, 210, 255, 0.4);
      }
      .pc-world-select optgroup {
        background: #0f172a;
        color: var(--accent-gold);
        font-weight: 700;
      }
      .pc-world-select option {
        background: #0f172a;
        color: #ffffff;
        font-weight: 600;
      }
      .dc-summary-card.clickable-card {
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .dc-summary-card.clickable-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 210, 255, 0.25);
        border-color: var(--accent-blue) !important;
      }
      .item-card.active-card {
        border-color: var(--accent-blue) !important;
        background: linear-gradient(135deg, rgba(0, 210, 255, 0.12) 0%, rgba(15, 23, 42, 0.95) 100%) !important;
        box-shadow: 0 0 16px rgba(0, 210, 255, 0.45) !important;
      }
    }

    .container {
      max-width: 1850px;
      margin: 0 auto;
      height: 100vh;
      padding: 0.5rem 0.8rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 0.8rem;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* View Mode Switcher Buttons */
    .view-mode-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .view-mode-tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .view-mode-tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(255, 183, 3, 0.2));
      border-color: rgba(255, 183, 3, 0.4);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.2);
    }

    /* Arbitrage Grid & Card Styles */
    .arbitrage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .arbitrage-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .arbitrage-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 183, 3, 0.5);
      box-shadow: 0 8px 24px rgba(255, 183, 3, 0.15);
    }

    .arbitrage-card-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }



    .arb-route-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
    }

    .arb-route-box {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      flex: 1;
      overflow: hidden;
    }

    .arb-route-box.buy-box {
      border-left: 3px solid var(--accent-green);
      padding-left: 0.5rem;
    }

    .arb-route-box.sell-box {
      border-left: 3px solid var(--accent-blue);
      padding-left: 0.5rem;
    }

    .arb-box-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .arb-box-world {
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arb-box-price {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
    }

    .arb-route-arrow {
      color: var(--accent-gold);
      font-size: 1.1rem;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .arb-profit-summary {
      display: grid;
      grid-template-columns: 1fr 0.9fr 1.25fr;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 183, 3, 0.06);
      border: 1px solid rgba(255, 183, 3, 0.2);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font-size: 0.72rem;
    }

    .arb-stat-item {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      overflow: hidden;
    }

    .arb-stat-item.gold-highlight {
      background: rgba(255, 183, 3, 0.12);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 183, 3, 0.3);
    }




    /* Single-Row Unified Controls Bar: World Nav Tabs + Search Box + Sort Controls */






    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.38rem 0.8rem 0.38rem 2.4rem;
      color: var(--text-main);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
      margin: 0;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }



    .sort-toggle-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 2px;
      box-sizing: border-box;
      margin: 0;
    }

    .sort-toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0 0.7rem;
      height: 26px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sort-toggle-btn:hover {
      color: #ffffff;
    }

    .sort-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.25);
    }

    /* View Toggle Group (Arbitrage Monitor Sub-tabs) */
    .view-toggle-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2px;
      box-sizing: border-box;
    }

    .view-toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .view-toggle-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .view-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.25);
    }

    .filter-toggle-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .filter-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .filter-toggle-btn.active {
      background: linear-gradient(135deg, rgba(121, 40, 202, 0.3), rgba(0, 210, 255, 0.25));
      border-color: rgba(0, 210, 255, 0.5);
      color: #00d2ff;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.2);
    }

    /* World Grid (4 Columns Visible, Lightweight Carousel) */
    .world-grid {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      height: 100%;
      min-height: 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
      scroll-behavior: smooth;
      align-items: stretch;
    }

    .world-grid::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .world-column {
      flex: 0 0 calc((100% - 3rem) / 4);
      min-width: calc((100% - 3rem) / 4);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
    }



    /* Grid Slide Container & Navigation Buttons */
    .grid-scroll-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }





    .world-item-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0.75rem 0.75rem 1.2rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .world-item-list::-webkit-scrollbar {
      width: 5px;
    }

    .world-item-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* Enhanced Original Item Card Style */
    .item-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.7rem 0.75rem;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      cursor: pointer;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 210, 255, 0.35);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .item-card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
    }

    .item-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .item-header-text {
      flex: 1;
      min-width: 0;
    }

    .item-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .lodestone-link-icon {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: color 0.2s ease;
    }

    .lodestone-link-icon:hover {
      color: var(--accent-blue);
    }

    .rank-tag {
      color: var(--accent-gold);
      font-weight: 700;
      margin-right: 0.35rem;
    }



    /* DC内ハイライト比較カード (4カラム: 最安値・最安平均・最高平均・最高値) */
    .dc-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }



    .dc-summary-card {
      background: rgba(11, 17, 30, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dc-summary-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      filter: brightness(1.15);
    }

    .modal-card.arb-modal-wide {
      max-width: 1320px;
    }

    .arb-modal-dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }



    .arb-world-column-card {
      background: rgba(11, 17, 30, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .arb-world-column-card.buy-side {
      border-top: 4px solid var(--accent-green);
    }

    .arb-world-column-card.sell-side {
      border-top: 4px solid var(--accent-blue);
    }

    .copy-icon-btn {
      background: rgba(255, 183, 3, 0.12);
      border: 1px solid rgba(255, 183, 3, 0.35);
      color: #ffb703;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .copy-icon-btn:hover {
      background: #ffb703;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
      transform: scale(1.05);
    }

    .copy-icon-btn.copied {
      background: rgba(74, 222, 128, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .dc-summary-card.min-card {
      border-left: 4px solid var(--accent-green);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.min-avg-card {
      border-left: 4px solid #c084fc;
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.max-avg-card {
      border-left: 4px solid #f472b6;
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.max-card {
      border-left: 4px solid #ef4444;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .dc-summary-world {
      font-weight: 700;
      font-size: 0.92rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dc-summary-price {
      font-family: 'Outfit', sans-serif;

  <script>
    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 8000 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => clearTimeout(id), timeout);
      try {
        const response = await fetch(resource, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (error) {
        clearTimeout(id);
        throw error;
      }
    }

    let allData = {};
    let activeDc = "Mana";
    let activeSortMode = "velocity";
    let excludeCrystals = true; // デフォルトでクリスタル類を除外
    let dcWorldsMap = {
      "Elemental": ["Carbuncle", "Gungnir", "Kujata", "Typhon", "Atomos", "Tonberry", "Aegis", "Garuda"],
      "Gaia": ["Alexander", "Bahamut", "Durandal", "Fenrir", "Ifrit", "Ridill", "Tiamat", "Ultima"],
      "Mana": ["Anima", "Asura", "Chocobo", "Hades", "Ixion", "Masamune", "Pandaemonium", "Titan"],
      "Meteor": ["Belias", "Mandragora", "Ramuh", "Shinryu", "Unicorn", "Valefor", "Yojimbo", "Zeromus"]
    };

    // アイコンURLの動的計算アルゴリズム (アイテムIDからXIVAPI v2高画質PNGアイコンURLを100%自動算出)
    function getComputedIconUrl(itemId) {
      if (!itemId) return 'https://v2.xivapi.com/api/asset?path=ui/icon/020000/021001_hr1.tex&format=png';
      const id = Number(itemId);
      const folderNum = Math.floor(id / 1000) * 1000;
      const folderStr = String(folderNum).padStart(6, '0');
      const iconStr = String(id).padStart(6, '0');
      return `https://v2.xivapi.com/api/asset?path=ui/icon/${folderStr}/${iconStr}_hr1.tex&format=png`;
    }

    // クリスタル・シャード・クラスター・触媒の判定関数 (ID: 2~19 判定含む)
    function isCrystalItem(item) {
      if (!item) return false;
      const id = typeof item === 'number' ? item : Number(item.item_id || 0);
      // FF14公式データ: シャード(2~7), クリスタル(8~13), クラスター(14~19)
      if (id >= 2 && id <= 19) return true;
      
      if (typeof item === 'object') {
        const cat = (item.meta && item.meta.category) ? item.meta.category : '';
        if (cat === "クリスタル" || cat === "触媒") return true;
        
        const name = item.item_name || item.name || '';
        if (name.includes("シャード") || name.includes("クリスタル") || name.includes("クラスター")) return true;
      }
      
      return false;
    }

    function toggleCrystalFilter() {
      excludeCrystals = !excludeCrystals;
      const btns = document.querySelectorAll('#crystalFilterBtn, #pcCrystalFilterBtn, .crystal-filter-btn');
      btns.forEach(btn => {
        btn.classList.toggle('active', excludeCrystals);
        btn.innerHTML = `<i class="fa-solid fa-gem"></i> ${excludeCrystals ? 'ON' : 'OFF'}`;
      });
      renderWorldGrid();
    }



    function setGlobalSort(mode) {
      activeSortMode = mode;
      document.querySelectorAll('.sort-toggle-group .sort-toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sort === mode);
      });

      resetPcMonitorToNoData();
      renderWorldGrid();

      const itemList = document.querySelector('.world-item-list');
      if (itemList) itemList.scrollTop = 0;
    }



    function formatTimeLocal(rawTimeStr) {
      if (!rawTimeStr) return '-';
      let str = String(rawTimeStr).trim();
      if (!str.endsWith('Z') && !str.includes('+')) {
        str = str.replace(' ', 'T') + 'Z';
      }
      const d = new Date(str);
      if (isNaN(d.getTime())) return rawTimeStr;
      
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function getAggregationPeriodStr(rawTimeStr) {
      if (!rawTimeStr) {
        const dEnd = new Date();
        const dStart = new Date(dEnd.getTime() - (7 * 86400 * 1000));
        return `${dStart.getMonth() + 1}/${dStart.getDate()}～${dEnd.getMonth() + 1}/${dEnd.getDate()}`;
      }
      let str = String(rawTimeStr).trim();
      if (!str.endsWith('Z') && !str.includes('+')) {
        str = str.replace(' ', 'T') + 'Z';
      }
      const dEnd = new Date(str);
      if (isNaN(dEnd.getTime())) {
        const dNow = new Date();
        const dStart = new Date(dNow.getTime() - (7 * 86400 * 1000));
        return `${dStart.getMonth() + 1}/${dStart.getDate()}～${dNow.getMonth() + 1}/${dNow.getDate()}`;
      }
      const dStart = new Date(dEnd.getTime() - (7 * 86400 * 1000));
      const startStr = `${dStart.getMonth() + 1}/${dStart.getDate()}`;
      const endStr = `${dEnd.getMonth() + 1}/${dEnd.getDate()}`;
      return `${startStr}～${endStr}`;
    }

    let currentPeriodText = '';
    let pcAnalyticsSearchTerm = '';
    let pcArbitrageSearchTerm = '';
    let analyticsSearchTimer = null;
    let arbitrageSearchTimer = null;
    let isComposing = false;

    function preserveAndRestoreFocus(fn) {
      const activeEl = document.activeElement;
      const activeId = activeEl ? activeEl.id : null;
      const startPos = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
      const endPos = activeEl && typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null;

      fn();

      if (activeId && ['pcAnalyticsSearchInput', 'pcArbitrageSearchInput', 'searchInput', 'arbSearchInput'].includes(activeId)) {
        requestAnimationFrame(() => {
          const restoredInput = document.getElementById(activeId);
          if (restoredInput) {
            restoredInput.focus();
            if (startPos !== null && endPos !== null) {
              try {
                restoredInput.setSelectionRange(startPos, endPos);
              } catch (e) {}
            }
          }
        });
      }
    }

    function setupSearchImeListeners() {
      ['pcAnalyticsSearchInput', 'pcArbitrageSearchInput', 'searchInput', 'arbSearchInput'].forEach(id => {
        const input = document.getElementById(id);
        if (!input || input.dataset.imeBound) return;
        input.dataset.imeBound = "true";

        input.addEventListener('compositionstart', () => {
          isComposing = true;
        });

        input.addEventListener('compositionend', (e) => {
          isComposing = false;
          if (id === 'pcAnalyticsSearchInput' || id === 'searchInput') {
            onSearchInput(e.target.value);
          } else {
            onArbSearchInput(e.target.value);
          }
        });
      });
    }

    function onSearchInput(val) {
      pcAnalyticsSearchTerm = val.toLowerCase().trim();
      if (isComposing) return;
      clearTimeout(analyticsSearchTimer);
      analyticsSearchTimer = setTimeout(() => {
        preserveAndRestoreFocus(() => {
          renderWorldGrid();
        });
        setupSearchImeListeners();
      }, 180);
    }

    function clearPcAnalyticsSearch() {
      pcAnalyticsSearchTerm = '';
      const input = document.getElementById('pcAnalyticsSearchInput') || document.getElementById('searchInput');
      if (input) input.value = '';
      renderWorldGrid();
    }

    function onArbSearchInput(val) {
      pcArbitrageSearchTerm = val.toLowerCase().trim();
      if (isComposing) return;
      clearTimeout(arbitrageSearchTimer);
      arbitrageSearchTimer = setTimeout(() => {
        preserveAndRestoreFocus(() => {
          renderArbitrageGrid();
        });
        setupSearchImeListeners();
      }, 180);
    }

    function clearPcArbitrageSearch() {
      pcArbitrageSearchTerm = '';
      const input = document.getElementById('pcArbitrageSearchInput') || document.getElementById('arbSearchInput');
      if (input) input.value = '';
      renderArbitrageGrid();
    }



    const USER_WORLD_KEY = 'ff14_user_home_world';

    function getSavedUserHomeWorld() {
      try {
        return localStorage.getItem(USER_WORLD_KEY) || null;
      } catch (e) {
        return null;
      }
    }

    function saveUserHomeWorld(worldName) {
      if (!worldName) return;
      try {
        localStorage.setItem(USER_WORLD_KEY, worldName);
        localStorage.setItem('ff14_selected_world', worldName);
      } catch (e) {}
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    let lastLoadedTime = null;

    async function loadData() {
      console.time('[FastLoad] Total Load Time');
      const lastUpdatedEl = document.getElementById('lastUpdatedBadge');
      if (lastUpdatedEl) {
        lastUpdatedEl.innerHTML = `<span class="status-dot" style="background:#eab308;"></span> データを読み込み中...`;
      }

      try {
        let data = null;

        // 1. Try relative same-origin data.json.gz (Fastest for local & production)
        try {
          console.time('[FastLoad] Fetch data.json.gz');
          const res = await fetchWithTimeout('data.json.gz', { timeout: 15000 });
          console.timeEnd('[FastLoad] Fetch data.json.gz');

          if (res && res.ok) {
            console.time('[FastLoad] ArrayBuffer Read');
            const arrayBuffer = await res.arrayBuffer();
            console.timeEnd('[FastLoad] ArrayBuffer Read');

            if (window.pako) {
              console.time('[FastLoad] Pako Ungzip');
              const decompressed = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
              console.timeEnd('[FastLoad] Pako Ungzip');

              console.time('[FastLoad] JSON Parse');
              data = JSON.parse(decompressed);
              console.timeEnd('[FastLoad] JSON Parse');
            } else if (window.DecompressionStream) {
              console.time('[FastLoad] DecompressionStream');
              const ds = new DecompressionStream('gzip');
              const blob = new Blob([arrayBuffer]);
              const text = await new Response(blob.stream().pipeThrough(ds)).text();
              console.timeEnd('[FastLoad] DecompressionStream');

              console.time('[FastLoad] JSON Parse');
              data = JSON.parse(text);
              console.timeEnd('[FastLoad] JSON Parse');
            }
          }
        } catch (gzErr) {
          console.warn("[FastLoad] data.json.gz fetch failed, trying fallbacks:", gzErr);
        }

        // 2. Fallback to uncompressed data.json if gzip failed
        if (!data) {
          try {
            console.time('[FastLoad] Fetch data.json (Uncompressed Fallback)');
            const res = await fetchWithTimeout('data.json', { timeout: 15000 });
            console.timeEnd('[FastLoad] Fetch data.json (Uncompressed Fallback)');
            if (res && res.ok) {
              data = await res.json();
            }
          } catch (jsonErr) {
            console.warn("[FastLoad] data.json fetch failed:", jsonErr);
          }
        }

        // 3. Fallback to live production URL if local fetches failed
        if (!data) {
          try {
            console.time('[FastLoad] Fetch Production Live URL Fallback');
            const prodUrl = 'https://t-ichinose.github.io/ff14-market-tracker/data.json.gz';
            const res = await fetchWithTimeout(prodUrl, { timeout: 20000 });
            if (res && res.ok) {
              const arrayBuffer = await res.arrayBuffer();
              if (window.pako) {
                const decompressed = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
                data = JSON.parse(decompressed);
              }
            }
            console.timeEnd('[FastLoad] Fetch Production Live URL Fallback');
          } catch (prodErr) {
            console.error("[FastLoad] Live production fallback failed:", prodErr);
          }
        }

        if (!data) {
          throw new Error('データファイルの取得・解凍に失敗しました。');
        }

        if (data.last_updated) {
          currentPeriodText = getAggregationPeriodStr(data.last_updated);
        }

        if (lastUpdatedEl) {
          const formattedLastUpdated = formatTimeLocal(data.last_updated);
          const periodBadgeHtml = currentPeriodText ? `<span style="color:var(--accent-blue); font-weight:600;"><i class="fa-regular fa-calendar-days"></i> 集計期間: ${currentPeriodText}</span> <span style="opacity:0.35; margin:0 6px;">|</span> ` : '';
          lastUpdatedEl.innerHTML = `<span class="status-dot"></span> ${periodBadgeHtml}最終更新: ${formattedLastUpdated}`;
        }

        if (lastLoadedTime && lastLoadedTime === data.last_updated) {
          console.timeEnd('[FastLoad] Total Load Time');
          return;
        }
        lastLoadedTime = data.last_updated;

        allData = data.data || data.worlds || {};
        if (data.dc_worlds) {
          dcWorldsMap = data.dc_worlds;
        }

        const savedHomeWorld = getSavedUserHomeWorld();
        if (savedHomeWorld) {
          currentModalWorld = savedHomeWorld;
          const foundDc = findDcForWorld(savedHomeWorld);
          if (foundDc) activeDc = foundDc;
        }

        const loader = document.getElementById('loadingOverlay');
        if (loader) loader.style.display = 'none';

        console.time('[FastLoad] DOM Render');
        renderWorldGrid();
        setupSearchImeListeners();
        console.timeEnd('[FastLoad] DOM Render');

        console.timeEnd('[FastLoad] Total Load Time');

      } catch (err) {
        console.error("loadData error:", err);
        if (lastUpdatedEl) {
          lastUpdatedEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:var(--accent-red);"></i> ロード失敗 (${err.message})`;
        }
        const grid = document.getElementById('worldGrid');
        if (grid) {
          grid.innerHTML = `
            <div style="text-align:center; padding:3rem; width:100%; color:#ef4444; grid-column: 1 / -1;">
              <i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>データ取得エラー (${err.message})
            </div>
          `;
        }
      }
    }

    function findDcForWorld(worldName) {
      if (!worldName) return null;
      for (const [dc, worlds] of Object.entries(dcWorldsMap || {})) {
        if (worlds.includes(worldName)) return dc;
      }
      return null;
    }

    function getOrComputeDailyTrend(item) {
      if (item && item.daily_trend && item.daily_trend.length > 0) {
        return { trend: item.daily_trend, trendPct: item.trend_pct || 0 };
      }

      const history = (item && item.history) ? item.history : [];
      if (!history || history.length === 0) {
        return { trend: [], trendPct: 0 };
      }

      const today = new Date();
      const daysLabels = [];
      const dayMap = new Map();

      for (let i = 7; i >= 0; i--) {
        const d = new Date(today.getTime() - i * 86400 * 1000);
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const lbl = `${month}/${day}`;
        daysLabels.push(lbl);
        dayMap.set(lbl, { totalRev: 0, totalQty: 0 });
      }

      for (const h of history) {
        if (!h.ts) continue;
        const d = new Date(h.ts * 1000);
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const lbl = `${month}/${day}`;

        if (dayMap.has(lbl)) {
          const entry = dayMap.get(lbl);
          const price = h.price || 0;
          const qty = h.qty || 1;
          entry.totalRev += price * qty;
          entry.totalQty += qty;
        }
      }

      const trend = [];
      const validAvgs = [];

      for (const lbl of daysLabels) {
        const entry = dayMap.get(lbl);
        const wavg = entry.totalQty > 0 ? Math.round(entry.totalRev / entry.totalQty) : 0;
        trend.push({ date: lbl, weighted_avg: wavg, volume: entry.totalQty });
        if (wavg > 0) validAvgs.push(wavg);
      }

      let trendPct = 0;
      if (validAvgs.length >= 2 && validAvgs[0] > 0) {
        trendPct = Math.round(((validAvgs[validAvgs.length - 1] - validAvgs[0]) / validAvgs[0]) * 1000) / 10;
      }

      return { trend, trendPct };
    }

    function buildTrendBadgeHtml(trendPct, options = {}) {
      const fontSize = options.fontSize || '0.65rem';

      } else if (trendPct < 0) {
        return `<span style="color:#f87171; font-weight:700; font-size:${fontSize};" ${titleAttr}><i class="fa-solid fa-arrow-trend-down"></i> ${trendPct}%${suffix}</span>`;
      }
      return `<span style="color:#94a3b8; font-size:${fontSize};" ${titleAttr}>➡️ 0%${suffix}</span>`;
    }

    function generateSparklineSvg(item, width = 64, height = 18) {
      const { trend, trendPct } = getOrComputeDailyTrend(item);
      if (!trend || trend.length < 2) return '';
      const validPoints = trend.map(d => d.weighted_avg || 0);
      const nonZero = validPoints.filter(p => p > 0);
      if (nonZero.length < 2) return '';

      const minP = Math.min(...nonZero);
      const maxP = Math.max(...nonZero);
      const range = (maxP - minP) || 1;

      const coords = validPoints.map((p, idx) => {
        const x = (idx / (validPoints.length - 1)) * (width - 6) + 3;
        const val = p > 0 ? p : minP;
        const y = height - 3 - (((val - minP) / range) * (height - 6));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });

      const isUp = (trendPct >= 0);
      const color = isUp ? '#4ade80' : '#f87171';

      return `
        <svg width="${width}" height="${height}" style="vertical-align:middle; overflow:visible;">
          <polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="${coords.join(' ')}" />
        </svg>
      `;
    }

    function drawTrendChart(canvasId, summaryId, trend, trendPct, options = {}) {
      const canvas = document.getElementById(canvasId);
      const summaryEl = document.getElementById(summaryId);
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const defaultW = options.defaultWidth || 580;
      const h = canvas.height = options.height || 120;
      const w = canvas.width = canvas.parentElement ? (canvas.parentElement.offsetWidth || defaultW) : defaultW;

      ctx.clearRect(0, 0, w, h);

      if (!trend || trend.length === 0) {
        if (summaryEl) summaryEl.innerHTML = "";
        return;
      }

      if (summaryEl) {
        const minW = options.summaryMinW || '45px';
        const fontSizeDate = options.summaryDateFontSize || '0.65rem';
        const fontSizeVal = options.summaryValFontSize || '0.65rem';
        const fontSizeVol = options.summaryVolFontSize || '0.6rem';

        summaryEl.innerHTML = trend.map(d => `
          <div style="flex:1; text-align:center; min-width:${minW};">
            <div style="font-weight:700; color:#94a3b8; font-size:${fontSizeDate};">${d.date}</div>
            <div style="color:var(--accent-green); font-weight:700; font-size:${fontSizeVal};">${d.weighted_avg > 0 ? d.weighted_avg.toLocaleString() + 'G' : '-'}</div>
            <div style="color:var(--accent-blue); font-size:${fontSizeVol};">${d.volume > 0 ? d.volume + '個' : '0個'}</div>
          </div>
        `).join('');
      }

      const validPrices = trend.map(d => d.weighted_avg || 0).filter(p => p > 0);
      const validVolumes = trend.map(d => d.volume || 0);
      const maxVol = Math.max(...validVolumes, 1);

      if (validPrices.length === 0) return;

      const minP = Math.min(...validPrices);
      const maxP = Math.max(...validPrices);
      const pRange = (maxP - minP) || (maxP * 0.1) || 1;

      const numPoints = trend.length;
      const colWidthHalf = w / (2 * Math.max(1, numPoints));
      const paddingLeft = options.paddingLeft || colWidthHalf;
      const paddingRight = options.paddingRight || colWidthHalf;
      const paddingTop = options.paddingTop || 12;
      const paddingBottom = options.paddingBottom || 18;
      const plotW = w - paddingLeft - paddingRight;
      const plotH = h - paddingTop - paddingBottom;
      const stepX = plotW / Math.max(1, numPoints - 1);

      if (options.drawGrid) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(paddingLeft, paddingTop);
        ctx.lineTo(w - paddingRight, paddingTop);
        ctx.moveTo(paddingLeft, paddingTop + plotH / 2);
        ctx.lineTo(w - paddingRight, paddingTop + plotH / 2);
        ctx.moveTo(paddingLeft, h - paddingBottom);
        ctx.lineTo(w - paddingRight, h - paddingBottom);
        ctx.stroke();
      }

      trend.forEach((d, idx) => {
        const x = paddingLeft + idx * stepX;
        const barW = Math.min(options.maxBarW || 16, stepX * 0.4);
        const barH = (d.volume / maxVol) * (plotH * (options.barHFactor || 0.55));
        const y = h - paddingBottom - barH;

        ctx.fillStyle = "rgba(96, 165, 250, 0.25)";
        ctx.fillRect(x - barW / 2, y, barW, barH);
      });

      const points = [];
      trend.forEach((d, idx) => {
        const x = paddingLeft + idx * stepX;
        const val = d.weighted_avg > 0 ? d.weighted_avg : minP;
        const y = h - paddingBottom - (((val - minP) / pRange) * plotH);
        points.push({ x, y, val: d.weighted_avg, date: d.date });
      });

      const lineColor = trendPct >= 0 ? "#4ade80" : "#f87171";

      const grad = ctx.createLinearGradient(0, paddingTop, 0, h - paddingBottom);
      grad.addColorStop(0, trendPct >= 0 ? "rgba(74, 222, 128, 0.25)" : "rgba(248, 113, 113, 0.25)");
      grad.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.lineTo(points[points.length - 1].x, h - paddingBottom);
      ctx.lineTo(points[0].x, h - paddingBottom);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = options.lineWidth || 2;
      ctx.stroke();

      const dotRadius = options.dotRadius || 3;
      const dateYOffset = options.dateYOffset || 6;
      const dateFontSize = options.dateFontSize || "9px";

      points.forEach((pt) => {
        ctx.fillStyle = lineColor;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, dotRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#94a3b8";
        ctx.font = `${dateFontSize} sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(pt.date, pt.x, h - dateYOffset);
      });

      if (summaryEl) {
        const fontSizeDate = options.summaryDateFontSize || '0.65rem';
        const fontSizeVal = options.summaryValFontSize || '0.65rem';
        const fontSizeVol = options.summaryVolFontSize || '0.6rem';

        summaryEl.style.position = 'static';
        summaryEl.style.display = 'flex';
        summaryEl.style.justifyContent = 'space-between';
        summaryEl.style.alignItems = 'center';
        summaryEl.style.width = '100%';
        summaryEl.style.boxSizing = 'border-box';
        summaryEl.style.paddingLeft = '0px';
        summaryEl.style.paddingRight = '0px';
        summaryEl.style.marginTop = '4px';

        summaryEl.innerHTML = trend.map((d) => {
          const formattedVal = d.weighted_avg > 0 ? (d.weighted_avg >= 10000 ? Math.round(d.weighted_avg / 1000) + 'k' : d.weighted_avg.toLocaleString()) + 'G' : '-';
          return `
            <div style="flex:1; min-width:0; text-align:center; white-space:nowrap; overflow:hidden;">
              <span style="font-weight:700; color:#94a3b8; font-size:${fontSizeDate}; display:block;">${d.date}</span>
              <span style="color:var(--accent-green); font-weight:700; font-size:${fontSizeVal}; display:block; margin:1px 0;">${formattedVal}</span>
              <span style="color:var(--accent-blue); font-size:${fontSizeVol}; display:block;">${d.volume > 0 ? d.volume + '個' : '0個'}</span>
            </div>
          `;
        }).join('');
      }
    }

    async function fetchAndRender3MinSummaryCards(worldName, itemId, forceRefresh = false) {
      if (!worldName || !itemId) return;

      const dcName = getDcNameForWorld(worldName);
      const sameDcWorlds = dcWorldsMap[dcName] || [worldName];
      const hqParam = pcListingsHqOnly ? '&hq=true' : '';
      const summaryCacheKey = `3min_${itemId}_${worldName}_${pcListingsHqOnly ? 'hq' : 'all'}`;

      const selWNameEl = document.getElementById('pcListingsSelWorldName');
      const selPEl = document.getElementById('pcListingsSelWorldMinPrice');
      const dcWNameEl = document.getElementById('pcListingsDcMinName');
      const dcPEl = document.getElementById('pcListingsDcMinPrice');
      const allWNameEl = document.getElementById('pcListingsAllWorldMinName');
      const allPEl = document.getElementById('pcListingsAllWorldMinPrice');

      const applyCardValues = (selP, dcP, dcW, globalP, globalW) => {
        if (selWNameEl) selWNameEl.innerText = worldName;
        if (selPEl) selPEl.innerText = selP > 0 ? `${selP.toLocaleString()}G` : '-G';

        if (dcWNameEl) dcWNameEl.innerText = dcW !== '-' ? `${dcW} (${dcName})` : `${dcName} DC`;
        if (dcPEl) dcPEl.innerText = dcP > 0 ? `${dcP.toLocaleString()}G` : '-G';

        if (allWNameEl) allWNameEl.innerText = globalW !== '-' ? `${globalW} (${getDcNameForWorld(globalW)})` : '全32ワールド';
        if (allPEl) allPEl.innerText = globalP > 0 ? `${globalP.toLocaleString()}G` : '-G';
      };

      // キャッシュが存在すればAPIを叩かず即座に適用
      if (!forceRefresh && activeListingsCache[summaryCacheKey]) {
        const c = activeListingsCache[summaryCacheKey];
        applyCardValues(c.selMinPrice, c.dcMinPrice, c.dcMinWorld, c.globalMinPrice, c.globalMinWorld);
        return;
      }

      try {
        const urlAll = `https://universalis.app/api/v2/Japan/${itemId}?listings=100${hqParam}`;
        const resAll = await fetch(urlAll);
        if (!resAll.ok) return;
        const dataAll = await resAll.json();
        const listingsAll = dataAll.listings || [];

        // 1. 全DC最安
        const globalMinListing = listingsAll[0];
        let globalMinPrice = globalMinListing ? (globalMinListing.pricePerUnit || 0) : 0;
        let globalMinWorld = globalMinListing ? (globalMinListing.worldName || '-') : '-';

        // 2. 同DC最安
        const dcMinListing = listingsAll.find(l => sameDcWorlds.includes(l.worldName));
        let dcMinPrice = dcMinListing ? (dcMinListing.pricePerUnit || 0) : 0;
        let dcMinWorld = dcMinListing ? dcMinListing.worldName : '-';

        // 3. 選択サーバー最安
        const selMinListing = listingsAll.find(l => l.worldName === worldName);
        let selMinPrice = selMinListing ? (selMinListing.pricePerUnit || 0) : 0;

        // もし Japan TOP100 に選択ワールドが含まれていなければ個別取得
        if (!selMinListing) {
          const urlWorld = `https://universalis.app/api/v2/${encodeURIComponent(worldName)}/${itemId}?listings=10${hqParam}`;
          const resW = await fetch(urlWorld);
          if (resW.ok) {
            const dataW = await resW.json();
            const listingsW = dataW.listings || [];
            if (listingsW.length > 0) {
              selMinPrice = listingsW[0].pricePerUnit || 0;
            }
          }
        }

        // もし Japan TOP100 に同DCが含まれていなければ個別取得
        if (!dcMinListing) {
          const urlDc = `https://universalis.app/api/v2/${encodeURIComponent(dcName)}/${itemId}?listings=10${hqParam}`;
          const resDc = await fetch(urlDc);
          if (resDc.ok) {
            const dataDc = await resDc.json();
            const listingsDc = dataDc.listings || [];
            if (listingsDc.length > 0) {
              dcMinPrice = listingsDc[0].pricePerUnit || 0;
              dcMinWorld = listingsDc[0].worldName || dcName;
            }
          }
        }

        // キャッシュに保存
        activeListingsCache[summaryCacheKey] = {
          selMinPrice, dcMinPrice, dcMinWorld, globalMinPrice, globalMinWorld
        };

        applyCardValues(selMinPrice, dcMinPrice, dcMinWorld, globalMinPrice, globalMinWorld);

      } catch (err) {
        console.error("fetchAndRender3MinSummaryCards error:", err);
      }
    }

    async function fetchAndRenderActiveListings(worldName, itemId, scope, forceRefresh = false) {
      if (worldName) pcMonitorWorldName = worldName;
      if (itemId) pcMonitorItemId = itemId;
      if (scope) currentListingsScope = scope;

      const targetWorld = pcMonitorWorldName;
      const targetItem = pcMonitorItemId;
      const currentScope = currentListingsScope;

      const tbody = document.getElementById('pcActiveListingsTbody');
      const thead = document.getElementById('pcActiveListingsThead');
      const countBadge = document.getElementById('pcListingsCountBadge');
      const scopeTitle = document.getElementById('pcListingsScopeTitle');
      if (!tbody || !targetWorld || !targetItem) return;

      // ボタンのアクティブスタイル切替
      ['world', 'dc', 'all'].forEach(s => {
        const btn = document.getElementById('btnScope_' + s);
        if (btn) {
          if (s === currentScope) {
            btn.style.background = 'var(--accent-blue)';
            btn.style.color = '#ffffff';
          } else {
            btn.style.background = 'transparent';
            btn.style.color = '#94a3b8';
          }
        }
      });

      const dcName = getDcNameForWorld(targetWorld);
      let apiUrl = '';
      let titleText = '';

      if (currentScope === 'world') {
        apiUrl = `https://universalis.app/api/v2/${encodeURIComponent(targetWorld)}/${targetItem}?listings=100`;
        titleText = `(${targetWorld})`;
      } else if (currentScope === 'dc') {
        apiUrl = `https://universalis.app/api/v2/${encodeURIComponent(dcName)}/${targetItem}?listings=100`;
        titleText = `(${dcName} DC)`;
      } else {
        apiUrl = `https://universalis.app/api/v2/Japan/${targetItem}?listings=100`;
        titleText = `(全DC / 日本)`;
      }

      if (pcListingsHqOnly) {
        apiUrl += '&hq=true';
      }

      if (scopeTitle) scopeTitle.innerText = titleText;

      const colCount = 6;

      if (thead) {
        thead.innerHTML = `
          <tr>
            <th>ワールド</th>
            <th>リテイナー</th>
            <th>品質</th>
            <th>単価 (G)</th>
            <th>数量</th>
            <th>合計金額 (G)</th>
          </tr>
        `;
      }

      const cacheKey = `${targetItem}_${targetWorld}_${currentScope}_${pcListingsHqOnly ? 'hq' : 'all'}`;

      const renderListingsTable = (listings, unitsForSale) => {
        if (countBadge) {
          countBadge.innerText = `${listings.length}件 (${(unitsForSale || 0).toLocaleString()}個)`;
        }

        if (listings.length === 0) {
          tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; padding:2rem; color:var(--text-muted);">${pcListingsHqOnly ? 'HQ品の' : ''}現在出品中の商品はありません</td></tr>`;
          return;
        }

        tbody.innerHTML = listings.slice(0, 100).map(l => {
          const price = (l.pricePerUnit || 0).toLocaleString();
          const qty = (l.quantity || 0).toLocaleString();
          const total = ((l.pricePerUnit || 0) * (l.quantity || 0)).toLocaleString();
          const hqBadge = l.hq ? `<span class="hq-badge">HQ</span>` : `<span style="color:var(--text-muted); font-size:0.75rem;">NQ</span>`;
          const retainer = l.retainerName ? escapeHtml(l.retainerName) : '-';
          const itemWorld = l.worldName || targetWorld;

          return `
            <tr>
              <td style="font-size:0.72rem; font-weight:700; color:var(--accent-gold); white-space:nowrap;">${itemWorld}</td>
              <td style="font-size:0.75rem; font-weight:600; color:var(--accent-blue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:90px;" title="${retainer}">${retainer}</td>
              <td>${hqBadge}</td>
              <td style="font-weight:700; color:var(--accent-green);">${price}G</td>
              <td style="font-weight:600;">${qty}個</td>
              <td style="font-weight:700; color:#ffb703;">${total}G</td>
            </tr>
          `;
        }).join('');
      };

      // 強制リフレッシュでない & メモリキャッシュが存在すれば0ms即時描画
      if (!forceRefresh && activeListingsCache[cacheKey]) {
        const cached = activeListingsCache[cacheKey];
        renderListingsTable(cached.listings, cached.unitsForSale);
        return;
      }

      tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 出品データを取得中...</td></tr>`;

      try {
        const res = await fetchWithTimeout(apiUrl);
        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        let listings = data.listings || [];

        if (pcListingsHqOnly) {
          listings = listings.filter(l => Boolean(l.hq));
        }

        activeListingsCache[cacheKey] = {
          listings: listings,
          unitsForSale: data.unitsForSale || 0
        };

        renderListingsTable(listings, data.unitsForSale || 0);

      } catch (err) {
        console.error("fetchAndRenderActiveListings error:", err);
        if (tbody) {
          tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; padding:1.5rem; color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> 出品データ取得失敗</td></tr>`;
        }
      }
    }

    let lastCachedItemId = null;

    async function prefetchAndRenderAllActiveScopes(worldName, itemId, forceRefresh = false) {
      if (!worldName || !itemId) return;

      // 品目が切り替わった場合（または手動更新時）は以前のアイテムのキャッシュを完全破棄（メモリ圧迫防止）
      if (lastCachedItemId !== itemId || forceRefresh) {
        for (const k in activeListingsCache) delete activeListingsCache[k];
        lastCachedItemId = itemId;
      }

      // 1. 計算・再計算中の視覚的表示 (-G 表記)
      set3MinCardsLoadingState();

      // 2. 3指標カード ＆ 現在アクティブなタブを優先描画
      fetchAndRender3MinSummaryCards(worldName, itemId, forceRefresh);
      fetchAndRenderActiveListings(worldName, itemId, currentListingsScope, forceRefresh);

      // 3. 『単一・同DC・全DC』全スコープのデータを出力・アイテム選択時に並行先行取得
      const dcName = getDcNameForWorld(worldName);
      const hqParam = pcListingsHqOnly ? '&hq=true' : '';
      const hqSuffix = pcListingsHqOnly ? 'hq' : 'all';

      const scopeUrls = {
        'world': `https://universalis.app/api/v2/${encodeURIComponent(worldName)}/${itemId}?listings=100${hqParam}`,
        'dc': `https://universalis.app/api/v2/${encodeURIComponent(dcName)}/${itemId}?listings=100${hqParam}`,
        'all': `https://universalis.app/api/v2/Japan/${itemId}?listings=100${hqParam}`
      };

      for (const [scopeKey, url] of Object.entries(scopeUrls)) {
        const cacheKey = `${itemId}_${worldName}_${scopeKey}_${hqSuffix}`;
        if (forceRefresh || !activeListingsCache[cacheKey]) {
          fetch(url)
            .then(res => res.ok ? res.json() : null)
            .then(data => {
              if (data) {
                let listings = data.listings || [];
                if (pcListingsHqOnly) listings = listings.filter(l => Boolean(l.hq));
                activeListingsCache[cacheKey] = {
                  listings: listings,
                  unitsForSale: data.unitsForSale || 0
                };
              }
            })
            .catch(e => console.error("Prefetch error for scope:", scopeKey, e));
        }
      }
    }

    function getOrComputeDailyTrend(item) {
      if (item && item.daily_trend && item.daily_trend.length > 0) {
        return { trend: item.daily_trend, trendPct: item.trend_pct || 0 };
      }

      const history = (item && item.history) ? item.history : [];
      if (!history || history.length === 0) {
        return { trend: [], trendPct: 0 };
      }

      // JS側で蓄積データ history (最大50件) から直近7日間の日別加重平均を即時動的計算
      const today = new Date();
      const daysLabels = [];
      const dayMap = new Map();

      for (let i = 6; i >= 0; i--) {
        const d = new Date(today.getTime() - i * 86400 * 1000);
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const lbl = `${month}/${day}`;
        daysLabels.push(lbl);
        dayMap.set(lbl, { totalRev: 0, totalQty: 0 });
      }

      for (const h of history) {
        if (!h.ts) continue;
        const d = new Date(h.ts * 1000);
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const lbl = `${month}/${day}`;

        if (dayMap.has(lbl)) {
          const entry = dayMap.get(lbl);
          const price = h.price || 0;
          const qty = h.qty || 1;
          entry.totalRev += price * qty;
          entry.totalQty += qty;
        }
      }

      const trend = [];
      const validAvgs = [];

      for (const lbl of daysLabels) {
        const entry = dayMap.get(lbl);
        const wavg = entry.totalQty > 0 ? Math.round(entry.totalRev / entry.totalQty) : 0;
        trend.push({ date: lbl, weighted_avg: wavg, volume: entry.totalQty });
        if (wavg > 0) validAvgs.push(wavg);
      }

      let trendPct = 0;
      if (validAvgs.length >= 2 && validAvgs[0] > 0) {
        trendPct = Math.round(((validAvgs[validAvgs.length - 1] - validAvgs[0]) / validAvgs[0]) * 1000) / 10;
      }

      return { trend, trendPct };
    }

    function buildTrendBadgeHtml(trendPct, options = {}) {
      const fontSize = options.fontSize || '0.65rem';
      const titleAttr = options.title ? `title="${options.title}"` : '';
      const suffix = options.labelSuffix ? ` ${options.labelSuffix}` : '';
      if (trendPct > 0) {
        return `<span style="color:#4ade80; font-weight:700; font-size:${fontSize};" ${titleAttr}><i class="fa-solid fa-arrow-trend-up"></i> +${trendPct}%${suffix}</span>`;
      } else if (trendPct < 0) {
        return `<span style="color:#f87171; font-weight:700; font-size:${fontSize};" ${titleAttr}><i class="fa-solid fa-arrow-trend-down"></i> ${trendPct}%${suffix}</span>`;
      }
      return `<span style="color:#94a3b8; font-size:${fontSize};" ${titleAttr}>➡️ 0%${suffix}</span>`;
    }

    function buildHistoryRowHtml(h) {
      const formattedTime = formatTimeLocal(new Date(h.ts * 1000).toISOString());
      const buyerName = h.buyer ? escapeHtml(h.buyer) : `<span style="color:var(--text-muted); font-size:0.75rem;">-</span>`;
      const hqBadge = h.hq ? `<span class="hq-badge">HQ</span>` : `<span style="color:var(--text-muted); font-size:0.75rem;">NQ</span>`;
      const price = (h.price || 0).toLocaleString();
      const qty = (h.qty || 0).toLocaleString();
      const totalPrice = ((h.price || 0) * (h.qty || 0)).toLocaleString();

      return `
        <tr>
          <td style="font-size:0.75rem; color:var(--text-muted);"><i class="fa-regular fa-clock"></i> ${formattedTime}</td>
          <td style="font-size:0.75rem; font-weight:600; color:var(--accent-blue);">${buyerName}</td>
          <td>${hqBadge}</td>
          <td style="font-weight:700; color:var(--accent-green);">${price}G</td>
          <td>${qty}個</td>
          <td style="font-weight:700; color:#ffb703;">${totalPrice}G</td>
        </tr>
      `;
    }

    function generateSparklineSvg(item, width = 64, height = 18) {
      const { trend, trendPct } = getOrComputeDailyTrend(item);
      if (!trend || trend.length < 2) return '';
      const validPoints = trend.map(d => d.weighted_avg || 0);
      const nonZero = validPoints.filter(p => p > 0);
      if (nonZero.length < 2) return '';

      const minP = Math.min(...nonZero);
      const maxP = Math.max(...nonZero);
      const range = (maxP - minP) || 1;

      const coords = validPoints.map((p, idx) => {
        const x = (idx / (validPoints.length - 1)) * (width - 6) + 3;
        const val = p > 0 ? p : minP;
        const y = height - 3 - (((val - minP) / range) * (height - 6));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });

      const isUp = (trendPct >= 0);
      const color = isUp ? '#4ade80' : '#f87171';

      return `
        <svg width="${width}" height="${height}" style="vertical-align:middle; overflow:visible;">
          <polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" points="${coords.join(' ')}" />
        </svg>
      `;
    }

    async function fetchAndRenderArbListings(containerId, worldOrRegion, itemId, hqOnly, isSource = false) {
      const tbody = document.getElementById(containerId);
      if (!tbody || !itemId) return;

      const cacheKey = `arb_${worldOrRegion}_${itemId}_${hqOnly ? 'hq' : 'all'}`;
      const colCount = 6;

      const renderRows = (listings) => {
        if (!listings || listings.length === 0) {
          tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; padding:1.5rem; color:var(--text-muted);">${hqOnly ? 'HQ品の' : ''}現在出品中の商品はありません</td></tr>`;
          return;
        }
        tbody.innerHTML = listings.slice(0, 50).map(l => {
          const price = (l.pricePerUnit || 0).toLocaleString();
          const qty = (l.quantity || 0).toLocaleString();
          const total = ((l.pricePerUnit || 0) * (l.quantity || 0)).toLocaleString();
          const hqBadge = l.hq ? `<span class="hq-badge">HQ</span>` : `<span style="color:var(--text-muted); font-size:0.75rem;">NQ</span>`;
          const retainer = l.retainerName ? escapeHtml(l.retainerName) : '-';
          const wName = l.worldName || worldOrRegion;

          return `
            <tr>
              <td style="font-size:0.68rem; font-weight:700; color:var(--accent-gold); white-space:nowrap;">${wName}</td>
              <td style="font-size:0.68rem; font-weight:600; color:var(--accent-blue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:90px;" title="${retainer}">${retainer}</td>
              <td>${hqBadge}</td>
              <td style="font-weight:700; color:var(--accent-green);">${price}G</td>
              <td style="font-weight:600;">${qty}個</td>
              <td style="font-weight:700; color:#ffb703;">${total}G</td>
            </tr>
          `;
        }).join('');
      };

      if (activeListingsCache[cacheKey]) {
        let listings = activeListingsCache[cacheKey].listings || [];
        if (hqOnly) listings = listings.filter(l => Boolean(l.hq));
        renderRows(listings);
        return;
      }

      tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; padding:1.5rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 出品データを取得中...</td></tr>`;

      try {
        let apiUrl = `https://universalis.app/api/v2/${encodeURIComponent(worldOrRegion)}/${itemId}?listings=100`;
        if (hqOnly) apiUrl += '&hq=true';

        const res = await fetchWithTimeout(apiUrl);
        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        let listings = data.listings || [];
        if (hqOnly) listings = listings.filter(l => Boolean(l.hq));

        activeListingsCache[cacheKey] = { listings, unitsForSale: data.unitsForSale || 0 };
        renderRows(listings);
      } catch (err) {
        console.error('fetchAndRenderArbListings error:', err);
        tbody.innerHTML = `<tr><td colspan="${colCount}" style="text-align:center; padding:1.5rem; color:#ef4444;">出品データの取得に失敗しました</td></tr>`;
      }
    }
