<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>FF14 Market Analytics - Japan Datacenters & World Tracker</title>
  <!-- Google Fonts & Icons & Chart.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #7928ca;
      --accent-gold: #ffb703;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.25rem 1rem;
    }

    .container {
      max-width: 1850px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.2);
      color: var(--accent-blue);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-blue);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-blue);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* DC Top Navigation Tabs */
    .dc-tabs-container {
      display: flex;
      gap: 0.6rem;
      background: rgba(15, 23, 42, 0.7);
      padding: 0.45rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 1.2rem;
      overflow-x: auto;
    }

    .dc-tab-btn {
      flex: 1;
      min-width: 140px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .dc-tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }

    .dc-tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.25), rgba(121, 40, 202, 0.3));
      border-color: rgba(0, 210, 255, 0.4);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
    }

    /* Single-Row Unified Controls Bar: World Nav Tabs + Search Box + Sort Controls */
    .controls-bar {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 0.45rem 0.8rem;
      border-radius: 14px;
      min-height: 46px;
      box-sizing: border-box;
    }

    .world-nav-wrapper {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex: 1 1 auto;
      min-width: 320px;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .world-nav-bar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      padding: 0;
      margin: 0;
      flex: 1;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .world-nav-bar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .world-nav-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      box-sizing: border-box;
      flex-shrink: 0;
      margin: 0;
    }

    .world-nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .world-nav-btn.active {
      background: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }

    .search-box {
      position: relative;
      flex: 0 0 200px;
      max-width: 220px;
      display: flex;
      align-items: center;
      margin: 0;
    }

    .search-box i {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.38rem 0.8rem 0.38rem 2.4rem;
      color: var(--text-main);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
      margin: 0;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    /* Sort Toggle Group */
    .sort-control-container {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: transparent;
      padding: 0;
      border: none;
      flex-shrink: 0;
      margin: 0;
    }

    .sort-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .sort-toggle-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 2px;
      box-sizing: border-box;
      margin: 0;
    }

    .sort-toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0 0.7rem;
      height: 26px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sort-toggle-btn:hover {
      color: #ffffff;
    }

    .sort-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.25);
    }

    .filter-toggle-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .filter-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .filter-toggle-btn.active {
      background: linear-gradient(135deg, rgba(121, 40, 202, 0.3), rgba(0, 210, 255, 0.25));
      border-color: rgba(0, 210, 255, 0.5);
      color: #00d2ff;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.2);
    }

    /* World Grid (4 Columns Visible, Lightweight Carousel) */
    .world-grid {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      min-height: 650px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .world-grid::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .world-column {
      flex: 0 0 calc((100% - 3rem) / 4);
      min-width: calc((100% - 3rem) / 4);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 250px);
      min-height: 620px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .world-column {
        flex: 0 0 100%;
        min-width: 100%;
      }
    }

    .world-column-header {
      padding: 0.85rem 1.1rem;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .world-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .world-count-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-blue);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
    }

    .world-item-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .world-item-list::-webkit-scrollbar {
      width: 5px;
    }

    .world-item-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* Enhanced Original Item Card Style */
    .item-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.9rem;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 210, 255, 0.35);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .item-card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
    }

    .item-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .item-header-text {
      flex: 1;
      min-width: 0;
    }

    .rank-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .item-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .lodestone-link-icon {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: color 0.2s ease;
    }

    .lodestone-link-icon:hover {
      color: var(--accent-blue);
    }

    .rank-tag {
      color: var(--accent-gold);
      font-weight: 700;
      margin-right: 0.35rem;
    }

    .item-stats-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .stat-badge {
      font-size: 0.73rem;
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .stat-vel {
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.25);
      color: var(--accent-blue);
    }

    .stat-rev {
      background: rgba(255, 183, 3, 0.12);
      border: 1px solid rgba(255, 183, 3, 0.25);
      color: var(--accent-gold);
    }

    .item-sub-grid {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      font-size: 0.76rem;
    }

    .stat-sub-item {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--text-muted);
    }

    .stat-min strong {
      color: var(--accent-blue);
    }

    .stat-avg strong {
      color: #c084fc;
    }

    .history-range-row {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .chart-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(121, 40, 202, 0.2);
      border: 1px solid rgba(121, 40, 202, 0.4);
      color: #c084fc;
      padding: 0.38rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      justify-content: center;
      margin-top: 0.2rem;
    }

    .chart-btn:hover {
      background: rgba(121, 40, 202, 0.45);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(121, 40, 202, 0.4);
    }

    /* Grid Slide Container & Navigation Buttons */
    .grid-scroll-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .grid-slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      width: 38px;
      height: 64px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--accent-blue);
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }

    .grid-slide-btn:hover {
      background: rgba(0, 210, 255, 0.25);
      color: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.4);
    }

    .grid-slide-left {
      left: -12px;
    }

    .grid-slide-right {
      right: -12px;
    }



    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-card {
      background: rgba(22, 30, 49, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      width: 92%;
      max-width: 850px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .modal-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 380px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-chart-simple"></i></div>
        <div>
          <h1>FF14 Market Tracker</h1>
          <div style="font-size:0.75rem; color:var(--text-muted);">Japan Datacenters & All 32 Worlds Comparison</div>
        </div>
      </div>
      <div class="header-badges">
        <div class="status-badge" id="lastUpdatedBadge">
          <span class="status-dot"></span> 最終更新: 読み込み中...
        </div>
      </div>
    </header>

    <!-- DC Selection Tabs -->
    <div class="dc-tabs-container">
      <button class="dc-tab-btn active" data-dc="Mana" onclick="switchDc('Mana')">
        <i class="fa-solid fa-server" style="color: #60a5fa;"></i> Mana (8 Worlds)
      </button>
      <button class="dc-tab-btn" data-dc="Elemental" onclick="switchDc('Elemental')">
        <i class="fa-solid fa-server" style="color: #a855f7;"></i> Elemental (8 Worlds)
      </button>
      <button class="dc-tab-btn" data-dc="Gaia" onclick="switchDc('Gaia')">
        <i class="fa-solid fa-server" style="color: #ec4899;"></i> Gaia (8 Worlds)
      </button>
      <button class="dc-tab-btn" data-dc="Meteor" onclick="switchDc('Meteor')">
        <i class="fa-solid fa-server" style="color: var(--accent-gold);"></i> Meteor (8 Worlds)
      </button>
    </div>

    <!-- Unified Single-Row Controls Bar: World Nav Tabs -> Sort Controls -> Search Box -->
    <div class="controls-bar">
      <!-- 1. World Nav Tabs -->
      <div class="world-nav-wrapper">
        <div class="world-nav-bar" id="worldNavBar">
          <!-- JavaScript Populated -->
        </div>
      </div>

      <!-- 2. Sort Control (売買数 / 流通ギル / 平均単価) -->
      <div class="sort-control-container">
        <span class="sort-label"><i class="fa-solid fa-arrow-down-wide-short"></i> 並び替え:</span>
        <div class="sort-toggle-group">
          <button class="sort-toggle-btn active" data-sort="velocity" onclick="setGlobalSort('velocity')">売買数</button>
          <button class="sort-toggle-btn" data-sort="revenue" onclick="setGlobalSort('revenue')">流通ギル</button>
          <button class="sort-toggle-btn" data-sort="avg_price" onclick="setGlobalSort('avg_price')">平均単価</button>
        </div>
      </div>

      <!-- 3. Crystal Exclusion Toggle Filter -->
      <button class="filter-toggle-btn active" id="crystalFilterBtn" onclick="toggleCrystalFilter()" title="シャード・クリスタル・クラスター類の表示/除外を切り替え">
        <i class="fa-solid fa-gem"></i> クリスタル除外: ON
      </button>

      <!-- 4. Search Box (Compact Width) -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="検索 (名前/ID)...">
      </div>
    </div>

    <!-- World 8 Columns Grid Container with Arrow Buttons -->
    <div class="grid-scroll-wrapper">
      <button class="grid-slide-btn grid-slide-left" onclick="slideWorldGrid(-1)" title="左へ移動">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="world-grid" id="worldGrid">
        <div style="text-align:center; padding:3rem; width:100%; color:var(--text-muted);">
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>マーケットデータを読み込み中...
        </div>
      </div>
      <button class="grid-slide-btn grid-slide-right" onclick="slideWorldGrid(1)" title="右へ移動">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- Chart Modal -->
  <div class="modal-overlay" id="chartModal" onclick="closeChartModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:0.8rem;">
          <img id="modalItemIcon" src="" style="width:36px;height:36px;border-radius:6px;display:none;" />
          <div>
            <h2 id="modalItemTitle" style="font-size:1.15rem;font-weight:700;color:#fff;">価格・在庫推移</h2>
            <div id="modalItemSub" style="font-size:0.78rem;color:var(--text-muted);">データセンター</div>
          </div>
        </div>
        <button class="modal-close-btn" onclick="closeChartModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="chart-container">
        <canvas id="priceChartCanvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    let allData = {};
    let activeDc = "Mana";
    let activeSortMode = "velocity";
    let excludeCrystals = true; // デフォルトでクリスタル類を除外
    let dcWorldsMap = {
      "Elemental": ["Carbuncle", "Gungnir", "Kujata", "Typhon", "Atomos", "Tonberry", "Aegis", "Garuda"],
      "Gaia": ["Alexander", "Bahamut", "Durandal", "Fenrir", "Ifrit", "Ridill", "Tiamat", "Ultima"],
      "Mana": ["Anima", "Asura", "Chocobo", "Hades", "Ixion", "Masamune", "Pandaemonium", "Titan"],
      "Meteor": ["Belias", "Mandragora", "Ramuh", "Shinryu", "Unicorn", "Valefor", "Yojimbo", "Zeromus"]
    };
    let allItemSearchDict = {};
    let priceChart = null;

    // クリスタル・シャード・クラスター・触媒の判定関数 (ID: 2~19 判定含む)
    function isCrystalItem(item) {
      if (!item) return false;
      const id = Number(item.item_id || 0);
      // FF14公式データ: シャード(2~7), クリスタル(8~13), クラスター(14~19)
      if (id >= 2 && id <= 19) return true;
      
      const cat = (item.meta && item.meta.category) ? item.meta.category : '';
      if (cat === "クリスタル" || cat === "触媒") return true;
      
      const name = item.item_name || '';
      if (name.includes("シャード") || name.includes("クリスタル") || name.includes("クラスター")) return true;
      
      return false;
    }

    function toggleCrystalFilter() {
      excludeCrystals = !excludeCrystals;
      const btn = document.getElementById('crystalFilterBtn');
      if (btn) {
        btn.classList.toggle('active', excludeCrystals);
        btn.innerHTML = `<i class="fa-solid fa-gem"></i> クリスタル除外: ${excludeCrystals ? 'ON' : 'OFF'}`;
      }
      renderWorldGrid();
    }

    function switchDc(dcName) {
      activeDc = dcName;
      document.querySelectorAll('.dc-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.dc === dcName);
      });
      requestAnimationFrame(() => {
        renderWorldGrid(true);
        const grid = document.getElementById('worldGrid');
        if (grid) grid.scrollTo({ left: 0, behavior: 'auto' });
      });
    }

    function setGlobalSort(mode) {
      if (activeSortMode === mode) return;
      activeSortMode = mode;
      document.querySelectorAll('.sort-toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sort === mode);
      });

      // 超高速ソート: DOMを壊さず全カラムのカード並び順だけ一括変更 (0ms即時)
      const worlds = dcWorldsMap[activeDc] || [];
      let attrKey = 'velocity';
      if (mode === 'revenue') attrKey = 'revenue';
      else if (mode === 'avg_price') attrKey = 'avg_price';
      else if (mode === 'min_price') attrKey = 'min_price';

      worlds.forEach(worldName => {
        const listEl = document.querySelector(`#world-col-${worldName} .world-item-list`);
        if (!listEl) return;
        const cards = Array.from(listEl.querySelectorAll('.item-card'));
        if (cards.length === 0) return;

        cards.sort((a, b) => {
          const valA = Number(a.dataset[attrKey] || 0);
          const valB = Number(b.dataset[attrKey] || 0);
          return valB - valA;
        });

        const frag = document.createDocumentFragment();
        cards.forEach((card, idx) => {
          const rankTag = card.querySelector('.rank-tag');
          if (rankTag) rankTag.textContent = `#${idx + 1}`;
          frag.appendChild(card);
        });
        listEl.appendChild(frag);
      });
    }

    // 超軽量: 1列分（1ワールド分）ずつ滑らかに横スライド移動
    function slideWorldGrid(direction) {
      const grid = document.getElementById('worldGrid');
      if (!grid) return;

      const firstCol = grid.querySelector('.world-column');
      if (!firstCol) return;

      const stepWidth = firstCol.offsetWidth + 16;
      grid.scrollBy({ left: stepWidth * direction, behavior: 'smooth' });
    }

    function scrollToWorld(worldName) {
      const col = document.getElementById(`world-col-${worldName}`);
      if (col) {
        document.querySelectorAll('.world-nav-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.world === worldName);
        });
        col.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
      }
    }

    function formatTimeJST(rawTimeStr) {
      if (!rawTimeStr) return '-';
      let str = String(rawTimeStr).trim();
      if (!str.endsWith('Z') && !str.includes('+')) {
        str = str.replace(' ', 'T') + 'Z';
      }
      const d = new Date(str);
      if (isNaN(d.getTime())) return rawTimeStr;
      
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function formatChartLabelJST(rawTimeStr) {
      if (!rawTimeStr) return '';
      let str = String(rawTimeStr).trim();
      if (!str.endsWith('Z') && !str.includes('+')) {
        str = str.replace(' ', 'T') + 'Z';
      }
      const d = new Date(str);
      if (isNaN(d.getTime())) return rawTimeStr.replace(/^\d{4}-/, '');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${month}-${day} ${hours}:${minutes}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    async function loadData() {
      try {
        const cacheBuster = `t=${Date.now()}_${Math.random()}`;
        const res = await fetch(`data.json?${cacheBuster}`, { cache: "no-store" });
        if (!res.ok) throw new Error('Data fetch failed');
        const data = await res.json();

        const lastUpdatedEl = document.getElementById('lastUpdatedBadge');
        if (lastUpdatedEl) {
          const formattedLastUpdated = formatTimeJST(data.last_updated);
          lastUpdatedEl.innerHTML = `<span class="status-dot"></span> 最終更新: ${formattedLastUpdated}`;
        }

        allData = data.data || {};
        if (data.dc_worlds) {
          dcWorldsMap = data.dc_worlds;
        }

        renderWorldGrid();

      } catch (err) {
        console.error("loadData error:", err);
        document.getElementById('worldGrid').innerHTML = `
          <div style="text-align:center; padding:3rem; width:100%; color:#ef4444;">
            <i class="fa-solid fa-triangle-exclamation fa-2x"></i><br><br>データ取得エラー
          </div>
        `;
      }
    }

    function renderWorldGrid(forceFull = false) {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      const worlds = dcWorldsMap[activeDc] || [];
      const dcItems = allData[activeDc] || [];

      // Render World Quick Nav Bar
      const navBar = document.getElementById('worldNavBar');
      navBar.innerHTML = worlds.map((w, idx) => `
        <button class="world-nav-btn ${idx === 0 ? 'active' : ''}" data-world="${w}" onclick="scrollToWorld('${w}')">
          <i class="fa-solid fa-globe"></i> ${w}
        </button>
      `).join('');

      // Filter items by crystal exclusion toggle & search term
      let filteredItems = dcItems;

      if (excludeCrystals) {
        filteredItems = filteredItems.filter(item => !isCrystalItem(item));
      }

      if (searchTerm) {
        filteredItems = filteredItems.filter(item => 
          (item.item_name && item.item_name.toLowerCase().includes(searchTerm)) ||
          item.item_id.toString().includes(searchTerm)
        );
      }

      // Build World Grid Columns (8 Worlds, Top 30 Items Each)
      const grid = document.getElementById('worldGrid');
      
      grid.innerHTML = worlds.map(worldName => {
        // Prepare items for this world with world-specific metrics
        const worldItems = filteredItems.map(item => {
          const wInfo = (item.worlds && item.worlds[worldName]) ? item.worlds[worldName] : {};
          const wMin = wInfo.min_price || 0;
          const wAvg = wInfo.avg_price || item.avg_price || 0;
          const wStock = wInfo.units_for_sale || 0;
          const wVel = (wInfo.velocity !== undefined && wInfo.velocity !== null) ? wInfo.velocity : (item.velocity || 0);
          const wHMin = (wInfo.hist_min !== undefined && wInfo.hist_min !== null) ? wInfo.hist_min : (item.hist_min || wMin);
          const wHMax = (wInfo.hist_max !== undefined && wInfo.hist_max !== null) ? wInfo.hist_max : (item.hist_max || wMin);
          const dailyRevenue = (wAvg || item.avg_price || 0) * wVel;

          return {
            ...item,
            w_min_price: wMin,
            w_avg_price: wAvg,
            w_stock: wStock,
            w_velocity: wVel,
            w_hist_min: wHMin,
            w_hist_max: wHMax,
            daily_revenue: dailyRevenue
          };
        });

        // Sort worldItems by activeSortMode
        if (activeSortMode === 'revenue') {
          worldItems.sort((a, b) => b.daily_revenue - a.daily_revenue);
        } else if (activeSortMode === 'avg_price') {
          worldItems.sort((a, b) => (b.w_avg_price || b.avg_price || 0) - (a.w_avg_price || a.avg_price || 0));
        } else if (activeSortMode === 'min_price') {
          worldItems.sort((a, b) => (b.w_min_price || b.min_price || 0) - (a.w_min_price || a.min_price || 0));
        } else {
          // Default: velocity
          worldItems.sort((a, b) => (b.w_velocity || 0) - (a.w_velocity || 0));
        }

        // 上位30件に絞って超高速表示！
        const displayItems = worldItems.slice(0, 30);

        const cardListHtml = displayItems.length === 0 ? `
          <div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.82rem;">
            高回転アイテム未検知
          </div>
        ` : displayItems.map((item, idx) => {
          let displayTitle = item.item_name || `Item ${item.item_id}`;
          if ((displayTitle.includes("Unknown") || displayTitle.startsWith("Item ")) && allItemSearchDict[item.item_id]) {
            displayTitle = allItemSearchDict[item.item_id];
          }
          let cleanTitle = escapeHtml(displayTitle).replace(/\s*\[(NQ|HQ)\]\s*$/i, "").trim();

          const minPriceVal = item.w_min_price > 0 ? item.w_min_price : (item.min_price || null);
          const minPriceStr = (minPriceVal !== null && minPriceVal > 0) ? `${Math.round(minPriceVal).toLocaleString()}G` : '-';

          const avgPriceVal = item.w_avg_price > 0 ? item.w_avg_price : (item.avg_price || null);
          const avgPriceStr = (avgPriceVal !== null && avgPriceVal > 0) ? `${Math.round(avgPriceVal).toLocaleString()}G` : '-';

          const vel = Number(item.w_velocity || 0);
          const velStr = Math.round(vel).toLocaleString();

          const dailyRevenue = Math.round(item.daily_revenue || 0);
          const dailyRevenueStr = dailyRevenue.toLocaleString() + 'G';

          const stockStr = (item.w_stock || 0).toLocaleString();

          const hMin = Math.round(Number(item.w_hist_min || minPriceVal || 0));
          const hMax = Math.round(Number(item.w_hist_max || hMin));

          let historyText = "";
          if (hMin === hMax || hMax === 0) {
            historyText = `過去取引: ${hMin.toLocaleString()}G/個 (単一帯)`;
          } else {
            historyText = `過去取引: 最安 ${hMin.toLocaleString()}G 〜 最高 ${hMax.toLocaleString()}G`;
          }

          const meta = item.meta || {};
          const iconUrl = meta.icon_url || '';
          const iconImg = iconUrl ? `<img class="item-icon" data-src="${iconUrl}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" onerror="this.style.display='none'">` : '';

          const lodestoneUrl = `https://jp.finalfantasyxiv.com/lodestone/playguide/db/item/?patch=&db_search_category=item&category2=&q=${encodeURIComponent(displayTitle)}`;

          return `
            <div class="item-card" data-velocity="${vel}" data-revenue="${dailyRevenue}" data-avg_price="${Math.round(avgPriceVal || 0)}" data-min_price="${Math.round(minPriceVal || 0)}">
              <div class="item-card-header">
                ${iconImg}
                <div class="item-header-text">
                  <span class="item-card-title">
                    <span class="rank-tag">#${idx + 1}</span>${cleanTitle}
                    <a href="${lodestoneUrl}" target="_blank" rel="noopener" class="lodestone-link-icon" title="Lodestoneで検索">
                      <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                  </span>
                </div>
              </div>

              <div class="item-stats-row">
                <span class="stat-badge stat-vel" title="1日あたりの平均売買数"><i class="fa-solid fa-bolt"></i> 売買数: ${velStr}個/日</span>
                <span class="stat-badge stat-rev" title="1日あたりの推定流通金額"><i class="fa-solid fa-coins"></i> 流通ギル: ${dailyRevenueStr}/日</span>
              </div>

              <div class="item-sub-grid">
                <span class="stat-sub-item stat-min" title="最安単価"><i class="fa-solid fa-tag"></i> 最安単価: <strong>${minPriceStr}</strong></span>
                <span class="stat-sub-item stat-avg" title="平均単価"><i class="fa-solid fa-scale-balanced"></i> 平均単価: <strong>${avgPriceStr}</strong></span>
              </div>

              <div class="history-range-row">
                <i class="fa-solid fa-clock-rotate-left"></i> ${historyText}
              </div>

              <button class="chart-btn" onclick="openChartModal('${activeDc}', ${item.item_id})">
                <i class="fa-solid fa-chart-line"></i> 推移グラフ
              </button>
            </div>
          `;
        }).join('');

        return `
          <div class="world-column" id="world-col-${worldName}">
            <div class="world-column-header">
              <div class="world-name"><i class="fa-solid fa-globe" style="color: var(--accent-blue);"></i> ${worldName}</div>
              <span class="world-count-badge">${displayItems.length}件</span>
            </div>
            <div class="world-item-list">
              ${cardListHtml}
            </div>
          </div>
        `;
      }).join('');

      // 遅延画像読み込み: 画面内に入ったアイコンだけ読み込む
      requestAnimationFrame(() => {
        const lazyImages = grid.querySelectorAll('img[data-src]');
        if ('IntersectionObserver' in window) {
          const imgObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                delete img.dataset.src;
                imgObserver.unobserve(img);
              }
            });
          }, { root: grid, rootMargin: '200px' });
          lazyImages.forEach(img => imgObserver.observe(img));
        } else {
          lazyImages.forEach(img => { img.src = img.dataset.src; });
        }
      });
    }

    function openChartModal(dc, itemId) {
      const items = allData[dc] || [];
      const item = items.find(i => i.item_id === itemId || i.item_id === Number(itemId));
      if (!item) return;

      const history = item.history_points || [];
      const modal = document.getElementById('chartModal');
      const modalTitle = document.getElementById('modalItemTitle');
      const modalSub = document.getElementById('modalItemSub');
      const modalIcon = document.getElementById('modalItemIcon');

      let displayTitle = item.item_name || `Item ${item.item_id}`;
      if (allItemSearchDict[item.item_id]) {
        displayTitle = allItemSearchDict[item.item_id];
      }
      modalTitle.innerText = displayTitle.replace(/\s*\[(NQ|HQ)\]\s*$/i, "").trim();
      modalSub.innerText = `${dc} データセンター | 直近の推移 (データ履歴: ${history.length}件)`;

      const meta = item.meta || {};
      if (meta.icon_url) {
        modalIcon.src = meta.icon_url;
        modalIcon.style.display = 'block';
      } else {
        modalIcon.style.display = 'none';
      }

      modal.classList.add('active');

      const labels = history.map(h => formatChartLabelJST(h.timestamp));
      const avgPrices = history.map(h => h.avg_price);
      const minPrices = history.map(h => h.min_price);
      const stockUnits = history.map(h => h.units_for_sale);

      const ctx = document.getElementById('priceChartCanvas').getContext('2d');
      if (priceChart) {
        priceChart.destroy();
      }

      priceChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length > 0 ? labels : [formatChartLabelJST(item.timestamp) || '現在'],
          datasets: [
            {
              label: '平均価格 (G)',
              data: avgPrices.length > 0 ? avgPrices : [item.avg_price],
              borderColor: '#a855f7',
              backgroundColor: 'rgba(168, 85, 247, 0.15)',
              fill: true,
              tension: 0.3,
              yAxisID: 'yPrice'
            },
            {
              label: 'DC最安値 (G)',
              data: minPrices.length > 0 ? minPrices : [item.min_price],
              borderColor: '#4ade80',
              backgroundColor: 'transparent',
              borderDash: [4, 4],
              tension: 0.3,
              yAxisID: 'yPrice'
            },
            {
              label: 'DC総在庫数 (個)',
              data: stockUnits.length > 0 ? stockUnits : [item.units_for_sale],
              borderColor: '#ffb703',
              backgroundColor: 'transparent',
              tension: 0.3,
              yAxisID: 'yStock'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false,
          },
          plugins: {
            legend: {
              labels: { color: '#94a3b8', font: { family: 'Inter' } }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#94a3b8' }
            },
            yPrice: {
              type: 'linear',
              display: true,
              position: 'left',
              title: { display: true, text: '価格 (Gil)', color: '#a855f7' },
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#94a3b8' }
            },
            yStock: {
              type: 'linear',
              display: true,
              position: 'right',
              title: { display: true, text: '在庫数 (個)', color: '#ffb703' },
              grid: { drawOnChartArea: false },
              ticks: { color: '#ffb703' }
            }
          }
        }
      });
    }

    function closeChartModal(e) {
      if (!e || e.target.id === 'chartModal' || e.target.closest('.modal-close-btn')) {
        document.getElementById('chartModal').classList.remove('active');
      }
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      renderWorldGrid();
    });

    setInterval(loadData, 60000);
    loadData();

    async function loadItemSearchDict() {
      try {
        const res = await fetch('items_search.json');
        if (res.ok) {
          allItemSearchDict = await res.json();
        }
      } catch (e) {
        console.warn("Could not load items_search.json:", e);
      }
    }
    loadItemSearchDict();
  </script>
</body>
</html>
