<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script>
    if (typeof window !== 'undefined' && typeof navigator !== 'undefined' && window.location && typeof window.location.pathname === 'string') {
      if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth > 0 && window.innerWidth <= 768)) {
        if (!window.location.pathname.endsWith('mobile.html')) {
          window.location.replace('mobile.html');
        }
      }
    }
  </script>
  <title>FF14 Market Analytics - Japan Datacenters & World Tracker</title>
  <!-- Google Fonts & Icons & Chart.js -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #7928ca;
      --accent-gold: #ffb703;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
    }

    .history-table-container {
      max-height: 320px;
      overflow-y: auto;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    @media (min-width: 769px) {
      #itemDetailModal {
        display: none !important;
      }
      .pc-dashboard-container {
        display: flex !important;
        gap: 1.25rem !important;
        align-items: start !important;
        margin-top: 0.35rem;
        width: 100%;
      }
      .left-card-scroll-pane {
        width: 440px !important;
        flex: 0 0 440px !important;
        position: sticky !important;
        top: 75px !important;
        height: calc(100vh - 90px) !important;
        max-height: calc(100vh - 90px) !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 0.85rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }
      .pc-dashboard-container.view-analytics #arbitrageGridWrapper,
      .pc-dashboard-container.view-analytics #arbitrageMonitorWrapper {
        display: none !important;
      }
      .pc-dashboard-container.view-analytics #analyticsMonitorWrapper {
        display: flex !important;
      }
      .pc-dashboard-container.view-arbitrage #analyticsGridWrapper,
      .pc-dashboard-container.view-arbitrage #analyticsMonitorWrapper {
        display: none !important;
      }
      .pc-dashboard-container.view-arbitrage #arbitrageMonitorWrapper {
        display: flex !important;
      }
      .left-card-scroll-pane .grid-scroll-wrapper,
      .left-card-scroll-pane .world-grid-scroll-container,
      .left-card-scroll-pane .world-column {
        flex: 1 !important;
        height: 100% !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        width: 100% !important;
      }
      .left-pane-header {
        flex-shrink: 0 !important;
        background: rgba(15, 23, 42, 0.95) !important;
        border: 1px solid var(--card-border) !important;
        border-radius: 12px !important;
        padding: 0.6rem 0.75rem !important;
        margin-bottom: 0.65rem !important;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35) !important;
      }
      .world-item-list {
        flex: 1 !important;
        height: 100% !important;
        min-height: 0 !important;
        overflow-y: auto !important;
        padding-right: 4px;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .world-item-list::-webkit-scrollbar {
        width: 6px;
      }
      .world-item-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      .pc-right-pane {
        display: flex !important;
        flex-direction: column !important;
        flex: 1 !important;
        min-width: 0 !important;
        position: sticky !important;
        top: 75px !important;
        height: calc(100vh - 90px) !important;
        max-height: calc(100vh - 90px) !important;
        overflow: hidden !important;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 1.1rem 1.25rem 1.1rem 1.25rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }
      .pc-right-pane .history-table-container {
        max-height: none !important;
        flex: 1 !important;
        height: 100% !important;
      }
      .pc-right-pane::-webkit-scrollbar {
        width: 6px;
      }
      .pc-right-pane::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      .slider-nav-btn, .grid-slide-btn {
        display: none !important;
      }
      .pc-world-select {
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid var(--accent-blue);
        border-radius: 8px;
        color: #ffffff;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 3px 6px;
        outline: none;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        transition: all 0.2s ease;
      }
      .pc-world-select:hover {
        border-color: #38bdf8;
        box-shadow: 0 0 14px rgba(0, 210, 255, 0.4);
      }
      .pc-world-select optgroup {
        background: #0f172a;
        color: var(--accent-gold);
        font-weight: 700;
      }
      .pc-world-select option {
        background: #0f172a;
        color: #ffffff;
        font-weight: 600;
      }
      .dc-summary-card.clickable-card {
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .dc-summary-card.clickable-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 210, 255, 0.25);
        border-color: var(--accent-blue) !important;
      }
      .item-card.active-card {
        border-color: var(--accent-blue) !important;
        background: linear-gradient(135deg, rgba(0, 210, 255, 0.12) 0%, rgba(15, 23, 42, 0.95) 100%) !important;
        box-shadow: 0 0 16px rgba(0, 210, 255, 0.45) !important;
      }
    }

    .container {
      max-width: 1850px;
      margin: 0 auto;
      height: 100vh;
      padding: 0.5rem 0.8rem;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      gap: 0.8rem;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* View Mode Switcher Buttons */
    .view-mode-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .view-mode-tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .view-mode-tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(255, 183, 3, 0.2));
      border-color: rgba(255, 183, 3, 0.4);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.2);
    }

    /* Arbitrage Grid & Card Styles */
    .arbitrage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1rem;
      width: 100%;
    }

    .arbitrage-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .arbitrage-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 183, 3, 0.5);
      box-shadow: 0 8px 24px rgba(255, 183, 3, 0.15);
    }

    .arbitrage-card-header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }



    .arb-route-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
    }

    .arb-route-box {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      flex: 1;
      overflow: hidden;
    }

    .arb-route-box.buy-box {
      border-left: 3px solid var(--accent-green);
      padding-left: 0.5rem;
    }

    .arb-route-box.sell-box {
      border-left: 3px solid var(--accent-blue);
      padding-left: 0.5rem;
    }

    .arb-box-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .arb-box-world {
      font-size: 0.78rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arb-box-price {
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
    }

    .arb-route-arrow {
      color: var(--accent-gold);
      font-size: 1.1rem;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .arb-profit-summary {
      display: grid;
      grid-template-columns: 1fr 0.9fr 1.25fr;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255, 183, 3, 0.06);
      border: 1px solid rgba(255, 183, 3, 0.2);
      border-radius: 8px;
      padding: 0.45rem 0.6rem;
      font-size: 0.72rem;
    }

    .arb-stat-item {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      overflow: hidden;
    }

    .arb-stat-item.gold-highlight {
      background: rgba(255, 183, 3, 0.12);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 183, 3, 0.3);
    }




    /* Single-Row Unified Controls Bar: World Nav Tabs + Search Box + Sort Controls */






    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.38rem 0.8rem 0.38rem 2.4rem;
      color: var(--text-main);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s ease;
      box-sizing: border-box;
      margin: 0;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }



    .sort-toggle-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 2px;
      box-sizing: border-box;
      margin: 0;
    }

    .sort-toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 0 0.7rem;
      height: 26px;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sort-toggle-btn:hover {
      color: #ffffff;
    }

    .sort-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.25);
    }

    /* View Toggle Group (Arbitrage Monitor Sub-tabs) */
    .view-toggle-group {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2px;
      box-sizing: border-box;
    }

    .view-toggle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .view-toggle-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    .view-toggle-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.25);
    }

    .filter-toggle-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.85rem;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .filter-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .filter-toggle-btn.active {
      background: linear-gradient(135deg, rgba(121, 40, 202, 0.3), rgba(0, 210, 255, 0.25));
      border-color: rgba(0, 210, 255, 0.5);
      color: #00d2ff;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.2);
    }

    /* World Grid (4 Columns Visible, Lightweight Carousel) */
    .world-grid {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      height: 100%;
      min-height: 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
      scroll-behavior: smooth;
      align-items: stretch;
    }

    .world-grid::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .world-column {
      flex: 0 0 calc((100% - 3rem) / 4);
      min-width: calc((100% - 3rem) / 4);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
    }



    /* Grid Slide Container & Navigation Buttons */
    .grid-scroll-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }





    .world-item-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0.75rem 0.75rem 1.2rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .world-item-list::-webkit-scrollbar {
      width: 5px;
    }

    .world-item-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* Enhanced Original Item Card Style */
    .item-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.7rem 0.75rem;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      cursor: pointer;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 210, 255, 0.35);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .item-card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
    }

    .item-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .item-header-text {
      flex: 1;
      min-width: 0;
    }

    .item-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .lodestone-link-icon {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: color 0.2s ease;
    }

    .lodestone-link-icon:hover {
      color: var(--accent-blue);
    }

    .rank-tag {
      color: var(--accent-gold);
      font-weight: 700;
      margin-right: 0.35rem;
    }



    /* DC内ハイライト比較カード (4カラム: 最安値・最安平均・最高平均・最高値) */
    .dc-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }



    .dc-summary-card {
      background: rgba(11, 17, 30, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.75rem 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dc-summary-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      filter: brightness(1.15);
    }

    .modal-card.arb-modal-wide {
      max-width: 1320px;
    }

    .arb-modal-dual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }



    .arb-world-column-card {
      background: rgba(11, 17, 30, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .arb-world-column-card.buy-side {
      border-top: 4px solid var(--accent-green);
    }

    .arb-world-column-card.sell-side {
      border-top: 4px solid var(--accent-blue);
    }

    .copy-icon-btn {
      background: rgba(255, 183, 3, 0.12);
      border: 1px solid rgba(255, 183, 3, 0.35);
      color: #ffb703;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .copy-icon-btn:hover {
      background: #ffb703;
      color: #000000;
      box-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
      transform: scale(1.05);
    }

    .copy-icon-btn.copied {
      background: rgba(74, 222, 128, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .dc-summary-card.min-card {
      border-left: 4px solid var(--accent-green);
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.min-avg-card {
      border-left: 4px solid #c084fc;
      background: linear-gradient(135deg, rgba(192, 132, 252, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.max-avg-card {
      border-left: 4px solid #f472b6;
      background: linear-gradient(135deg, rgba(244, 114, 182, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-card.max-card {
      border-left: 4px solid #ef4444;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), rgba(11, 17, 30, 0.6));
    }

    .dc-summary-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .dc-summary-world {
      font-weight: 700;
      font-size: 0.92rem;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dc-summary-price {
      font-family: 'Outfit', sans-serif;

  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>
<body>
  <div class="container">

    <header>

  <script>
    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 8000 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => clearTimeout(id), timeout);
      try {
        const response = await fetch(resource, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (error) {
        clearTimeout(id);
        throw error;
      }
    }

    let allData = {};
    let activeDc = "Mana";
    let activeSortMode = "velocity";
    let excludeCrystals = true; // デフォルトでクリスタル類を除外
    let dcWorldsMap = {
      "Elemental": ["Carbuncle", "Gungnir", "Kujata", "Typhon", "Atomos", "Tonberry", "Aegis", "Garuda"],
      "Gaia": ["Alexander", "Bahamut", "Durandal", "Fenrir", "Ifrit", "Ridill", "Tiamat", "Ultima"],
      "Mana": ["Anima", "Asura", "Chocobo", "Hades", "Ixion", "Masamune", "Pandaemonium", "Titan"],
      "Meteor": ["Belias", "Mandragora", "Ramuh", "Shinryu", "Unicorn", "Valefor", "Yojimbo", "Zeromus"]
    };

    // アイコンURLの動的計算アルゴリズム (アイテムIDからXIVAPI v2高画質PNGアイコンURLを100%自動算出)
    function getComputedIconUrl(itemId) {
      if (!itemId) return 'https://v2.xivapi.com/api/asset?path=ui/icon/020000/021001_hr1.tex&format=png';
      const id = Number(itemId);
      const folderNum = Math.floor(id / 1000) * 1000;
      const folderStr = String(folderNum).padStart(6, '0');
      const iconStr = String(id).padStart(6, '0');
      return `https://v2.xivapi.com/api/asset?path=ui/icon/${folderStr}/${iconStr}_hr1.tex&format=png`;
    }

    // クリスタル・シャード・クラスター・触媒の判定関数 (ID: 2~19 判定含む)
    function isCrystalItem(item) {
      if (!item) return false;
      const id = typeof item === 'number' ? item : Number(item.item_id || 0);
      // FF14公式データ: シャード(2~7), クリスタル(8~13), クラスター(14~19)
      if (id >= 2 && id <= 19) return true;
      
      if (typeof item === 'object') {
        const cat = (item.meta && item.meta.category) ? item.meta.category : '';
        if (cat === "クリスタル" || cat === "触媒") return true;
        
        const name = item.item_name || item.name || '';
        if (name.includes("シャード") || name.includes("クリスタル") || name.includes("クラスター")) return true;
      }
      
      return false;
    }

    function toggleCrystalFilter() {
      excludeCrystals = !excludeCrystals;
      const btns = document.querySelectorAll('#crystalFilterBtn, #pcCrystalFilterBtn, .crystal-filter-btn');
      btns.forEach(btn => {
        btn.classList.toggle('active', excludeCrystals);
        btn.innerHTML = `<i class="fa-solid fa-gem"></i> ${excludeCrystals ? 'ON' : 'OFF'}`;
      });
      renderWorldGrid();
    }



    function setGlobalSort(mode) {
      activeSortMode = mode;
      document.querySelectorAll('.sort-toggle-group .sort-toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sort === mode);
      });

      resetPcMonitorToNoData();
      renderWorldGrid();

      const itemList = document.querySelector('.world-item-list');
      if (itemList) itemList.scrollTop = 0;
    }



    function formatTimeLocal(rawTimeStr) {
      if (!rawTimeStr) return '-';
      let str = String(rawTimeStr).trim();
      if (!str.endsWith('Z') && !str.includes('+')) {
        str = str.replace(' ', 'T') + 'Z';
      }
      const d = new Date(str);
      if (isNaN(d.getTime())) return rawTimeStr;
      
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function getAggregationPeriodStr(rawTimeStr) {
      if (!rawTimeStr) {
        const dEnd = new Date();
        const dStart = new Date(dEnd.getTime() - (7 * 86400 * 1000));
        return `${dStart.getMonth() + 1}/${dStart.getDate()}～${dEnd.getMonth() + 1}/${dEnd.getDate()}`;
      }
      let str = String(rawTimeStr).trim();
      if (!str.endsWith('Z') && !str.includes('+')) {
        str = str.replace(' ', 'T') + 'Z';
      }
      const dEnd = new Date(str);
      if (isNaN(dEnd.getTime())) {
        const dNow = new Date();
        const dStart = new Date(dNow.getTime() - (7 * 86400 * 1000));
        return `${dStart.getMonth() + 1}/${dStart.getDate()}～${dNow.getMonth() + 1}/${dNow.getDate()}`;
      }
      const dStart = new Date(dEnd.getTime() - (7 * 86400 * 1000));
      const startStr = `${dStart.getMonth() + 1}/${dStart.getDate()}`;
      const endStr = `${dEnd.getMonth() + 1}/${dEnd.getDate()}`;
      return `${startStr}～${endStr}`;
    }

    let currentPeriodText = '';
    let pcAnalyticsSearchTerm = '';
    let pcArbitrageSearchTerm = '';
    let analyticsSearchTimer = null;
    let arbitrageSearchTimer = null;
    let isComposing = false;

    function preserveAndRestoreFocus(fn) {
      const activeEl = document.activeElement;
      const activeId = activeEl ? activeEl.id : null;
      const startPos = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
      const endPos = activeEl && typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null;

      fn();

      if (activeId && ['pcAnalyticsSearchInput', 'pcArbitrageSearchInput', 'searchInput', 'arbSearchInput'].includes(activeId)) {
        requestAnimationFrame(() => {
          const restoredInput = document.getElementById(activeId);
          if (restoredInput) {
            restoredInput.focus();
            if (startPos !== null && endPos !== null) {
              try {
                restoredInput.setSelectionRange(startPos, endPos);
              } catch (e) {}
            }
          }
        });
      }
    }

    function setupSearchImeListeners() {
      ['pcAnalyticsSearchInput', 'pcArbitrageSearchInput', 'searchInput', 'arbSearchInput'].forEach(id => {
        const input = document.getElementById(id);
        if (!input || input.dataset.imeBound) return;
        input.dataset.imeBound = "true";

        input.addEventListener('compositionstart', () => {
          isComposing = true;
        });

        input.addEventListener('compositionend', (e) => {
          isComposing = false;
          if (id === 'pcAnalyticsSearchInput' || id === 'searchInput') {
            onSearchInput(e.target.value);
          } else {
            onArbSearchInput(e.target.value);
          }
        });
      });
    }

    function onSearchInput(val) {
      pcAnalyticsSearchTerm = val.toLowerCase().trim();
      if (isComposing) return;
      clearTimeout(analyticsSearchTimer);
      analyticsSearchTimer = setTimeout(() => {
        preserveAndRestoreFocus(() => {
          renderWorldGrid();
        });
        setupSearchImeListeners();
      }, 180);
    }

    function clearPcAnalyticsSearch() {
      pcAnalyticsSearchTerm = '';
      const input = document.getElementById('pcAnalyticsSearchInput') || document.getElementById('searchInput');
      if (input) input.value = '';
      renderWorldGrid();
    }

    function onArbSearchInput(val) {
      pcArbitrageSearchTerm = val.toLowerCase().trim();
      if (isComposing) return;
      clearTimeout(arbitrageSearchTimer);
      arbitrageSearchTimer = setTimeout(() => {
        preserveAndRestoreFocus(() => {
          renderArbitrageGrid();
        });
        setupSearchImeListeners();
      }, 180);
    }

    function clearPcArbitrageSearch() {
      pcArbitrageSearchTerm = '';
      const input = document.getElementById('pcArbitrageSearchInput') || document.getElementById('arbSearchInput');
      if (input) input.value = '';
      renderArbitrageGrid();
    }



    const USER_WORLD_KEY = 'ff14_user_home_world';

    function getSavedUserHomeWorld() {
      try {
        return localStorage.getItem(USER_WORLD_KEY) || null;
      } catch (e) {
        return null;
      }
    }

    function saveUserHomeWorld(worldName) {
      if (!worldName) return;
      try {
        localStorage.setItem(USER_WORLD_KEY, worldName);
      } catch (e) {}
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    let lastLoadedTime = null;

    let lastLoadedTime = null;

    async function loadData() {
      try {
        let data = null;

        try {
          const res = await fetchWithTimeout('data.json.gz', { timeout: 20000 });
          if (res && res.ok) {
            if (window.DecompressionStream) {
              try {
                const ds = new DecompressionStream('gzip');
                const decompressedResponse = new Response(res.body.pipeThrough(ds));
                data = await decompressedResponse.json();
              } catch (dsErr) {
                console.warn("DecompressionStream failed:", dsErr);
              }
            }
            if (!data && window.pako) {
              const arrayBuffer = await res.arrayBuffer();
              const decompressedStr = pako.ungzip(new Uint8Array(arrayBuffer), { to: 'string' });
              data = JSON.parse(decompressedStr);
            }
          }
        } catch (gzErr) {
          console.warn("data.json.gz fetch error:", gzErr);
        }

        if (!data) {
          try {
            const res = await fetchWithTimeout('data.json', { timeout: 20000 });
            if (res && res.ok) data = await res.json();
          } catch (e) {}
        }

        if (!data) {
          throw new Error('データファイルのロード・解凍に失敗しました');
        }

        if (data.last_updated) {
          currentPeriodText = getAggregationPeriodStr(data.last_updated);
          const lastUpdatedEl = document.getElementById('lastUpdatedBadge');
          if (lastUpdatedEl) {
            const formattedLastUpdated = formatTimeLocal(data.last_updated);
            lastUpdatedEl.innerHTML = `<i class="fa-regular fa-clock"></i> 最終更新: ${formattedLastUpdated} (${currentPeriodText})`;
          }
        }

        allData = data.worlds || data.data || {};
        populateWorldSelects();
        renderWorldGrid();

      } catch (err) {
        console.error('データ読み込みエラー:', err);
        const lastUpdatedEl = document.getElementById('lastUpdatedBadge');
        if (lastUpdatedEl) {
          lastUpdatedEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:var(--accent-red);"></i> データ読み込み失敗 (${err.message})`;
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadData();
    });
</body>
