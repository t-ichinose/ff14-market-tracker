<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>FF14 Market Analytics - Enriched Pro Dashboard</title>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #00d2ff;
      --accent-purple: #7928ca;
      --accent-gold: #ffb703;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --badge-hq-bg: rgba(239, 68, 68, 0.15);
      --badge-hq-border: rgba(239, 68, 68, 0.4);
      --badge-hq-text: #f87171;
      --badge-nq-bg: rgba(59, 130, 246, 0.15);
      --badge-nq-border: rgba(59, 130, 246, 0.4);
      --badge-nq-text: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.2);
      color: var(--accent-blue);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .refresh-btn {
      background: rgba(0, 210, 255, 0.15);
      border: 1px solid var(--accent-blue);
      color: #ffffff;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .refresh-btn:hover {
      background: var(--accent-blue);
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .filter-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid rgba(255, 183, 3, 0.3);
      color: var(--accent-gold);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-blue);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-blue);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .search-box {
      position: relative;
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.7rem 1rem 0.7rem 2.8rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    .dc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }

    .dc-column {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 180px);
      min-height: 600px;
    }

    .dc-column-header {
      padding: 1rem 1.25rem;
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }

    .dc-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dc-count-badge {
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-blue);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
    }

    .dc-item-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .dc-item-list::-webkit-scrollbar {
      width: 6px;
    }

    .dc-item-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }

    .dc-item-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .dc-item-list::-webkit-scrollbar-thumb:hover {
      background: var(--accent-blue);
    }

    /* Enhanced Item Card */
    .item-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 210, 255, 0.3);
      background: rgba(15, 23, 42, 0.85);
    }

    .item-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .rank-tag {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--accent-gold);
    }

    .item-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      line-height: 1.3;
      flex: 1;
    }

    .quality-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
    }

    .quality-hq {
      background: var(--badge-hq-bg);
      border: 1px solid var(--badge-hq-border);
      color: var(--badge-hq-text);
    }

    .quality-nq {
      background: var(--badge-nq-bg);
      border: 1px solid var(--badge-nq-border);
      color: var(--badge-nq-text);
    }

    .item-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .velocity-badge {
      color: var(--accent-green);
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.85rem;
    }

    .price-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-right: 0.2rem;
    }

    .price-main {
      font-weight: 700;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
    }

    .item-sub-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.06);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Analytics Badges */
    .analytics-tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.2rem;
    }

    .tag-stock {
      font-size: 0.7rem;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: #4ade80;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-weight: 600;
    }

    .tag-discount {
      font-size: 0.7rem;
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: #f87171;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-weight: 700;
    }

    /* Cross-DC Profit Banner */
    .cross-profit-box {
      background: linear-gradient(135deg, rgba(121, 40, 202, 0.25), rgba(0, 210, 255, 0.25));
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: 0.73rem;
      margin-top: 0.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .profit-route {
      color: #e2e8f0;
      font-weight: 600;
    }

    .profit-rate {
      color: var(--accent-gold);
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
    }

    @media (max-width: 1400px) {
      .dc-grid { grid-template-columns: repeat(2, 1fr); }
      .dc-column { height: 550px; }
    }

    @media (max-width: 768px) {
      .dc-grid { grid-template-columns: 1fr; }
      .dc-column { height: 500px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-bolt-lightning"></i></div>
        <div>
          <h1>FF14 Market Board Analytics</h1>
        </div>
      </div>

      <div class="header-badges">
        <button class="refresh-btn" onclick="loadData()"><i class="fa-solid fa-rotate"></i> データ更新</button>
        <div class="filter-badge">
          <i class="fa-solid fa-fire"></i> 1日50個以上売れる超高流動品
        </div>
        <div class="status-badge" id="lastUpdatedBadge">
          <span class="status-dot"></span> 読み込み中...
        </div>
      </div>
    </header>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="全DC横断アイテム検索 (名前またはID)...">
    </div>

    <div class="dc-grid">

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: var(--accent-blue);"></i> Mana</div>
          <span class="dc-count-badge" id="count-Mana">0件</span>
        </div>
        <div class="dc-item-list" id="list-Mana">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: #a855f7;"></i> Elemental</div>
          <span class="dc-count-badge" id="count-Elemental">0件</span>
        </div>
        <div class="dc-item-list" id="list-Elemental">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: #ec4899;"></i> Gaia</div>
          <span class="dc-count-badge" id="count-Gaia">0件</span>
        </div>
        <div class="dc-item-list" id="list-Gaia">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

      <div class="dc-column">
        <div class="dc-column-header">
          <div class="dc-name"><i class="fa-solid fa-server" style="color: var(--accent-gold);"></i> Meteor</div>
          <span class="dc-count-badge" id="count-Meteor">0件</span>
        </div>
        <div class="dc-item-list" id="list-Meteor">
          <div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> 読み込み中...</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const DATACENTERS = ["Mana", "Elemental", "Gaia", "Meteor"];
    let allDcData = {};

    const FRONTEND_NAME_MAP = {
      49234: "剛力の心酔薬G4",
      49235: "活力の心酔薬G4",
      49236: "器用の心酔薬G4",
      49237: "敏捷の心酔薬G4",
      49238: "知力の心酔薬G4",
      49239: "精神の心酔薬G4",
      49240: "心力の心酔薬G4",
      49229: "フトコーラ",
      49209: "セドライト",
      47701: "トラルコーン",
      47740: "コザマル・カモミール",
      49230: "キャロットラペ",
      49225: "ローストチキン",
      49226: "メスカル",
      49227: "ベラフディアン・ペペロンチーノ",
      49228: "コンチャ",
      45972: "オルコクロマイト",
      45984: "クラロウォルナット原木",
      46188: "シデリティス茶葉",
      50414: "アイギス・エネルギーパック",
      52254: "カード:ノーマカー"
    };

    async function loadData() {
      try {
        const cacheBuster = `t=${Date.now()}_${Math.random()}`;
        const res = await fetch(`data.json?${cacheBuster}`, { 
          cache: "no-store"
        });
        if (!res.ok) throw new Error('Data fetch failed');
        const data = await res.json();

        document.getElementById('lastUpdatedBadge').innerHTML = `
          <span class="status-dot"></span> 最終更新: ${data.last_updated} (UTC)
        `;

        allDcData = data.data || {};
        renderAllColumns();

      } catch (err) {
        console.error("loadData error:", err);
        DATACENTERS.forEach(dc => {
          document.getElementById(`list-${dc}`).innerHTML = `
            <div style="text-align:center; padding:2rem; color:#ef4444;">
              <i class="fa-solid fa-triangle-exclamation"></i> データ取得エラー
            </div>
          `;
        });
      }
    }

    function renderAllColumns(searchTerm = "") {
      DATACENTERS.forEach(dc => {
        try {
          const rawItems = allDcData[dc] || [];
          
          let items = rawItems;
          if (searchTerm) {
            items = rawItems.filter(item => 
              item.item_name.toLowerCase().includes(searchTerm) ||
              item.item_id.toString().includes(searchTerm)
            );
          }

          // 重複除外
          const seenKeys = new Set();
          const uniqueItems = [];
          
          for (const item of items) {
            const q = item.quality || "NONE";
            const dupKey = `${item.item_id}_${q}`;
            
            if (q === "NONE" && seenKeys.has(`${item.item_id}_NQ`)) continue;
            if (q === "NQ" && seenKeys.has(`${item.item_id}_NONE`)) continue;

            if (!seenKeys.has(dupKey)) {
              seenKeys.add(dupKey);
              uniqueItems.push(item);
            }
          }

          document.getElementById(`count-${dc}`).innerText = `${uniqueItems.length}件`;
          const listEl = document.getElementById(`list-${dc}`);

          if (uniqueItems.length === 0) {
            listEl.innerHTML = `
              <div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.85rem;">
                高回転アイテム未検知
              </div>
            `;
            return;
          }

          listEl.innerHTML = uniqueItems.map((item, idx) => {
            const q = item.quality || "NONE";
            let qualityBadge = "";
            
            if (q === "HQ" || (item.item_name && item.item_name.includes("[HQ]"))) {
              qualityBadge = `<span class="quality-badge quality-hq"><i class="fa-solid fa-crown"></i> HQ</span>`;
            } else if (q === "NQ" || (item.item_name && item.item_name.includes("[NQ]"))) {
              qualityBadge = `<span class="quality-badge quality-nq"><i class="fa-solid fa-box"></i> NQ</span>`;
            }

            let displayTitle = item.item_name || `Item ${item.item_id}`;
            if (displayTitle.includes("Unknown") && FRONTEND_NAME_MAP[item.item_id]) {
              displayTitle = FRONTEND_NAME_MAP[item.item_id];
            }

            let cleanTitle = escapeHtml(displayTitle);
            if (q === "NONE") {
              cleanTitle = cleanTitle.replace(/\s*\[(NQ|HQ)\]\s*$/, "");
            }

            // 1. 在庫消化日数タグ
            let stockTag = "";
            if (item.days_to_clear !== undefined && item.days_to_clear !== null && item.days_to_clear <= 3.0) {
              stockTag = `<span class="tag-stock"><i class="fa-solid fa-hourglass-half"></i> 消化: 約${Number(item.days_to_clear).toFixed(1)}日分</span>`;
            }

            // 2. 割安度タグ
            let discountTag = "";
            if (item.discount_rate !== undefined && item.discount_rate !== null && item.discount_rate >= 15.0) {
              discountTag = `<span class="tag-discount"><i class="fa-solid fa-tags"></i> 割安 ${Number(item.discount_rate).toFixed(0)}% OFF</span>`;
            }

            // 3. クロスDC転売利益バナー
            let crossProfitBox = "";
            if (item.cross_info && item.cross_info.profit_rate >= 5.0) {
              const ci = item.cross_info;
              crossProfitBox = `
                <div class="cross-profit-box">
                  <span class="profit-route"><i class="fa-solid fa-arrow-right-arrow-left"></i> 買: ${ci.cheap_scope} (${Number(ci.cheap_price).toLocaleString()}G)</span>
                  <span class="profit-rate">+${Number(ci.profit_gil).toLocaleString()}G (${ci.profit_rate}%)</span>
                </div>
              `;
            }

            const unitsStr = (item.units_for_sale !== undefined && item.units_for_sale !== null) 
              ? `${Number(item.units_for_sale).toLocaleString()}個` 
              : '-';

            const minPriceStr = (item.min_price !== undefined && item.min_price !== null) 
              ? `${Number(item.min_price).toLocaleString()}G` 
              : '-';

            const avgPriceStr = (item.avg_price !== undefined && item.avg_price !== null) 
              ? `${Number(item.avg_price).toLocaleString()}G` 
              : '-';

            const velStr = (item.velocity !== undefined && item.velocity !== null) 
              ? Number(item.velocity).toFixed(1) 
              : '0.0';

            // リテイナー出品枠数の確実な復活表示（例: (45出品)）
            let listingsText = "";
            if (item.listings_count && item.listings_count > 0) {
              listingsText = ` (${item.listings_count}出品)`;
            }

            return `
              <div class="item-card">
                <div class="item-card-header">
                  <span class="rank-tag">#${idx + 1}</span>
                  <span class="item-card-title">${cleanTitle}</span>
                  ${qualityBadge}
                </div>
                
                <div class="item-stats-row">
                  <span class="velocity-badge"><i class="fa-solid fa-bolt"></i> ${velStr} 個/日</span>
                  <span class="price-main"><span class="price-label">最安:</span>${minPriceStr}</span>
                </div>

                <div class="analytics-tag-row">
                  ${stockTag}
                  ${discountTag}
                </div>

                <div class="item-sub-grid">
                  <div>平均: ${avgPriceStr}</div>
                  <div>在庫: ${unitsStr}${listingsText}</div>
                </div>

                ${crossProfitBox}
              </div>
            `;
          }).join('');
        } catch (colErr) {
          console.error(`Error rendering column ${dc}:`, colErr);
        }
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      renderAllColumns(term);
    });

    setInterval(loadData, 60000);
    loadData();
  </script>
</body>
</html>
