name: Scheduled Market Research Update

on:
  schedule:
    # 15分ごとに4DCをローテーション実行 (00分:Elemental, 15分:Gaia, 30分:Mana, 45分:Meteor)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Cache SQLite Database
        uses: actions/cache@v4
        with:
          path: data/
          key: market-db-${{ runner.os }}-v2
          restore-keys: |
            market-db-${{ runner.os }}-v2

      - name: Determine Target DC for Rotation
        id: dc_select
        run: |
          MINUTE=$(date +%M)
          if [ "$MINUTE" -lt 15 ]; then
            TARGET_DC="Elemental"
          elif [ "$MINUTE" -lt 30 ]; then
            TARGET_DC="Gaia"
          elif [ "$MINUTE" -lt 45 ]; then
            TARGET_DC="Mana"
          else
            TARGET_DC="Meteor"
          fi
          echo "TARGET_DC=$TARGET_DC" >> $GITHUB_ENV
          echo "Selected Target DC: $TARGET_DC (Minute: $MINUTE)"

      - name: Run Market Research Pipeline
        run: |
          python main.py --dc $TARGET_DC

      - name: Commit and push updated web data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FFXIV Market Research Data ($TARGET_DC) [skip ci]" && git pull origin main --rebase && git push)
