name: Scheduled Market Research Update

on:
  schedule:
    # 15分間隔で各DCを交代（ローテーション）実行
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      target_dc:
        description: 'Target Datacenter to update'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Auto
          - Mana
          - Elemental
          - Gaia
          - Meteor

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Cache SQLite Database
        uses: actions/cache@v4
        with:
          path: data/
          key: market-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-db-${{ runner.os }}-

      - name: Determine Target DC for Execution
        id: dc_select
        run: |
          INPUT_DC="${{ inputs.target_dc }}"
          if [ -n "$INPUT_DC" ] && [ "$INPUT_DC" != "Auto" ]; then
            TARGET_DC="$INPUT_DC"
          else
            MINUTE=$(date +%M)
            if [ "$MINUTE" -ge 7 ] && [ "$MINUTE" -lt 22 ]; then
              TARGET_DC="Elemental"
            elif [ "$MINUTE" -ge 22 ] && [ "$MINUTE" -lt 37 ]; then
              TARGET_DC="Gaia"
            elif [ "$MINUTE" -ge 37 ] && [ "$MINUTE" -lt 52 ]; then
              TARGET_DC="Mana"
            else
              TARGET_DC="Meteor"
            fi
          fi
          echo "TARGET_DC=$TARGET_DC" >> $GITHUB_ENV
          echo "Selected Target DC: $TARGET_DC"


      - name: Run Market Research Pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$TARGET_DC" = "All" ]; then
            python -u main.py
          else
            python -u main.py --dc $TARGET_DC
          fi

      - name: Commit and push updated web data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FFXIV Market Research Data ($TARGET_DC)" && git pull origin main --rebase && git push)


