name: Scheduled Market Research Update

on:
  schedule:
    # 3時間ごとに定期実行
    - cron: '0 */3 * * *'
  workflow_dispatch: # 手動実行ボタン
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Market Research Pipeline
        run: |
          python main.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/icons_map.json docs/items_search.json data/market_data.db check_data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FFXIV Market Research Data [skip ci]" && git push)
