name: Scheduled Market Research Update

on:
  schedule:
    # 1時間ごとに定期実行 (渋滞・タイムアウト防止)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行ボタン

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Cache SQLite Database
        uses: actions/cache@v4
        with:
          path: data/
          key: market-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-db-${{ runner.os }}-

      - name: Run Market Research Pipeline
        run: |
          python main.py

      - name: Commit and push updated web data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FFXIV Market Research Data [skip ci]" && git pull origin main --rebase && git push)
