name: Scheduled Market Research Update

on:
  schedule:
    # 30分間隔で全4DCを一括更新 (毎時23分, 53分)
    - cron: '23,53 * * * *'
  workflow_dispatch:
    inputs:
      target_dc:
        description: 'Target Datacenter to update'
        required: true
        default: 'All'
        type: choice
        options:
          - All
          - Mana
          - Elemental
          - Gaia
          - Meteor

permissions:
  contents: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Cache SQLite Database
        uses: actions/cache@v4
        with:
          path: data/
          key: market-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-db-${{ runner.os }}-

      - name: Determine Target DC for Execution
        id: dc_select
        run: |
          INPUT_DC="${{ inputs.target_dc }}"
          if [ -n "$INPUT_DC" ]; then
            TARGET_DC="$INPUT_DC"
          else
            TARGET_DC="All"
          fi
          echo "TARGET_DC=$TARGET_DC" >> $GITHUB_ENV
          echo "Selected Target DC: $TARGET_DC"

      - name: Run Market Research Pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$TARGET_DC" = "All" ]; then
            python -u main.py
          else
            python -u main.py --dc $TARGET_DC
          fi

      - name: Commit and push updated web data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for i in {1..3}; do
            git fetch origin main
            git reset origin/main
            git add -f docs/data.json.gz
            if git diff --staged --quiet; then
              echo "No changes to commit or push."
              break
            fi
            git commit -m "Auto-update FFXIV Market Research Data ($TARGET_DC)"
            if git push origin main; then
              echo "Successfully pushed updated market data."
              break
            fi
            echo "Push failed due to remote changes, retrying ($i/3)..."
            sleep 3
          done

