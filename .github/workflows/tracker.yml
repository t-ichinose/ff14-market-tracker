name: FF14 Market Tracker

on:
  schedule:
    # 1時間ごとに自動実行 (UTC基準)
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動コミット権限

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Market Tracker & Generate Web Data
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/market_data.db docs/data.json docs/index.html
        git commit -m "Auto-update market database and web dashboard [skip ci]" || exit 0
        git push
